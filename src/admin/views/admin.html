<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小蝸出租 · 管理後台</title>
<link rel="icon" type="image/png" href="https://xiaowo-rental.vercel.app/favicon.png">
<style>
  :root {
    --cream: #F6F8F5;
    --sage: #7A9E7E;
    --deep-sage: #2F6B46;
    --charcoal: #17211C;
    --white: #FFFFFF;
    --warn: #E8A87C;
    --danger: #D97070;
    --line: #E7ECE7;
    --muted: #6B7280;
    --soft-sage: #EEF6EF;
    --shadow: 0 16px 40px rgba(22, 38, 30, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", -apple-system, sans-serif;
    background: linear-gradient(135deg, #F7FAF7 0%, #F2F5F1 100%);
    color: var(--charcoal);
    min-height: 100vh;
  }
  #loginView {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; flex-direction: column; gap: 20px;
  }
  #loadingView {
    display: none; align-items: center; justify-content: center;
    min-height: 100vh; flex-direction: column; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #E5E0D5;
    border-top-color: var(--sage); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingView p { color: #888; font-size: 14px; }
  .login-card {
    background: var(--white); padding: 40px; border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center;
    max-width: 360px; width: 90%;
  }
  .login-logo { display:block; width:min(240px,100%); height:auto; margin:0 auto 14px; object-fit:contain; }
  .login-card p { color: #888; font-size: 14px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 14px; border: 2px solid #E5E0D5;
    border-radius: 12px; font-size: 16px; margin-bottom: 16px;
    outline: none; transition: border .2s;
  }
  .login-card input:focus { border-color: var(--sage); }
  .btn {
    background: var(--sage); color: white; border: none;
    padding: 14px 28px; border-radius: 12px; font-size: 16px;
    cursor: pointer; width: 100%; font-weight: 700;
    transition: background .2s, opacity .2s, transform .08s;
    position: relative; overflow: hidden;
  }
  .btn:hover { background: var(--deep-sage); }
  .btn:active { transform: scale(0.96) !important; }
  /* loading state */
  .btn.loading, .action-btn.loading {
    opacity: 0.65; pointer-events: none; cursor: not-allowed;
  }
  .btn.loading::after, .action-btn.loading::after {
    content: '';
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: white;
    border-radius: 50%;
    animation: btnSpin 0.7s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  .action-btn.loading::after {
    border-color: rgba(78,113,83,0.4);
    border-top-color: var(--deep-sage);
  }
  @keyframes btnSpin { to { transform: rotate(360deg); } }
  /* 給非 .btn/.action-btn 的小型可點擊元素用（如表格內鉛筆、分頁小圓鈕）：點擊後立即可見轉圈回饋 */
  .spin-btn.loading { opacity: 0.5; pointer-events: none; }
  .spin-btn.loading::after {
    content: ''; display: inline-block; width: 10px; height: 10px;
    border: 2px solid rgba(0,0,0,0.2); border-top-color: var(--deep-sage, #4A6741);
    border-radius: 50%; animation: btnSpin 0.7s linear infinite;
    margin-left: 5px; vertical-align: middle;
  }
  /* ripple on click */
  .btn-ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0); animation: ripple 0.5s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  #mainView { display: none; min-height: 100vh; }
  .app-shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    background: rgba(255,255,255,.86);
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh;
    backdrop-filter: blur(18px);
  }
  .brand { display:flex;align-items:center;padding:4px 12px 18px; }
  .brand-logo { display:block;width:170px;max-width:100%;height:auto;object-fit:contain; }
  .tabs {
    display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; max-width: none;
  }
  .tab {
    width: 100%; display:flex;align-items:center;gap:12px;
    padding: 13px 16px; border-radius: 8px; border: none;
    background: transparent; color: #111827; font-size: 15px;
    cursor: pointer; font-weight: 700; text-align: left;
    transition: background .15s, color .15s, transform .08s;
  }
  .tab:hover { background: #F3F7F3; }
  .tab.active { background: linear-gradient(90deg, #EAF3EC, #F5F8F5); color: var(--deep-sage); }
  .tab-icon { width:22px;text-align:center;font-size:16px; }
  /* 分組下拉式導覽 */
  .nav-group { position:relative; }
  .nav-group-btn { width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:8px;border:none;background:transparent;color:#111827;font-size:15px;cursor:pointer;font-weight:700;text-align:left;transition:background .15s,color .15s; white-space:nowrap; }
  .nav-group-btn:hover { background:#F3F7F3; }
  .nav-group-btn.active { background:linear-gradient(90deg,#EAF3EC,#F5F8F5);color:var(--deep-sage); }
  .nav-group-caret { margin-left:auto;font-size:11px;color:#9aa2a0;transition:transform .15s; }
  .nav-group.open .nav-group-caret { transform:rotate(180deg); }
  .nav-group-menu { display:none;position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);min-width:190px;max-width:calc(100vw - 16px);padding:6px; }
  .nav-group.open .nav-group-menu { display:block; }
  .nav-leaf { display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:600;color:#111827;text-align:left;cursor:pointer;white-space:nowrap; }
  .nav-leaf:hover { background:#F3F7F3; }
  .nav-leaf.active { background:#EAF3EC;color:var(--deep-sage); }
  .quick-panel, .help-panel {
    margin-top: auto;
    background: linear-gradient(135deg, #F4FAF4, #FFFFFF);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 10px 24px rgba(20,40,28,.04);
  }
  .help-panel { margin-top: 0; }
  .quick-panel h4, .help-panel h4 { font-size:13px;color:var(--deep-sage);margin-bottom:10px; }
  .quick-actions { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
  .quick-actions button {
    border:1px solid var(--line); background:white; border-radius:8px;
    padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; color:#26362D;
  }
  .help-panel p { font-size:13px;line-height:1.5;color:#4B5563; }
  .main-panel { min-width:0;padding:32px 36px 48px; }
  header {
    background: transparent; color: var(--charcoal); padding: 0; margin-bottom: 28px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  }
  .page-title h1 { font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:900;letter-spacing:0; }
  .page-title p { font-size:14px;color:var(--muted);margin:0;opacity:1; }
  .top-actions { display:flex;align-items:center;gap:14px; }
  .mobile-logout-btn { display:none; }
  .icon-button {
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:white;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(20,40,28,.05);
  }
  .user-chip { display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 2px 8px rgba(20,40,28,.08); }
  .mobile-account { display:none; }
  .uc-avatar { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#2C6B45,#4A9060);color:white;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0; }
  .uc-info { display:flex;flex-direction:column;gap:0;line-height:1.2; }
  .uc-name { font-size:13px;font-weight:700;color:var(--charcoal); }
  .uc-role { font-size:10px;color:#aaa; }
  .ig-chip { padding:4px 11px;border-radius:20px;font-size:12px;cursor:pointer;border:1.5px solid #dde6de;background:white;color:var(--charcoal);transition:all .12s;line-height:1.4; }
  .ig-chip.on { background:var(--sage);color:white;border-color:var(--sage); }
  .top-actions a, .top-actions button { color:#26362D !important;background:white !important;border:1px solid var(--line) !important;border-radius:8px !important;text-decoration:none !important; }
  .stats {
    display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 18px;
    padding: 0; max-width: none; margin: 0 0 26px;
  }
  .stat-card {
    background: var(--white); border-radius: 8px; padding: 24px 22px;
    text-align: left; box-shadow: var(--shadow); border:1px solid rgba(230,236,231,.8);
    min-height: 122px; display:flex;align-items:center;gap:20px;
  }
  .stat-icon { width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0; }
  .stat-card:nth-child(1) .stat-icon { background:#DCEEDF;color:#3F7A4E; }
  .stat-card:nth-child(2) .stat-icon { background:#DCEBFF;color:#1D64B8; }
  .stat-card:nth-child(3) .stat-icon { background:#FFE8BD;color:#B96D00; }
  .stat-card:nth-child(4) .stat-icon { background:#E8D9FF;color:#6F3DCB; }
  .stat-card .num { font-size: 30px; line-height:1; font-weight: 900; color: #111827; }
  .stat-card .label { font-size: 14px; color: #374151; margin-top: 8px; }
  .stat-card .delta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .content { max-width: none; margin: 0; padding: 0; }
  /* 對帳明細表：所有儲存格垂直置中，日期/金額等欄位對齊 */
  #leaseLedgerModal table td, #leaseLedgerModal table th { vertical-align: middle; }
  .card {
    background: var(--white); border-radius: 8px; padding: 18px;
    margin-bottom: 12px; box-shadow: 0 6px 20px rgba(20,40,28,.04); border:1px solid var(--line);
  }
  .card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .card .meta { font-size: 13px; color: #888; line-height: 1.7; }
  .uid {
    font-family: monospace; font-size: 12px; background: var(--cream);
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
    word-break: break-all; display: inline-block; margin-top: 4px;
  }
  .uid:hover { background: #E5E0D5; }
  .emoji-icon { width:1.08em;height:1.08em;display:inline-flex;align-items:center;justify-content:center;color:currentColor;vertical-align:-0.16em;margin:0 .08em; }
  .emoji-icon svg { width:100%;height:100%;display:block; }
  .user-tabs { display:flex;align-items:center;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto; }
  .user-tab { border:none;background:transparent;padding:12px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:900;color:var(--muted);white-space:nowrap; }
  .user-tab.active { color:var(--deep-sage);border-bottom-color:var(--deep-sage); }
  .user-panel { display:grid;gap:12px; }
  .tenant-card { display:grid;grid-template-columns:56px minmax(180px,1.5fr) minmax(140px,.8fr) minmax(220px,1fr);gap:14px;align-items:center; }
  .tenant-avatar { width:56px;height:56px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;position:relative;overflow:hidden;color:var(--deep-sage); }
  .tenant-avatar-img { position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%; }
  .tenant-main { min-width:0; }
  .tenant-name-row { display:flex;align-items:flex-start;gap:8px;margin:0;min-width:0; }
  .tenant-name { margin:0;font-size:17px;font-weight:900;color:#111827;line-height:1.35;word-break:break-word; }
  .tenant-note { margin-left:4px;font-size:12px;color:var(--muted);font-weight:700;word-break:break-word;align-self:center; }
  .tenant-edit-icon { border:none;background:transparent;color:var(--muted);cursor:pointer;padding:2px;display:inline-flex;align-items:center;justify-content:center;align-self:center; }
  .tenant-edit-icon:hover { color:var(--deep-sage); }
  .tenant-field { min-width:0;background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:10px 12px; }
  .tenant-field .label { font-size:11px;color:var(--muted);font-weight:900;margin-bottom:5px; }
  .tenant-field .value { font-size:13px;color:#111827;font-weight:800;line-height:1.45;word-break:break-word; }
  .tenant-field .uid { margin-top:0;max-width:100%; }
  .tenant-mobile-caret { display:none;margin-left:auto;color:var(--muted);font-size:12px; }
  .tenant-inline-edit { display:none;align-items:center;gap:6px;flex-wrap:wrap; }
  .tenant-inline-edit.open { display:inline-flex; }
  .tenant-inline-edit label { display:none; }
  .tenant-edit-row { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
  .tenant-edit-row input { width:180px;border:1.5px solid #E5E0D5;border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none; }
  .tenant-edit-row input:focus { border-color:var(--sage); }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 99px;
    font-size: 12px; font-weight: 700;
  }
  .badge.PENDING { background: #FBF0E3; color: #C98B4E; }
  .badge.CONFIRMED, .badge.IN_PROGRESS, .badge.AVAILABLE { background: #E8F1E9; color: var(--deep-sage); }
  .badge.DONE, .badge.COMPLETED, .badge.RENTED { background: #EEE; color: #888; }
  .badge.CANCELLED, .badge.REJECTED { background: #FAEAEA; color: var(--danger); }
  .badge.PAUSED, .badge.INACTIVE { background: #F3F0E8; color: #A89B6C; }
  .badge.COMING_SOON { background: #E3F0FB; color: #2979B8; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .action-btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: white; color: #1F2937; font-size: 13px;
    cursor: pointer; font-weight: 500;
    position: relative; overflow: hidden;
    transition: background .15s, color .15s, transform .08s;
  }
  .action-btn:hover { background: var(--soft-sage); color: var(--deep-sage); }
  .action-btn:active { transform: scale(0.94) !important; }
  .action-btn.danger { border-color: var(--danger); color: var(--danger); }
  .action-btn.danger:hover { background: var(--danger); color: white; }
  .landlord-card { padding:0;overflow:hidden; }
  .landlord-head { display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;cursor:pointer;user-select:none; }
  .landlord-title { display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0; }
  .landlord-name { font-size:16px;font-weight:900;color:#111827; }
  .landlord-status { display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;background:#F4F7F4;color:var(--deep-sage);font-size:12px;font-weight:800; }
  .landlord-status.warn { background:#FFF5E7;color:#B76E13; }
  .landlord-body { display:none;padding:0 20px 18px;border-top:1px solid var(--line); }
  .landlord-info-grid { display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-top:16px; }
  .landlord-info-item { background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0; }
  .landlord-info-item.full { grid-column:1/-1; }
  .landlord-info-item .label { font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px; }
  .landlord-info-item .value { font-size:14px;color:#111827;font-weight:700;line-height:1.45;word-break:break-word; }
  .landlord-key-row { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
  .landlord-icon-btn { width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:white;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#26362D; }
  .landlord-icon-btn:hover { background:var(--soft-sage);color:var(--deep-sage); }
  .landlord-tools { display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line); }
  .landlord-tools .action-btn { width:100%;display:flex;align-items:center;justify-content:center;gap:6px; }
  .admin-modal-overlay { position:fixed;inset:0;background:rgba(17,24,39,.48);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px; }
  .admin-modal { width:100%;max-width:720px;max-height:92vh;overflow:auto;background:white;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.22); }
  .admin-modal-head { display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line); }
  .admin-modal-title { margin:0;font-size:20px;font-weight:900;color:#111827; }
  .admin-modal-subtitle { margin:5px 0 0;font-size:13px;color:var(--muted); }
  .admin-modal-close { border:none;background:#F5F7F5;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1; }
  .admin-modal-body { padding:22px 24px; }
  .admin-modal-foot { display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:#FAFBFA;position:sticky;bottom:0; }
  .modal-form-grid { display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:14px; }
  .modal-form-grid .full { grid-column:1/-1; }
  .modal-field label { display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px; }
  .modal-field input { width:100%;border:1.5px solid #E5E0D5;border-radius:10px;padding:11px 12px;font-size:14px;outline:none;font-family:inherit; }
  .modal-field input:focus { border-color:var(--sage); }
  .modal-note { margin-top:12px;padding:12px;border-radius:10px;background:#F4F7F4;color:#3F5B43;font-size:13px;line-height:1.55; }
  .modal-toggle-row { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#FAFBFA; }
  .modal-choice-grid { display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:12px; }
  .modal-choice { border:1px solid var(--line);border-radius:10px;background:white;padding:14px;text-align:left;cursor:pointer; }
  .modal-choice strong { display:block;font-size:14px;margin-bottom:5px;color:#111827; }
  .modal-choice span { display:block;font-size:12px;color:var(--muted);line-height:1.45; }
  .modal-choice:hover { background:var(--soft-sage);border-color:#D5E3D7; }
  .empty { text-align: center; color: #aaa; padding: 50px 0; font-size: 14px; }
  .form-box { background: var(--white); border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border:1px solid var(--line); }
  .form-box h3 { margin-bottom: 14px; }
  .section-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px; }
  .section-head h3 { margin:0;font-size:17px; }
  .overview-grid { display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start; }
  .overview-grid section:first-child { grid-row: span 2; }
  .overview-row { display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line); }
  .overview-row:first-of-type { border-top:none; }
  .overview-row strong { display:block;font-size:14px;color:#111827;margin-bottom:4px; }
  .overview-row span { font-size:12px;color:var(--muted); }
  .admin-toolbar { display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap; }
  .admin-toolbar-left, .admin-toolbar-right { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
  .admin-primary { background:var(--deep-sage)!important;color:white!important;border:none!important;box-shadow:0 10px 24px rgba(47,107,70,.22); }
  .property-table { background:white;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden; }

    background: linear-gradient(125deg, #7A5B3A 0%, #A07840 100%);
    color: white; box-shadow: 0 3px 14px rgba(122,91,58,.30);
    transform: rotateY(180deg);

  .role-face-hint { font-size: 10px; opacity: 0.72; margin-top: 1px; white-space: nowrap; }
  /* sheen sweep on flip */
  .role-face::after {
    content: ''; position: absolute; top: 0; left: -80%; width: 55%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-18deg); pointer-events: none;
  }

    animation: rfSheen 0.52s ease-out forwards;
  }
  @keyframes rfSheen { 0% { left: -80%; } 100% { left: 160%; } }
  .role-flipcard.switching { pointer-events: none; }
  @media (max-width: 600px) {
    .role-flipcard { width: 148px; height: 44px; }
    .role-face { padding: 0 10px; gap: 7px; }
    .role-face-icon { font-size: 17px; }

    .role-face-hint { font-size: 9.5px; }

function uiIconMarkup(emoji) {
  var name = UI_ICON_MAP[emoji] || UI_ICON_MAP[emoji.replace(/\uFE0F/g, '')]
  if (!name) return emoji
  return '<span class="emoji-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + uiIconPath(name) + '</svg></span>'
}

function uiLineIcon(name, extraClass) {
  return '<span class="emoji-icon ' + (extraClass || '') + '" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + uiIconPath(name) + '</svg></span>'
}

function createUiIconNode(emoji) {
  var span = document.createElement('span')
  span.innerHTML = uiIconMarkup(emoji)
  return span.firstChild || document.createTextNode(emoji)
}

function iconizeTextNode(node) {
  var text = node.nodeValue
  UI_EMOJI_RE.lastIndex = 0
  if (!text || !UI_EMOJI_RE.test(text)) return
  UI_EMOJI_RE.lastIndex = 0
  var fragment = document.createDocumentFragment()
  var lastIndex = 0
  text.replace(UI_EMOJI_RE, function(match, group, offset) {
    if (offset > lastIndex) fragment.appendChild(document.createTextNode(text.slice(lastIndex, offset)))
    fragment.appendChild(createUiIconNode(match))
    lastIndex = offset + match.length
    return match
  })
  if (lastIndex < text.length) fragment.appendChild(document.createTextNode(text.slice(lastIndex)))
  node.parentNode.replaceChild(fragment, node)
}

function skipIconize(node) {
  if (!node || node.nodeType !== 1) return false
  return ['SCRIPT','STYLE','TEXTAREA','INPUT','SVG'].indexOf(node.tagName) >= 0 || (node.closest && node.closest('.emoji-icon'))
}

function iconizeEmoji(root) {
  root = root || document.body
  if (!root || skipIconize(root)) return
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) { return skipIconize(node.parentElement) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }
  })
  var nodes = []
  while (walker.nextNode()) nodes.push(walker.currentNode)
  nodes.forEach(iconizeTextNode)
}

document.addEventListener('DOMContentLoaded', function() {
  iconizeEmoji()
  var observer = new MutationObserver(function(records) {
    records.forEach(function(record) {
      Array.prototype.forEach.call(record.addedNodes, function(node) {
        if (node.nodeType === 3) iconizeTextNode(node)
        else if (node.nodeType === 1) iconizeEmoji(node)
      })
    })
  })
  observer.observe(document.body, { childList: true, subtree: true })
})

var DATA = null
var KEY = ''

// 後台金鑰改走 HTTP header：自動把 /admin/api/ 請求網址上的 ?key= 拿掉，改放 X-Admin-Key
// header，金鑰就不會出現在網址與伺服器日誌。包一層 fetch，呼叫端不必逐一修改。
;(function () {
  var _origFetch = window.fetch
  window.fetch = function (input, init) {
    try {
      if (typeof input === 'string' && input.indexOf('/admin/api/') !== -1) {
        var u = new URL(input, window.location.origin)
        var urlKey = u.searchParams.get('key')
        u.searchParams.delete('key')
        init = init || {}
        var h = init.headers || {}
        if (typeof Headers !== 'undefined' && h instanceof Headers) {
          var o = {}; h.forEach(function (v, k) { o[k] = v }); h = o
        }
        var theKey = (typeof KEY !== 'undefined' && KEY) ? KEY : urlKey
        if (theKey) h['X-Admin-Key'] = theKey
        init.headers = h
        input = u.pathname + (u.search || '') + (u.hash || '')
      }
    } catch (e) {}
    var isAdminApi = typeof input === 'string' && input.indexOf('/admin/api/') !== -1 && input.indexOf('/admin/api/login') === -1
    return _origFetch.call(this, input, init).then(function (res) {
      // 登入過期（8 小時）或 session 失效 → 統一導回登入，避免只顯示 unauthorized
      // 只在「已登入狀態」(DATA 已載入) 觸發，避免初次登入畫面誤報
      if (res && res.status === 401 && isAdminApi && typeof DATA !== 'undefined' && DATA) { try { handleSessionExpired() } catch (e) {} }
      return res
    })
  }
})()

// 未登入/過期時的處理：預設導回前站會員中心（社群登入後可從「房東模式」再進來），
// 不再停留在金鑰登入頁。金鑰登入頁保留為緊急備援，網址加 ?login=key 可叫出。
function adminReloginRedirect() {
  if (new URLSearchParams(location.search).get('login') === 'key') {
    var mv = document.getElementById('mainView'); if (mv) mv.style.display = 'none'
    var lv = document.getElementById('loadingView'); if (lv) lv.style.display = 'none'
    var login = document.getElementById('loginView'); if (login) login.style.display = 'flex'
    return
  }
  location.href = 'https://xiaowo-rental.vercel.app/api/sso/linebot'
}

var _sessionExpiredShown = false
function handleSessionExpired() {
  if (_sessionExpiredShown) return
  _sessionExpiredShown = true
  try { showToast('⚠️ 登入已過期，請重新登入') } catch (e) {}
  KEY = ''
  try { sessionStorage.removeItem('adminKey') } catch (e) {}
  setTimeout(adminReloginRedirect, 900)
}

restoreSession()

async function restoreSession() {
  document.getElementById('loginView').style.display = 'none'
  document.getElementById('loadingView').style.display = 'flex'
  try {
    var res = await fetch('/admin/api/data')
    if (!res.ok) throw new Error('no session')
    DATA = await res.json()
    enterAdmin()
  } catch (e) {
    document.getElementById('loadingView').style.display = 'none'
    adminReloginRedirect()
  }
}

async function login(savedKey) {
  var key = savedKey || document.getElementById('keyInput').value.trim()
  if (!key) return
  try {
    var res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    })
    if (!res.ok) {
      showToast('❌ 密碼錯誤')
      sessionStorage.removeItem('adminKey')
      document.getElementById('loadingView').style.display = 'none'
      document.getElementById('loginView').style.display = 'flex'
      return
    }
    var dataRes = await fetch('/admin/api/data')
    if (!dataRes.ok) throw new Error('session data failed')
    DATA = await dataRes.json()
    KEY = ''
    sessionStorage.removeItem('adminKey')
    enterAdmin()
  } catch (e) {
    showToast('❌ 連線失敗')
    document.getElementById('loadingView').style.display = 'none'
    document.getElementById('loginView').style.display = 'flex'
  }
}

    var impersonating = DATA.impersonating === true

      if (umDropName) umDropName.textContent = DATA.account
      if (umDropRole) umDropRole.textContent = roleLabel
      if (mobileAccountAvatar) mobileAccountAvatar.textContent = initial
      if (mobileAccountName) mobileAccountName.textContent = DATA.account
      if (mobileAccountRole) mobileAccountRole.textContent = roleLabel
    }
    // 身份切換選項（整合在右上角帳號選單；只有總管理員／仲介視角才有）
    var userChip = document.getElementById('userChip')
    if (userChip) userChip.style.display = 'flex'
    var switchDesktop = '', switchMobile = ''
    if (impersonating) {
      switchDesktop = '<div class="um-item" onclick="switchToSuper()">🏛️ 返回總管理員</div>'
      switchMobile = '<button type="button" style="color:#26362D;border-bottom:1px solid var(--line);" onclick="switchToSuper()">🏛️ 返回總管理員</button>'
    } else if (DATA.role === 'super') {
      switchDesktop = '<div class="um-item" onclick="switchToBroker()">🏘️ 切換仲介視角</div>'
      switchMobile = '<button type="button" style="color:#26362D;border-bottom:1px solid var(--line);" onclick="switchToBroker()">🏘️ 切換仲介視角</button>'
    }
    var umSwitchItem = document.getElementById('umSwitchItem')
    var mobileSwitchItem = document.getElementById('mobileSwitchItem')
    if (umSwitchItem) umSwitchItem.innerHTML = switchDesktop
    if (mobileSwitchItem) mobileSwitchItem.innerHTML = switchMobile
    // 關閉可能開著的選單
    var umDd = document.getElementById('umDropdown'); if (umDd) umDd.classList.remove('open')
    var mDd = document.getElementById('mobileAccountMenu'); if (mDd) mDd.classList.remove('open')
    refreshOwnFeatures()
    if (DATA.siteUrl) {
      var brandLink = document.getElementById('brandHomeLink')
      if (brandLink) brandLink.href = DATA.role === 'landlord' && DATA.landlordId
        ? DATA.siteUrl + '/site/' + DATA.landlordId
        : DATA.siteUrl
    }
    // \u5982\u679c\u7576\u524d tab \u88ab\u529f\u80fd\u6a21\u7d44\u95dc\u6389\uff0c\u5207\u5230\u7e3d\u89bd
    // 重新整理後留在原本的分頁
    var savedTab = sessionStorage.getItem('adminTab')
    if (savedTab) currentTab = savedTab
    if (currentTab === 'tenants' && DATA.role !== 'super' && !feat('tenants')) currentTab = 'overview'
    renderTabBar()
    renderStats()
    renderTab()
}

// 總管理員 → 仲介視角（建立 imp:true 模擬 session，畫面等同仲介本人登入）
async function switchToBroker() {
  try {
    var res = await fetch('/admin/api/switch-to-broker', { method: 'POST' })
    var d = await res.json().catch(function(){ return {} })
    if (!res.ok) { showToast('❌ ' + (d.error || '無法切換仲介視角')); return }
    var dataRes = await fetch('/admin/api/data')
    if (!dataRes.ok) { showToast('❌ 資料載入失敗'); return }
    DATA = await dataRes.json()
    showToast('🔄 已切換至仲介視角：' + (d.name || ''))
    enterAdmin()
  } catch (e) { showToast('❌ 連線失敗') }
}

// 仲介視角 → 返回總管理員（僅 imp:true 的 session 可用；真正房東無法藉此提權）
async function switchToSuper() {
  try {
    var res = await fetch('/admin/api/switch-to-super', { method: 'POST' })
    var d = await res.json().catch(function(){ return {} })
    if (!res.ok) { showToast('❌ ' + (d.error || '無法返回總管理員')); return }
    var dataRes = await fetch('/admin/api/data')
    if (!dataRes.ok) { showToast('❌ 資料載入失敗'); return }
    DATA = await dataRes.json()
    showToast('↩ 已返回總管理員')
    enterAdmin()
  } catch (e) { showToast('❌ 連線失敗') }
}

function availableTabs() {

  function add(id, label, icon) { t[id] = { id: id, label: label, icon: icon } }
  add('overview', '\u7e3d\u89bd', 'chart')

  add('properties', '\u623f\u6e90\u7ba1\u7406', 'home')
  if (DATA.role === 'super' || feat('booking')) add('bookings', '\u770b\u623f\u9810\u7d04', 'calendar')
  if (DATA.role === 'super' || feat('repair')) add('repairs', '\u7dad\u4fee\u7ba1\u7406', 'wrench')
  if (DATA.role === 'super' || feat('managed')) add('managed', '\u5305\u79df\u4ee3\u7ba1', 'building')
  if (DATA.role === 'super') add('landlords', '\u623f\u6771\u7ba1\u7406', 'building')
  if (DATA.role === 'super' || feat('community')) add('community', '\u793e\u5340\u7ba1\u7406', 'community')
  if (DATA.role === 'super' || feat('social')) add('socialPosting', '\u793e\u7fa4\u7ba1\u7406', 'share')
  if (DATA.role === 'super' || feat('heroSlides')) add('heroSettings', '\u9996\u9801\u8a2d\u5b9a', 'image')
  if (DATA.role === 'super') add('footerSettings', '\u9801\u5c3e\u8a2d\u5b9a', 'clipboard')
  if (DATA.role === 'landlord' && feat('bot')) add('botSettings', 'linebot\u9078\u55ae\u8a2d\u5b9a', 'wrench')

]

function renderTabBar() {
  var avail = availableTabs()
  var html = MENU_GROUPS.map(function(g) {
    if (g.tab) {
      if (!avail[g.tab]) return ''
      var active = currentTab === g.tab
      return '<div class="nav-group"><button class="nav-group-btn' + (active ? ' active' : '') + '" onclick="switchTab(\'' + g.tab + '\')">' +
        '<span class="tab-icon">' + uiLineIcon(g.icon) + '</span><span>' + g.label + '</span></button></div>'
    }
    // children \u53ef\u70ba tab \u5b57\u4e32\uff0c\u6216\u52d5\u4f5c\u7269\u4ef6 { label, icon, run | tab, feat }
    var children = (g.children || []).filter(function(c) {
      if (typeof c === 'string') return avail[c]
      if (c.tab) return avail[c.tab]
      if (c.super && !(DATA && DATA.role === 'super')) return false  // \u50c5\u7e3d\u7ba1\u7406\u54e1\u53ef\u898b
      if (c.feat && !feat(c.feat)) return false   // \u529f\u80fd\u6388\u6b0a\uff08\u9580\u9396/Ragic\uff09
      return true
    })
    if (!children.length) return ''
    var groupActive = children.some(function(c) {
      var id = (typeof c === 'string') ? c : (c.tab || null)
      return id && currentTab === id
    }) || (g.groupTab && currentTab === g.groupTab)
    var items = children.map(function(c) {
      if (typeof c === 'string') {
        var t = avail[c]
        return '<button class="nav-leaf' + (currentTab === c ? ' active' : '') + '" onclick="switchTab(\'' + c + '\')">' +
          '<span class="tab-icon">' + uiLineIcon(t.icon) + '</span><span>' + t.label + '</span></button>'
      }
      if (c.tab) {
        var t2 = avail[c.tab]
        return '<button class="nav-leaf' + (currentTab === c.tab ? ' active' : '') + '" onclick="switchTab(\'' + c.tab + '\')">' +
          '<span class="tab-icon">' + uiLineIcon(c.icon || t2.icon) + '</span><span>' + (c.label || t2.label) + '</span></button>'
      }
      // \u52d5\u4f5c\u9805\u76ee\uff1a\u5207\u5230\u5305\u79df\u4ee3\u7ba1\u9801\u5f8c\u57f7\u884c navRun
      return '<button class="nav-leaf" onclick="navRun(\'' + c.run + '\')">' +
        '<span class="tab-icon">' + uiLineIcon(c.icon) + '</span><span>' + c.label + '</span></button>'
    }).join('')
    return '<div class="nav-group">' +
      '<button class="nav-group-btn' + (groupActive ? ' active' : '') + '" onclick="toggleNavGroup(event, this)">' +
        '<span class="tab-icon">' + uiLineIcon(g.icon) + '</span><span>' + g.label + '</span><span class="nav-group-caret">\u25be</span></button>' +
      '<div class="nav-group-menu">' + items + '</div>' +
    '</div>'
  }).join('')
  document.getElementById('tabBar').innerHTML = html
}

function toggleNavGroup(e, btn) {
  e.stopPropagation()
  var g = btn.parentElement
  var wasOpen = g.classList.contains('open')
  document.querySelectorAll('.nav-group.open').forEach(function(x) { x.classList.remove('open') })
  if (!wasOpen) {
    g.classList.add('open')
    // 選單用 fixed 定位，避免被水平捲動的分頁列裁切；並避免超出右側邊界
    var menu = g.querySelector('.nav-group-menu')
    if (menu) {
      var r = btn.getBoundingClientRect()
      var w = menu.offsetWidth || 200
      var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8))
      menu.style.top = (r.bottom + 4) + 'px'
      menu.style.left = left + 'px'
    }
  }
}

function switchTab(tab) {

  document.querySelectorAll('.nav-group.open').forEach(function(x) { x.classList.remove('open') })
  renderTabBar()   // 重新渲染分組導覽以更新作用中狀態

  var el = document.getElementById('content')
  updatePageTitle()
  // 上方統計卡片只在「總覽」頁顯示
  var statsEl = document.getElementById('stats')
  if (statsEl) statsEl.style.display = (currentTab === 'overview') ? '' : 'none'

  if (currentTab === 'tenants') el.innerHTML = renderTenants()
  if (currentTab === 'bookings') el.innerHTML = renderBookings()
  if (currentTab === 'repairs') el.innerHTML = renderRepairs()
  if (currentTab === 'properties') { el.innerHTML = renderProperties(); setTimeout(renderImgPreview, 50) }

  if (currentTab === 'footerSettings') renderFooterSettings()

  if (currentTab === 'managed') renderManagedTab()

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function renderOverview() {
  var recentProps = (DATA.properties || []).slice(0, 5)
  var allNonPending = DATA.properties.filter(function(p){ return p.status !== 'PENDING' })
  var pendingBookings = DATA.bookings.filter(function(b){ return b.status === 'PENDING' }).slice(0, 4)
  var pendingRepairs = DATA.repairs.filter(function(r){ return r.status === 'PENDING' }).slice(0, 4)
  var rows = recentProps.map(function(p) {
    return '<div class="overview-row">' +
      '<div><strong>' + esc(p.title) + '</strong><span>' + esc(p.city || '') + esc(p.district || '') + ' · NT$ ' + Number(p.price || 0).toLocaleString() + '/月</span></div>' +
      '<span class="badge ' + p.status + '">' + (PROP_STATUS_LABEL[p.status] || p.status) + '</span>' +
    '</div>'
  }).join('')
  var bookings = pendingBookings.map(function(b) {
    return '<div class="overview-row"><div><strong>' + esc(b.property.title) + '</strong><span>' + fmtDate(b.date) + ' ' + esc(b.timeslot) + '</span></div><span class="badge PENDING">待確認</span></div>'
  }).join('')
  var repairs = pendingRepairs.map(function(r) {

  '</div>'
}

// ── 房源 CSV 匯出 ──────────────────────────────────────────────────
// 用 fetch（金鑰走 header）下載成 blob，再觸發下載，避免金鑰出現在網址
async function exportProperties() {
  try {
    var res = await fetch('/admin/api/property/export')
    if (!res.ok) { showToast('❌ 匯出失敗'); return }
    var blob = await res.blob()
    var url = URL.createObjectURL(blob)
    var a = document.createElement('a')
    a.href = url
    a.download = 'properties_' + new Date().toISOString().slice(0, 10) + '.csv'
    document.body.appendChild(a); a.click(); document.body.removeChild(a)
    setTimeout(function(){ URL.revokeObjectURL(url) }, 2000)
  } catch (e) { showToast('❌ 匯出失敗：' + e.message) }
}

    '縣市*','行政區*','地址*','租金*（數字）','押金（預設：兩個月）','坪數*（數字）','樓層（例：3F）','總樓層（數字）',
    '管理費（數字，預設0）','清潔費（數字）','電費方式（meter台電/flat固定金額/included含租金）',
    '每度電費（electricType=meter時填）','固定電費金額（electricType=flat時填）',
    '含網路（true/false）','含水費（true/false）','含第四台（true/false）',
    '可養寵物（true/false）','可開伙（true/false）','可短租（true/false）','歡迎學生（true/false）','精選房源（true/false）',
    '房源描述','標籤（多個用｜分隔，例：獨洗曬｜可租補｜近捷運）'
  ]
  var example = [
    '','範例套房A','SUITE','AVAILABLE','台中市','西區','台灣大道100號','8000','兩個月','8','5F','12','0','','meter','4','','true','true','false','false','true','false','true','false','採光良好，近市場','獨洗曬｜近超商｜可租補'
  ]
  var csvContent = bom + header.map(csvCell).join(',') + '\r\n' + example.map(csvCell).join(',')
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })
  var a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'property_import_template.csv'
  a.click()
}

function csvCell(v) {
  var s = String(v == null ? '' : v)
  if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('｜')) return '"' + s.replace(/"/g, '""') + '"'
  return s
}

// ── 房源 CSV 匯入 ──────────────────────────────────────────────────
async function importProperties(input) {
  var file = input.files[0]
  if (!file) return
  input.value = ''

  var resultEl = document.getElementById('importResult')
  if (resultEl) { resultEl.style.display = 'block'; resultEl.style.background = '#f5f5f0'; resultEl.innerHTML = '⏳ 匯入中，請稍候...' }

  try {
    var text = await file.text()
    var res = await fetch('/admin/api/property/import?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'text/csv' },
      body: text,
    })
    var data = await res.json()
    if (!res.ok) {
      if (resultEl) { resultEl.style.background = '#fff0f0'; resultEl.innerHTML = '❌ 匯入失敗：' + esc(data.error || '') }
      return
    }
    var msg = '✅ 匯入完成！新增 <b>' + data.created + '</b> 筆・更新 <b>' + data.updated + '</b> 筆'
    if (data.skipped) msg += '・略過 <b>' + data.skipped + '</b> 筆'
    if (data.errors && data.errors.length) {
      msg += '<br><span style="color:#c0392b;">⚠️ 錯誤：<br>' + data.errors.map(esc).join('<br>') + '</span>'
    }
    if (resultEl) { resultEl.style.background = data.errors.length ? '#fffbe6' : '#f0f8f0'; resultEl.innerHTML = msg }
    // 重新整理資料
    if (data.created || data.updated) setTimeout(function(){ location.reload() }, 1800)
  } catch(e) {
    if (resultEl) { resultEl.style.background = '#fff0f0'; resultEl.innerHTML = '❌ 連線錯誤：' + esc(e.message) }
  }
}

function approveProperty(id) {
  if (!confirm('確定通過審核並上架此房源？')) return
  fetch('/admin/api/property/' + id + '?key=' + encodeURIComponent(KEY), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'AVAILABLE' })
  }).then(function(r) { return r.json() }).then(function(d) {
    if (d.error) { showToast('❌ ' + d.error); return }
    showToast('✅ 已審核通過，房源已上架')
    reload()
  }).catch(function(e) { showToast('❌ 操作失敗：' + e.message) })
}

function rejectProperty(id) {
  if (!confirm('確定退回此房源？')) return

        '</div>' +
        '<button onclick="startEditProperty(\'' + p.id + '\')" style="padding:6px 14px;border-radius:8px;border:1.5px solid #ddd;background:white;font-size:12px;cursor:pointer;font-weight:600;">✏️ 編輯</button>' +

// ── 房源篩選（總篩選 / 房東區塊篩選）─────────────────────────────
var propertyViewTab = 'overview'
var propFilters = { location: '', type: '', rent: '', size: '', status: '', featured: '' }
var groupPropertyViewTabs = {}
var openPropertyGroups = {}
var groupPropFilters = {}

var PROPERTY_VIEW_TABS = [
  { id: 'overview', label: '總覽' },
  { id: 'available', label: '待出租' },
  { id: 'rented', label: '承租中' },
  { id: 'coming', label: '即將釋出' },
  { id: 'featured', label: '精選房源' },
  { id: 'offline', label: '已下架' },
]

function propLocationText(p) {
  return [p.city || '', p.district || ''].join('')
}

function propUrl(p) {
  var base = (DATA.siteUrl || '') + '/property/' + p.id
  var siteId = DATA.role === 'landlord' && DATA.landlordId ? DATA.landlordId : p.ownerId
  return base + (siteId ? '?site=' + siteId : '')
}

function priceBucket(price) {
  price = Number(price || 0)
  if (price <= 8000) return '0-8000'
  if (price <= 12000) return '8001-12000'
  if (price <= 18000) return '12001-18000'
  if (price <= 30000) return '18001-30000'
  return '30001-'
}

function sizeBucket(size) {
  size = Number(size || 0)
  if (size <= 5) return '0-5'
  if (size <= 8) return '5.1-8'
  if (size <= 12) return '8.1-12'
  return '12.1-'
}

function matchPropFilters(p, filters) {
  filters = filters || {}
  if (filters.location && propLocationText(p) !== filters.location) return false
  if (filters.type && p.type !== filters.type) return false
  if (filters.rent && priceBucket(p.price) !== filters.rent) return false
  if (filters.size && sizeBucket(p.size) !== filters.size) return false
  if (filters.status && p.status !== filters.status) return false
  if (filters.featured) {
    var feat = DATA.role !== 'super' ? p.siteFeatured : p.featured
    if (filters.featured === 'yes' && !feat) return false
    if (filters.featured === 'no' && feat) return false
  }
  return true
}

function matchPropertyViewTab(p, tab) {
  if (tab === 'available') return p.status === 'AVAILABLE'
  if (tab === 'rented') return p.status === 'RENTED'
  if (tab === 'coming') return p.status === 'COMING_SOON'
  if (tab === 'featured') return DATA.role !== 'super' ? !!p.siteFeatured : !!p.featured
  if (tab === 'offline') return ['INACTIVE', 'PAUSED', 'REJECTED'].indexOf(p.status) !== -1
  return true
}

function propertyTabList(list, tab) {
  return list.filter(function(p) { return matchPropertyViewTab(p, tab || propertyViewTab) })
}

function trafficSummary(list) {
  var totalToday = 0
  var total7d = 0
  var total30d = 0
  var totalAll = 0
  ;(list || []).forEach(function(p) {
    totalToday += Number(p.viewsToday || 0)
    total7d += Number(p.views7d || 0)
    total30d += Number(p.views30d || 0)
    totalAll += Number(p.viewCount || 0)
  })
  var avg7d = list && list.length ? Math.round(total7d / list.length) : 0
  var top7d = (list || []).slice().sort(function(a,b){ return Number(b.views7d || 0) - Number(a.views7d || 0) }).slice(0, 3)
  return { totalToday: totalToday, total7d: total7d, total30d: total30d, totalAll: totalAll, avg7d: avg7d, top7d: top7d }
}

function trafficDashboardHtml(list) {
  var s = trafficSummary(list)
  var topList = (list || []).slice().sort(function(a,b){ return Number(b.views7d || 0) - Number(a.views7d || 0) }).slice(0, 10)
  var first = topList[0]
  var leaderTable = topList.length
    ? '<table class="traffic-leader-table"><thead><tr><th>排名</th><th>房源</th><th style="text-align:right;">瀏覽量</th></tr></thead><tbody>' +
      topList.map(function(p, i) {
        return '<tr><td class="traffic-leader-rank">#' + (i + 1) + '</td><td class="traffic-leader-title">' + esc(p.title) + '</td><td class="traffic-leader-views">' + Number(p.views7d || 0).toLocaleString() + '</td></tr>'
      }).join('') +
      '</tbody></table>'
    : '<div class="traffic-note">目前尚無瀏覽資料</div>'
  return '<div class="traffic-dashboard">' +
    '<div class="traffic-card"><div class="traffic-label">今日瀏覽</div><div class="traffic-num">' + s.totalToday.toLocaleString() + '</div><div class="traffic-note">同房源 6 小時內只計一次</div></div>' +
    '<div class="traffic-card"><div class="traffic-label">7 日瀏覽</div><div class="traffic-num">' + s.total7d.toLocaleString() + '</div><div class="traffic-note">近期熱度</div></div>' +
    '<div class="traffic-card"><div class="traffic-label">30 日瀏覽</div><div class="traffic-num">' + s.total30d.toLocaleString() + '</div><div class="traffic-note">月流量</div></div>' +
    '<div class="traffic-card"><div class="traffic-label">平均每房 7 日</div><div class="traffic-num">' + s.avg7d.toLocaleString() + '</div><div class="traffic-note">用來抓低曝光房源</div></div>' +
    '<div class="traffic-card traffic-leader"><details class="traffic-leader-details"><summary><div class="traffic-leader-summary"><div class="traffic-label">7 日熱門房源</div><div class="traffic-note">' + (first ? '目前第一：' + esc(first.title) + ' · ' + Number(first.views7d || 0).toLocaleString() : '目前尚無瀏覽資料') + '</div></div></summary>' + leaderTable + '</details></div>' +
    '</div>'
}

function groupTrafficSummaryHtml(list) {
  var s = trafficSummary(list)
  var top = s.top7d[0]
  return '<div class="group-traffic-summary">' +
    '<span class="group-traffic-pill">今日<strong>' + s.totalToday.toLocaleString() + '</strong></span>' +
    '<span class="group-traffic-pill">7日<strong>' + s.total7d.toLocaleString() + '</strong></span>' +
    '<span class="group-traffic-pill">30日<strong>' + s.total30d.toLocaleString() + '</strong></span>' +
    '<span class="group-traffic-pill">總瀏覽<strong>' + s.totalAll.toLocaleString() + '</strong></span>' +
    (top ? '<span class="group-traffic-pill">最高<strong>' + esc(top.title) + ' · ' + Number(top.views7d || 0).toLocaleString() + '</strong></span>' : '') +
    '</div>'
}

function propGroupId(groupKey) {
  return 'propGroup_' + String(groupKey || '__none__').replace(/[^a-z0-9]/gi, '_')
}

function propertyTabsHtml(list, activeTab, onClickTemplate) {
  activeTab = activeTab || propertyViewTab
  onClickTemplate = onClickTemplate || "setPropertyViewTab('__TAB__')"
  return '<div class="property-tabs">' + PROPERTY_VIEW_TABS.map(function(t) {
    var count = propertyTabList(list, t.id).length
    var click = onClickTemplate.replace('__TAB__', t.id.replace(/'/g, "\\'"))
    return '<button class="property-tab' + (activeTab === t.id ? ' active' : '') + '" onclick="' + click + '">' +
      esc(t.label) + '<span class="property-tab-count">' + count + '</span></button>'
  }).join('') + '</div>'
}

function setPropertyViewTab(tab) {
  propertyViewTab = tab || 'overview'
  rerenderPropertiesTab()
}

function setGroupPropertyViewTab(groupKey, tab) {
  groupPropertyViewTabs[groupKey] = tab || 'overview'
  openPropertyGroups[propGroupId(groupKey)] = true
  rerenderPropertiesTab()
}

function filterPropList(list) {
  return list.filter(function(p) { return matchPropFilters(p, propFilters) })
}

function uniqueOptions(list, getter) {
  var seen = {}
  return list.map(getter).filter(function(v) {
    if (!v || seen[v]) return false
    seen[v] = true
    return true
  }).sort()
}

function selectHtml(value, options, onChange, allLabel) {
  return '<select onchange="' + onChange + '(this.value)">' +
    '<option value="">' + allLabel + '</option>' +
    options.map(function(o) {
      var val = typeof o === 'string' ? o : o.value
      var label = typeof o === 'string' ? o : o.label
      return '<option value="' + esc(val) + '"' + (value === val ? ' selected' : '') + '>' + esc(label) + '</option>'
    }).join('') +
    '</select>'
}

function propFilterBarHtml() {
  var list = DATA.properties.filter(function(p){ return p.status !== 'PENDING' })

  var typeOpts = Object.keys(TYPE_LABEL).map(function(t){ return { value: t, label: TYPE_LABEL[t] } })
  var rentOpts = [

    { value: '12001-18000', label: '12K-18K' },
    { value: '18001-30000', label: '18K-30K' },
    { value: '30001-', label: '30K 以上' },
  ]
  var sizeOpts = [
    { value: '0-5', label: '5 坪以下' },
    { value: '5.1-8', label: '5-8 坪' },
    { value: '8.1-12', label: '8-12 坪' },

    '</div>'
}

function setPropFilter(key, value) { propFilters[key] = value; rerenderPropertiesTab() }
function setGroupPropFilter(groupKey, key, value) {
  groupPropFilters[groupKey] = groupPropFilters[groupKey] || {}
  groupPropFilters[groupKey][key] = value
  rerenderPropertiesTab()
}
function clearGroupPropFilter(groupKey) { groupPropFilters[groupKey] = {}; rerenderPropertiesTab() }
function clearPropFilter() { propFilters = { location: '', type: '', rent: '', size: '', status: '', featured: '' }; rerenderPropertiesTab() }
function rerenderPropertiesTab() {
  var el = document.getElementById('content')
  if (el) { el.innerHTML = renderProperties(); setTimeout(renderImgPreview, 50) }
}

function renderProperties() {
  var csvBtns = feat('csvImport')
    ? '<button class="action-btn" onclick="exportProperties()">匯出 CSV</button>' +
      '<label class="action-btn" style="cursor:pointer;">匯入 CSV<input type="file" accept=".csv,text/csv" style="display:none;" onchange="importProperties(this)"></label>' +
      '<button class="action-btn" onclick="downloadTemplate()">下載範本</button>'
    : ''
  var addBtn = '<div class="admin-toolbar">' +
    '<div class="admin-toolbar-left"><button class="action-btn admin-primary" onclick="openAddPropertyModal()">＋ 新增房源</button>' + csvBtns + '</div>' +
    '<div class="admin-toolbar-right"><button class="action-btn" onclick="reload()">重新整理</button></div>' +
    '</div>' +
    '<div id="importResult" style="display:none;margin-bottom:12px;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.7;"></div>'
  var pendingSection = renderPendingSection()
  var allNonPending = DATA.properties.filter(function(p){ return p.status !== 'PENDING' })
  var propertyTabs = propertyTabsHtml(allNonPending)
  if (!allNonPending.length) {
    return addBtn + pendingSection + (pendingSection ? '' : '<div class="empty">還沒有房源，按上方按鈕新增第一間！</div>')
  }
  var filterBar = propFilterBarHtml()
  var toolbar = batchToolbarHtml()
  var tabbedList = propertyTabList(allNonPending)
  var nonPending = filterPropList(tabbedList)
  if (!nonPending.length) {
    return addBtn + pendingSection + propertyTabs + filterBar + '<div class="empty">沒有符合篩選條件的房源</div>'
  }
  if (DATA.role !== 'super') {
    return addBtn + pendingSection + propertyTabs + filterBar + toolbar + propertyTableHtml(nonPending, true)
  }
  // 總管理員：依房東分組，開合式
  var landlordMap = {}
  var order = []
  ;(DATA.landlords || []).forEach(function(l) {
    landlordMap[l.id] = l
  })
  var groups = {}   // key = ownerId
  var groupOrder = []
  nonPending.forEach(function(p) {
    var lid = p.ownerId || '__none__'
    if (!groups[lid]) { groups[lid] = []; groupOrder.push(lid) }
    groups[lid].push(p)
  })
  var filterActive = Object.keys(propFilters).some(function(k){ return propFilters[k] })
  var groupHtml = groupOrder.map(function(lid) {
    var l = landlordMap[lid] || {}
    var displayName = l.name || '未分類'
    var siteName = l.siteName ? '・' + l.siteName : ''
    var props = groups[lid]
    var groupTab = groupPropertyViewTabs[lid] || propertyViewTab
    var groupTabProps = propertyTabList(props, groupTab)
    var available = props.filter(function(p){ return p.status === 'AVAILABLE' || p.status === 'COMING_SOON' }).length
    var groupId = propGroupId(lid)
    var groupOpen = filterActive || !!openPropertyGroups[groupId] || !!groupPropertyViewTabs[lid]
    var groupTabClick = "setGroupPropertyViewTab('" + lid.replace(/'/g, "\\'") + "', '__TAB__')"
    // 用顏色區分不同房東（依 index 循環）
    var colorPalette = ['#EAF3EB','#EBF0F8','#F5F0E8','#F0EBF5','#EBF5F3','#F8EEE8']
    var idx = groupOrder.indexOf(lid)
    var bgColor = colorPalette[idx % colorPalette.length]
    return '<div style="margin-bottom:20px;border:2px solid var(--oat-mid);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">' +
      // 開合標題列（帶底色）
      '<div onclick="toggleGroup(\'' + groupId + '\', this)" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:' + bgColor + ';cursor:pointer;user-select:none;border-bottom:2px solid var(--oat-mid);">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<input type="checkbox" class="group-cb" data-group="' + groupId + '" style="width:16px;height:16px;accent-color:var(--sage);" onclick="event.stopPropagation();toggleGroupSelect(this,\'' + groupId + '\')">' +
      '<span style="font-size:15px;font-weight:800;color:var(--deep-sage);">🏢 ' + esc(displayName) + '</span>' +
      (l.siteName ? '<span style="font-size:12px;font-weight:600;color:var(--sage);background:white;border-radius:99px;padding:2px 10px;border:1px solid var(--oat-mid);">🌐 ' + esc(l.siteName) + '</span>' : '') +
      '<span style="font-size:12px;color:var(--gray-mid);">共 <strong>' + props.length + '</strong> 間</span>' +
      '<span style="font-size:11px;padding:2px 8px;border-radius:99px;background:#E8F5E9;color:#388E3C;font-weight:600;">可租/即將 ' + available + ' 間</span>' +
      '</div>' +
      '<span class="toggle-arrow" style="font-size:14px;color:var(--gray-mid);font-weight:700;">' + (groupOpen ? '▾' : '▸') + '</span>' +
      '</div>' +
      // 展開內容（帶淡底色）；篩選啟用時自動展開
      '<div id="' + groupId + '" style="display:' + (groupOpen ? 'block' : 'none') + ';padding:14px;background:#FAFAF8;">' +
      groupTrafficSummaryHtml(props) +
      propertyTabsHtml(props, groupTab, groupTabClick) +
      propertyTableHtml(groupTabProps, true, lid) +
      '</div>' +
      '</div>'
  }).join('')
  return addBtn + pendingSection + propertyTabs + filterBar + toolbar + groupHtml
}

function toggleGroup(id, headerEl) {
  var el = document.getElementById(id)
  if (!el) return
  var isOpen = el.style.display !== 'none'
  el.style.display = isOpen ? 'none' : 'block'
  openPropertyGroups[id] = !isOpen
  var arrow = headerEl.querySelector('.toggle-arrow')
  if (arrow) arrow.textContent = isOpen ? '▸' : '▾'
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.prop-cb').forEach(function(cb){ cb.checked = checked })
  updateBatchCount()
}

function toggleGroupSelect(groupCb, groupId) {
  var el = document.getElementById(groupId)
  if (!el) return
  el.querySelectorAll('.prop-cb').forEach(function(cb){ cb.checked = groupCb.checked })
  updateBatchCount()

async function applyBatchStatus() {
  var checked = Array.from(document.querySelectorAll('.prop-cb:checked'))
  if (!checked.length) { showToast('請先勾選房源'); return }
  var newStatus = document.getElementById('batchStatus').value
  var label = PROP_STATUS_LABEL[newStatus] || newStatus
  var availableFrom = null
  if (newStatus === 'COMING_SOON') {
    availableFrom = prompt('請輸入即將釋出日期（YYYY-MM-DD）')
    if (availableFrom === null) return
    availableFrom = availableFrom.trim()
    if (!/^\d{4}-\d{2}-\d{2}$/.test(availableFrom)) { showToast('❌ 日期格式請用 YYYY-MM-DD'); return }
  }
  if (!confirm('確定將 ' + checked.length + ' 間房源改為「' + label + '」？')) return
  var ids = checked.map(function(cb){ return cb.dataset.id })
  showToast('更新中…')
  try {
    var res = await fetch('/admin/api/properties/batch-status?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids, status: newStatus, availableFrom: availableFrom })
    })
    var data = await res.json().catch(function(){ return {} })
    if (!res.ok) { showToast('❌ ' + (data.error || '更新失敗')); return }
    showToast('✅ 已更新 ' + (data.updated || ids.length) + ' 間房源')
  } catch(e) { showToast('❌ 更新失敗，請稍後再試'); return }
  await reload()
}

function buildDistrictOptionsJS(city, selected) {
  var districts = TW_DISTRICTS[city] || []
  return '<option value="">請選擇區域</option>' + districts.map(function(d) {
    return '<option value="' + d + '"' + (d === selected ? ' selected' : '') + '>' + d + '</option>'

function savePropDraft() {
  if (editingPropertyId) return
  try {
    var d = {
      title: (document.getElementById('f_title')||{}).value || '',
      type: (document.getElementById('f_type')||{}).value || '',
      price: (document.getElementById('f_price')||{}).value || '',
      city: (document.getElementById('f_city')||{}).value || '',
      district: (document.getElementById('f_district')||{}).value || '',
      size: (document.getElementById('f_size')||{}).value || '',
      deposit: (document.getElementById('f_deposit')||{}).value || '',
      address: (document.getElementById('f_address')||{}).value || '',
      description: (document.getElementById('f_desc')||{}).value || '',
      images: (document.getElementById('f_images')||{}).value || '',
    }
    if (document.getElementById('f_owner')) d.ownerId = document.getElementById('f_owner').value
    localStorage.setItem(PROP_DRAFT_KEY, JSON.stringify(d))
  } catch(e){}
}

function loadPropDraft(d) {
  if (!d) return
  var set = function(id, val) { var el = document.getElementById(id); if (el && val) el.value = val }
  set('f_title', d.title); set('f_type', d.type); set('f_price', d.price)
  set('f_size', d.size); set('f_deposit', d.deposit)
  set('f_address', d.address); set('f_desc', d.description)
  // 縣市先設，再重建區域選單後設區域
  if (d.city) {
    set('f_city', d.city)
    var distSel = document.getElementById('f_district')
    if (distSel) distSel.innerHTML = buildDistrictOptionsJS(d.city, d.district || '')
  }
  if (d.images) { set('f_images', d.images); renderImgPreview() }
  if (d.ownerId) set('f_owner', d.ownerId)
}

async function startEditProperty(id) {
  editingPropertyId = id
  var p = DATA.properties.find(function(x){ return x.id === id })
  if (!p) return

  // 社區清單已有則不重抓；完整房源資料抓過一次後快取在 p._full
  var fetches = []
  if (!_communities || !_communities.length) {
    fetches.push(
      fetch('/admin/api/community?key=' + encodeURIComponent(KEY))
        .then(function(r){ return r.ok ? r.json() : null })
        .then(function(d){ if (d) _communities = d })
        .catch(function(){})
    )
  }
  if (!p._full) {
    fetches.push(
      fetch('/admin/api/property/' + id + '?key=' + encodeURIComponent(KEY))
        .then(function(r){ return r.ok ? r.json() : null })
        .then(function(d){ if (d) { Object.assign(p, d); p._full = true } })
        .catch(function(){})
    )
  }
  if (fetches.length) await Promise.all(fetches)

  var html = '<div id="propModal" class="modal-overlay">' +
    '<div class="modal-box">' +
    '<div class="modal-header"><h3>✏️ 編輯房源</h3>' +
    '<button class="modal-close" onclick="closeAddPropertyModal()">×</button></div>' +
    propertyFormHtml(p, true) +
    '<div class="prop-danger-zone">' +
      '<div><strong>刪除此房源</strong><span>刪除後房源會下架並從前台隱藏，照片也會一併清除。</span></div>' +
      '<button class="action-btn danger" onclick="deleteProperty(\'' + p.id + '\')">刪除房源</button>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:white;padding-top:12px;">' +
    '<button class="btn" style="flex:1;background:var(--deep-sage);" onclick="saveProperty()">儲存修改</button>' +
    '<button class="action-btn" style="flex:0 0 auto;" onclick="cancelEdit()">取消</button>' +
    '</div></div></div>'

  var existing = document.getElementById('propModal')
  if (existing) existing.remove()
  document.body.insertAdjacentHTML('beforeend', html)
  setTimeout(renderImgPreview, 30)
}

// ── 照片拖移排序 ─────────────────────────────────────────────────
var _dragIdx = null

function renderImgPreview() {
  var box = document.getElementById('img_preview')
  var hidden = document.getElementById('f_images')
  if (!box || !hidden) return
  var urls = hidden.value.split(',').map(function(s){ return s.trim() }).filter(Boolean)
  box.innerHTML = urls.map(function(u, i) {
    return '<div draggable="true" data-idx="' + i + '" ondragstart="imgDragStart(event,' + i + ')" ondragover="imgDragOver(event,' + i + ')" ondrop="imgDropOn(event,' + i + ')" ondragend="renderImgPreview()" ' +
      'style="position:relative;cursor:grab;user-select:none;">' +
      '<img src="' + u + '" style="width:80px;height:60px;object-fit:cover;border-radius:8px;display:block;border:2px solid ' + (i===0?'var(--sage)':'transparent') + ';">' +
      '<button onclick="removeImg(' + i + ')" title="刪除" style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;z-index:1;">×</button>' +
      '<button onclick="setCover(' + i + ')" title="設為封面" style="position:absolute;top:-6px;left:-6px;background:' + (i===0?'var(--sage)':'#aaa') + ';color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;z-index:1;">★</button>' +
      (i === 0 ? '<span style="position:absolute;bottom:2px;left:2px;background:var(--sage-dark,#4E7153);color:white;font-size:9px;padding:1px 4px;border-radius:3px;">封面</span>' : '') +
      '</div>'
  }).join('')
}

function imgDragStart(e, idx) { _dragIdx = idx; e.dataTransfer.effectAllowed = 'move' }

function imgDragOver(e, idx) {
  e.preventDefault()
  if (_dragIdx === null || _dragIdx === idx) return
  var hidden = document.getElementById('f_images')
  var urls = hidden.value.split(',').map(function(s){ return s.trim() }).filter(Boolean)
  var moved = urls.splice(_dragIdx, 1)[0]
  urls.splice(idx, 0, moved)
  hidden.value = urls.join(', ')
  _dragIdx = idx
  renderImgPreview()
}

function imgDropOn(e, idx) { e.preventDefault() }

function onImgDrop(e) { e.preventDefault() }

function setCover(idx) {
  var hidden = document.getElementById('f_images')
  var urls = hidden.value.split(',').map(function(s){ return s.trim() }).filter(Boolean)
  if (idx === 0 || !urls[idx]) return
  var cover = urls.splice(idx, 1)[0]
  urls.unshift(cover)
  hidden.value = urls.join(', ')
  renderImgPreview()
}

function removeImg(idx) {
  var hidden = document.getElementById('f_images')
  var urls = hidden.value.split(',').map(function(s){ return s.trim() }).filter(Boolean)
  urls.splice(idx, 1)
  hidden.value = urls.join(', ')
  renderImgPreview()
}

async function uploadImages(input) {
  var files = input.files
  if (!files.length) return
  var status = document.getElementById('upload_status')
  var hidden = document.getElementById('f_images')

  for (var i = 0; i < files.length; i++) {
    status.textContent = '上傳中... (' + (i + 1) + '/' + files.length + ')'
    var fd = new FormData()
    fd.append('file', files[i])
    try {
      var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
      if (!res.ok) { status.textContent = '❌ 上傳失敗'; continue }
      var data = await res.json()
      var cur = hidden.value.split(',').map(function(s){ return s.trim() }).filter(Boolean)
      cur.push(data.url)
      hidden.value = cur.join(', ')
      renderImgPreview()
    } catch (e) {
      status.textContent = '❌ 上傳失敗'
    }
  }
  status.textContent = '✅ 上傳完成'
  input.value = ''
}

async function saveProperty() {
  var saveBtn = document.querySelector('#propModal .btn[onclick="saveProperty()"]')
  var origText = saveBtn ? saveBtn.textContent : ''
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '儲存中…' }

  var elecTypeEl = document.getElementById('f_elec_type')
  var elecType = elecTypeEl ? elecTypeEl.value : 'meter'
  var tags = Array.from(document.querySelectorAll('input[name="f_tags"]:checked')).map(function(cb){ return cb.value })
  var amenities = Array.from(document.querySelectorAll('input[name="f_amenities"]:checked')).map(function(cb){ return cb.value })

  var mgmtEl = document.getElementById('f_mgmt')
  var cleanEl = document.getElementById('f_cleaning')

  var body = {
    title:       document.getElementById('f_title').value.trim(),
    type:        document.getElementById('f_type').value,
    price:       document.getElementById('f_price').value,
    city:        document.getElementById('f_city').value.trim(),
    district:    document.getElementById('f_district').value.trim(),
    size:        document.getElementById('f_size').value,
    deposit:     document.getElementById('f_deposit').value.trim(),
    address:     document.getElementById('f_address').value.trim(),
    description: document.getElementById('f_desc').value.trim(),
    imageUrls:   document.getElementById('f_images').value.split(',').map(function(s){ return s.trim() }).filter(Boolean),
    mgmtFee:     mgmtEl ? (parseInt(mgmtEl.value) || 0) : 0,
    cleaningFee: cleanEl ? (parseInt(cleanEl.value) || 0) : 0,
    electricType: elecType || null,
    electricRate: null,
    electricFlat: null,
    tags: tags,
    amenities: amenities,
    communityId: (document.getElementById('f_community') || {}).value || null,
  }
  if (!body.title || !body.price) { showToast('❌ 名稱和租金必填'); return }

  var ownerSel = document.getElementById('f_owner')
  if (ownerSel) {
    if (!ownerSel.value) { showToast('❌ 請選擇房東'); return }
    body.ownerId = ownerSel.value
  }

  var url = editingPropertyId
    ? '/admin/api/property/' + editingPropertyId + '?key=' + encodeURIComponent(KEY)
    : '/admin/api/property?key=' + encodeURIComponent(KEY)

  try {
    var res = await fetch(url, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    })
    if (!res.ok) {
      var err = await res.json().catch(function(){ return {} })
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = origText }
      showToast('❌ 儲存失敗：' + (err.error || res.status)); return
    }
  } catch(e) {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = origText }
    showToast('❌ 連線失敗：' + e.message); return
  }
  showToast(editingPropertyId ? '✅ 已更新房源' : '✅ 已新增房源')
  if (!editingPropertyId) { try { localStorage.removeItem(PROP_DRAFT_KEY) } catch(e){} }
  editingPropertyId = null
  closeAddPropertyModal()
  reload()
}

function updatePropertyRowInPlace(id) {
  var p = (DATA.properties || []).find(function(x){ return x.id === id })
  var row = document.getElementById('propertyRow_' + id)
  if (!p || !row) return
  var showCheckbox = !!row.querySelector('.prop-cb')
  row.outerHTML = renderPropCard(p, showCheckbox)
  updateBatchCount()
}

async function changePropertyStatus(id, status, selectEl) {
  var p = (DATA.properties || []).find(function(x){ return x.id === id })
  var previousStatus = p ? p.status : (selectEl ? selectEl.getAttribute('data-current') : '')
  var body = { status: status }
  if (status === 'COMING_SOON') {
    var date = prompt('請輸入即將釋出日期（YYYY-MM-DD）')
    if (date === null) {
      if (selectEl && previousStatus) selectEl.value = previousStatus
      return
    }
    date = date.trim()
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      if (selectEl && previousStatus) selectEl.value = previousStatus
      showToast('❌ 日期格式請用 YYYY-MM-DD'); return
    }
    body.availableFrom = date
  } else {
    body.availableFrom = null
  }
  if (selectEl) selectEl.disabled = true
  var res = await fetch('/admin/api/property/' + id + '?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })
  if (selectEl) selectEl.disabled = false
  if (!res.ok) {
    if (selectEl && previousStatus) selectEl.value = previousStatus
    var err = await res.json().catch(function(){ return {} })
    showToast('❌ 狀態更新失敗：' + (err.error || res.status))
    return
  }
  if (p) {
    p.status = status
    p.availableFrom = body.availableFrom
    p.updatedAt = new Date().toISOString()
  }
  showToast('✅ 狀態已更新')
  updatePropertyRowInPlace(id)

  // 改成「已出租」時，若該房源從 IG 匯入過，提示去典藏貼文
  if (status === 'RENTED') {
    var igPost = findIgPostByPropertyId(id)
    if (igPost && igPost.permalink) {
      showIgArchiveReminder((p && p.title) || igPost.title || '此房源', igPost.permalink)
    }
  }
}

async function changeAvailableFrom(id, date) {
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { showToast('❌ 日期格式請用 YYYY-MM-DD'); return }
  var res = await fetch('/admin/api/property/' + id + '?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ status: 'COMING_SOON', availableFrom: date })
  })
  if (!res.ok) { showToast('❌ 日期更新失敗'); return }
  var p = (DATA.properties || []).find(function(x){ return x.id === id })
  if (p) {
    p.status = 'COMING_SOON'
    p.availableFrom = date
    p.updatedAt = new Date().toISOString()
  }
  showToast('✅ 即將釋出日期已更新')
  updatePropertyRowInPlace(id)
}

async function deleteProperty(id) {
  var p = (DATA.properties || []).find(function(x){ return x.id === id }) || {}
  if (!confirm('確定要刪除「' + (p.title || '這個房源') + '」嗎？\n\n刪除後會從前台下架並清除照片，這個動作無法直接從後台復原。')) return
  var res = await fetch('/admin/api/property/' + id + '/delete?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
  })
  if (!res.ok) { showToast('❌ 刪除失敗'); return }
  showToast('🗑️ 已刪除')
  closeAddPropertyModal()
  editingPropertyId = null
  reload()
}

async function toggleFeatured(id, currentFeatured, btn) {
  var newVal = !currentFeatured
  if (btn) btn.disabled = true
  var res = await fetch('/admin/api/property/' + id + '/featured?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ featured: newVal })
  })
  if (res.ok) {
    var updated = await res.json()
    // 只更新本地資料中的這一筆，不重抓全部後台資料
    var p = (DATA.properties || []).find(function(x){ return x.id === id })
    if (p) {
      if ('featured' in updated) p.featured = updated.featured
      if ('siteFeatured' in updated) p.siteFeatured = updated.siteFeatured
    }
    showToast(newVal ? '⭐ 已設為精選' : '☆ 已取消精選')
    if (btn) {
      btn.disabled = false
      btn.textContent = '★'
      btn.setAttribute('onclick', "toggleFeatured('" + id + "', " + (newVal ? 'true' : 'false') + ', this)')
      btn.classList.toggle('active', newVal)
    }
  } else {
    if (btn) btn.disabled = false
    showToast('❌ 操作失敗')
  }
}

async function saveBotSettingsModal(id, formId, webhookUrl, wasEnabled, botConfigured, wasAutoReply) {
  var secretEl = document.getElementById(formId + '_secret')
  var tokenEl = document.getElementById(formId + '_token')
  var nameEl = document.getElementById(formId + '_name')
  var notifyEl = document.getElementById(formId + '_notify')
  var enabledEl = document.getElementById(formId + '_enabled')
  var autoReplyEl = document.getElementById(formId + '_autoreply')
  var secret = secretEl ? secretEl.value.trim() : ''
  var token = tokenEl ? tokenEl.value.trim() : ''
  var botName = nameEl ? nameEl.value.trim() : ''
  var notifyId = notifyEl ? notifyEl.value.trim() : ''
  var enabled = enabledEl ? enabledEl.checked : true
  var autoReply = autoReplyEl ? autoReplyEl.checked : true

  if ((secret || token) && (!secret || !token)) { showToast('❌ Secret 和 Token 需要一起填寫'); return }
  if (!botConfigured && (!secret || !token)) { showToast('❌ Channel Secret 和 Access Token 為必填'); return }

  var scopeEl = document.getElementById(formId + '_scope')
  var botScope = scopeEl ? scopeEl.value : 'all'
  var res = await fetch('/admin/api/landlord/' + id + '/bot?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ lineChannelSecret: secret, lineChannelToken: token, lineBotName: botName, notifyLineUserId: notifyId, botScope: botScope })
  })
  if (!res.ok) { showToast('❌ 設定失敗'); return }

  if (enabled !== wasEnabled) {
    var toggleRes = await fetch('/admin/api/landlord/' + id + '/bot-toggle?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ enabled: enabled })
    })
    if (!toggleRes.ok) { showToast('❌ Bot 狀態更新失敗'); return }
  }

  if (autoReply !== wasAutoReply) {
    var arRes = await fetch('/admin/api/landlord/' + id + '/bot-autoreply?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ autoReply: autoReply })
    })
    if (!arRes.ok) { showToast('❌ 自動回覆設定更新失敗'); return }
  }

async function saveSupportBot(id, formId, webhookUrl, configured) {
  var secret = (document.getElementById(formId + '_secret').value || '').trim()
  var token = (document.getElementById(formId + '_token').value || '').trim()
  var botName = (document.getElementById(formId + '_name').value || '').trim()
  var notifyId = (document.getElementById(formId + '_notify').value || '').trim()
  var enabled = document.getElementById(formId + '_enabled').checked
  if ((secret || token) && (!secret || !token)) { showToast('❌ Secret 和 Token 需要一起填寫'); return }
  if (!configured && (!secret || !token)) { showToast('❌ Channel Secret 和 Access Token 為必填'); return }
  var res = await fetch('/admin/api/landlord/' + id + '/support-bot?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ supportChannelSecret: secret, supportChannelToken: token, supportBotName: botName, supportNotifyLineUserId: notifyId, supportBotEnabled: enabled })
  })
  if (!res.ok) { showToast('❌ 設定失敗'); return }
  if (secret && token) showInfoModal('✅ 客服 Bot 設定完成', esc('到客服官方帳號的 LINE Developers Console → Messaging API → Webhook URL 填入：\n\n' + webhookUrl + '\n\n並開啟 Use webhook。'))

  reload()
}

function openMenuEditor(landlordId) {
  var l = (DATA.landlords || []).find(function(x){ return x.id === landlordId })
  menuEditState.landlordId = landlordId

  // 載入既有設定，或用預設
  if (l && l.richMenuConfig) {
    try {
      var cfg = JSON.parse(l.richMenuConfig)
      menuEditState.template = cfg.template || '4'
      menuEditState.cells = cfg.cells || []
      menuEditState.chatBarText = cfg.chatBarText || '選單'
    } catch (e) { resetMenuCells() }
  } else {
    resetMenuCells()
  }
  renderMenuEditor()
}

function resetMenuCells() {
  menuEditState.template = '4'
  menuEditState.chatBarText = '選單'
  menuEditState.cells = []
  for (var i = 0; i < 4; i++) {
    menuEditState.cells.push({ icon: DEFAULT_ICONS[i], label: DEFAULT_LABELS[i], text: DEFAULT_TEXTS[i], type: DEFAULT_TYPES[i] || 'message', uri: '' })
  }
}

function changeTemplate(t) {
  menuEditState.template = t
  var count = MENU_TEMPLATES[t].count
  var cells = []
  for (var i = 0; i < count; i++) {
    cells.push(menuEditState.cells[i] || { icon: DEFAULT_ICONS[i] || '', label: DEFAULT_LABELS[i] || '按鈕', text: DEFAULT_TEXTS[i] || '', type: DEFAULT_TYPES[i] || 'message', uri: '' })
  }
  menuEditState.cells = cells
  renderMenuEditor()
}

function updateCell(i, field, val) {
  menuEditState.cells[i][field] = val
}

function updateCellType(i, type) {
  menuEditState.cells[i].type = type
  renderMenuEditor()  // 重新渲染讓輸入欄位切換
}

async function uploadLogo(input) {
  if (!input.files || !input.files[0]) return
  var status = document.getElementById('logo_status')
  status.textContent = '上傳中...'

  fd.append('file', input.files[0])
  try {
    var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })

async function saveBotText() {
  var values = {}
  // 收集四個按鈕開關
  SHOW_TOGGLES.forEach(function(s) {
    var el = document.getElementById('bt_' + s.key)
    if (el) values[s.key] = el.checked
  })
  // 收集文字欄位（留空 = 使用預設）
  BOT_TEXT_GROUPS.forEach(function(g) {
    g.fields.forEach(function(f) {
      var el = document.getElementById('bt_' + f.key)
      if (el && el.value.trim()) values[f.key] = el.value.trim()
    })
  })
  var res = await fetch('/admin/api/landlord/' + botTextState.id + '/bottext?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ botTextConfig: JSON.stringify(values) })
  })

  showToast('✅ Bot 文字已儲存')

  reload()
}

async function saveLandlordInline(id, formId) {
  var nameEl = document.getElementById(formId + '_name')
  var emailEl = document.getElementById(formId + '_email')
  var phoneEl = document.getElementById(formId + '_phone')
  var lineOfficialIdEl = document.getElementById(formId + '_lineOfficialId')
  var name = nameEl ? nameEl.value.trim() : ''
  var email = emailEl ? emailEl.value.trim() : ''
  var phone = phoneEl ? phoneEl.value.trim() : ''
  var lineOfficialId = lineOfficialIdEl ? lineOfficialIdEl.value.trim() : ''
  var rentPayInfoEl = document.getElementById(formId + '_rentPayInfo')
  var rentPayInfo = rentPayInfoEl ? rentPayInfoEl.value.trim() : ''

  if (!name) { showToast('❌ 房東名稱不可空白'); return }
  if (!email) { showToast('❌ Email 不可空白'); return }

  if (lineOfficialId && !lineOfficialId.startsWith('@') && !/^https?:\/\//i.test(lineOfficialId)) { showToast('LINE 聯絡資訊請填 @帳號ID 或完整 https:// 連結'); return }

  var res = await fetch('/admin/api/landlord/' + id + '?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: name, email: email, phone: phone, lineOfficialId: lineOfficialId, rentPayInfo: rentPayInfo })
  })
  var data = await res.json()
  if (!res.ok) { showToast('❌ ' + (data.error || '更新失敗')); return }
  showToast('✅ 房東資料已更新')
  closeAdminModal('landlordEditModal')
  reload()
}

async function deleteLandlord(id, name, propCount) {
  var msg = '⚠️ 完全刪除房東「' + name + '」\n\n' +
    '將永久刪除：\n' +
    '• 此房東帳號\n' +
    '• 名下 ' + propCount + ' 筆房源（含照片、預約、評論、維修等所有關聯）\n' +
    '• 相關代管／租約資料\n\n' +
    '⛔ 此動作無法復原！\n\n' +
    '確定要刪除請輸入「刪除」兩個字：'
  var ans = prompt(msg)
  if (ans === null) return
  if (ans.trim() !== '刪除') { showToast('已取消（未輸入「刪除」）'); return }
  showToast('刪除中…請稍候')
  try {
    var res = await fetch('/admin/api/landlord/' + id + '?key=' + encodeURIComponent(KEY), { method: 'DELETE' })
    var data = await res.json().catch(function(){ return {} })
    if (!res.ok) { showToast('❌ 刪除失敗：' + (data.error || ('HTTP ' + res.status))); return }
    showToast('✅ 已刪除房東「' + name + '」與 ' + (data.deletedProperties || 0) + ' 筆房源')
    reload()
  } catch (e) { showToast('❌ 連線失敗：' + e.message) }
}

async function updateBooking(id, status, rejectReason) {
  var res = await fetch('/admin/api/booking/' + id + '/status?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ status: status, rejectReason: rejectReason || undefined })
  })
  var data = await res.json()
  if (!res.ok) {
    showToast('❌ 更新失敗')
    return
  }
  var notifyStatuses = ['CONFIRMED', 'CANCELLED', 'REJECTED']
  if (notifyStatuses.indexOf(status) !== -1 && !data.notification.notified) {
    showToast('⚠️ 狀態已更新，但 LINE 通知失敗')
  } else if (data.notification.notified) {
    showToast('✅ 已更新並通知租客')
  } else {
    showToast('✅ 已更新')
  }
  reload()
}

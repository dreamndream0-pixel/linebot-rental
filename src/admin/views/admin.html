function copyText(text) {
  var ok = false
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text); ok = true
    }
  } catch (e) {}
  if (!ok) {
    // 手機 in-app 瀏覽器可能沒有 navigator.clipboard，退回用 textarea + execCommand
    try {
      var ta = document.createElement('textarea')
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'
      document.body.appendChild(ta); ta.focus(); ta.select()
      ok = document.execCommand('copy')
      document.body.removeChild(ta)
    } catch (e) {}
  }
  showToast(ok ? '📋 已複製 User ID' : '請長按選取複製 User ID')
}

function fmtDate(d) {
  if (!d) return '-'
  return new Date(d).toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' })
}

function dateInputValue(d) {
  if (!d) return ''
  var date = new Date(d)
  if (isNaN(date.getTime())) return ''
  return date.toISOString().slice(0, 10)
}

function dateInputValue(d) {

function showToast(msg) {
  var t = document.getElementById('toast')
  if (!t) {
    // #toast 不存在時自建一個，避免整個呼叫端因取不到元素而拋錯中斷
    t = document.createElement('div')
    t.id = 'toast'; t.className = 'toast'
    document.body.appendChild(t)
  }
  t.textContent = msg
  t.classList.add('show')
  setTimeout(function(){ t.classList.remove('show') }, 2000)
}

function removeBrandSlide(i) {
  landlordBrandState.siteSlides.splice(i, 1)
  var g = document.getElementById('brandSlideGrid'); if (g) g.innerHTML = renderBrandSlideGrid()
}

function handleBrandSlideDrop(e) {
  e.preventDefault()
  var dz = document.getElementById('brandDropZone'); if (dz) dz.style.background = '#F8F6F1'
  if (e.dataTransfer.files && e.dataTransfer.files.length) uploadBrandSlides(e.dataTransfer.files)
}

async function uploadBrandSlides(files) {
  var resultEl = document.getElementById('brandSlideUploadResult')
  if (!files || !files.length) return
  var arr = Array.from(files), done = 0, failed = 0
  resultEl.textContent = '上傳中 0/' + arr.length + '…'
  for (var f of arr) {
    var fd = new FormData(); fd.append('file', f)
    try {
      var r = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
      var d = await r.json()
      if (!r.ok || !d.url) { failed++; continue }
      landlordBrandState.siteSlides.push({ url: d.url })
      done++
      resultEl.textContent = '上傳中 ' + done + '/' + arr.length + '…'
      var g = document.getElementById('brandSlideGrid'); if (g) g.innerHTML = renderBrandSlideGrid()
    } catch(e) { failed++ }
  }
  resultEl.textContent = (done > 0 ? '✅ 已上傳 ' + done + ' 張' : '') + (failed ? (done > 0 ? '，' : '') + failed + ' 張失敗' : '')
  document.getElementById('brandSlideFile').value = ''
}

async function uploadBrandLogo() {
  var fileInput = document.getElementById('brandLogoFile')
  var statusEl  = document.getElementById('brandLogoStatus')
  if (!fileInput || !fileInput.files[0]) { if(statusEl) statusEl.textContent = '請先選擇圖片'; return }
  if (statusEl) statusEl.textContent = '上傳中…'
  var fd = new FormData(); fd.append('file', fileInput.files[0])
  var r = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
  var data = await r.json()
  if (!data.url) throw new Error('上傳失敗')
  landlordBrandState.siteLogo = data.url
  // 更新預覽（橫式，無框框，與主站一致）
  var prev = document.getElementById('brandLogoPreview')
  if (prev) prev.innerHTML = '<div style="margin-top:4px;display:flex;align-items:center;gap:12px;"><img src="' + esc(data.url) + '" style="height:48px;object-fit:contain;background:#f5f5f3;border-radius:8px;padding:4px 8px;" /><button onclick="clearBrandLogo()" style="background:none;border:none;color:var(--warn);cursor:pointer;font-size:13px;">移除</button></div>'
  if (statusEl) statusEl.innerHTML = '✅ 上傳並儲存中…'
  // 立即儲存
  await saveLandlordBrand()
  if (statusEl) statusEl.innerHTML = '✅ 上傳成功！<br><small style="color:#aaa;">' + esc(data.url) + '</small>'

function clearBrandLogo() {
  landlordBrandState.siteLogo = ''
  var prev = document.getElementById('brandLogoPreview')
  if (prev) prev.innerHTML = ''
}

async function saveLandlordBrand() {
  if (!DATA.landlordId) { showToast('❌ 無法儲存：缺少房東 ID'); return }
  var nameInput = document.getElementById('brandSiteName')
  if (nameInput) landlordBrandState.siteName = nameInput.value.trim()
  var res = await fetch('/admin/api/landlord/' + DATA.landlordId + '/site?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ siteName: landlordBrandState.siteName, siteLogo: landlordBrandState.siteLogo, siteSlides: landlordBrandState.siteSlides }),
  })
  if (!res.ok) {
    var errText = ''
    try { var d = await res.json(); errText = d.error || '' } catch(_) {}
    showToast('❌ 儲存失敗' + (errText ? '：' + errText : ' (HTTP ' + res.status + ')'))
    return
  }
  showToast('✅ 首頁設定已儲存')
  if (DATA.selfLandlord) {
    DATA.selfLandlord.siteName = landlordBrandState.siteName
    DATA.selfLandlord.siteLogo = landlordBrandState.siteLogo
    try {
      var feats = DATA.selfLandlord.features ? JSON.parse(DATA.selfLandlord.features) : {}
      feats.siteSlides = landlordBrandState.siteSlides
      DATA.selfLandlord.features = JSON.stringify(feats)
    } catch(_) {}
  }
}

// ── 輪播圖縮圖 grid（拖曳排序）──────────────────────────
var _dragIdx = null

function renderHeroSlideGrid() {
  if (!heroSlides.length) {
    return '<p style="font-size:13px;color:#aaa;padding:12px 0;">尚無輪播圖，請上傳。</p>'
  }
  return heroSlides.map(function(s, i) {
    return [
      '<div draggable="true"',
      ' ondragstart="heroSlideDragStart(event,' + i + ')"',
      ' ondragover="heroSlideDragOver(event,' + i + ')"',
      ' ondrop="heroSlideDrop(event,' + i + ')"',
      ' ondragend="heroSlideDragEnd()"',
      ' style="position:relative;width:120px;height:80px;border-radius:10px;overflow:hidden;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,0.1);">',
      '<img src="' + esc(s.url) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.style.background=\'#E5E0D5\'">',
      '<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.25);display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;">',
      '<button onclick="removeHeroSlide(' + i + ')" style="background:rgba(220,70,70,0.85);border:none;color:white;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;">✕</button>',
      '</div>',
      '<div style="position:absolute;top:4px;left:6px;background:rgba(0,0,0,0.45);color:white;font-size:10px;border-radius:4px;padding:1px 5px;">' + (i+1) + '</div>',
      '</div>',
    ].join('')
  }).join('')
}

function heroSlideDragStart(e, i) {
  _dragIdx = i
  e.currentTarget.style.opacity = '0.4'
  e.dataTransfer.effectAllowed = 'move'
}
function heroSlideDragOver(e, i) {
  e.preventDefault()
  e.dataTransfer.dropEffect = 'move'
}
function heroSlideDrop(e, i) {
  e.preventDefault()
  if (_dragIdx === null || _dragIdx === i) return
  var moved = heroSlides.splice(_dragIdx, 1)[0]
  heroSlides.splice(i, 0, moved)
  _dragIdx = null
  document.getElementById('heroSlideGrid').innerHTML = renderHeroSlideGrid()
  saveHeroSlides()
}
function heroSlideDragEnd() {
  _dragIdx = null
  document.getElementById('heroSlideGrid').innerHTML = renderHeroSlideGrid()
}

async function removeHeroSlide(i) {
  heroSlides.splice(i, 1)
  document.getElementById('heroSlideGrid').innerHTML = renderHeroSlideGrid()
  await saveHeroSlides()
}

function handleHeroDrop(e) {
  e.preventDefault()
  document.getElementById('heroDropZone').style.background = '#F8F6F1'
  var files = e.dataTransfer.files
  if (files && files.length) uploadHeroImages(files)
}

async function uploadHeroImages(files) {
  var resultEl = document.getElementById('heroUploadResult')
  if (!files || !files.length) return
  var arr = Array.from(files)
  resultEl.textContent = '上傳中 0/' + arr.length + '…'
  var done = 0, failed = 0
  for (var f of arr) {
    var fd = new FormData()
    fd.append('file', f)
    try {
      var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
      var data = await res.json()
      if (!res.ok || !data.url) { failed++; continue }
      heroSlides.push({ url: data.url, alt: '小蝸出租房源' })
      done++
      resultEl.textContent = '上傳中 ' + done + '/' + arr.length + '…'
      document.getElementById('heroSlideGrid').innerHTML = renderHeroSlideGrid()
    } catch(e) { failed++ }
  }
  var msg = '✅ 已上傳 ' + done + ' 張'
  if (failed) msg += '，' + failed + ' 張失敗'
  resultEl.textContent = msg
  document.getElementById('heroFileInput').value = ''
  if (done > 0) await saveHeroSlides()
}

async function uploadLogo() {
  var fileInput = document.getElementById('logoFileInput')
  var resultEl = document.getElementById('logoUploadResult')
  if (!fileInput.files[0]) { resultEl.textContent = '請先選擇圖片'; return }
  resultEl.textContent = '上傳中…'
  var fd = new FormData()
  fd.append('file', fileInput.files[0])
  try {
    var r = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
    var data = await r.json()
    if (!data.url) throw new Error('上傳失敗')
    heroLogoUrl = data.url
    resultEl.innerHTML = '✅ 上傳成功，儲存中…'
    drawHeroSettings() // 只更新畫面，不重新 fetch（避免覆蓋剛上傳的值）
    await saveHeroSlides() // 立即儲存到資料庫
    resultEl.innerHTML = '✅ 上傳並儲存成功！<br><small>' + esc(data.url) + '</small>'
  } catch(e) {
    resultEl.textContent = '❌ ' + e.message
  }
}

async function clearLogo() {
  heroLogoUrl = ''
  drawHeroSettings()
  await saveHeroSlides() // 立即儲存到資料庫
}

async function saveHeroSlides(silent) {
  try {
    var slides = heroSlides.filter(function(s){ return s.url && s.url.trim() })
    var res = await fetch('/admin/api/site/hero', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slides: slides, logoUrl: heroLogoUrl })
    })
    var data = await res.json()
    if (!res.ok) { showToast('❌ 儲存失敗：' + (data.error || '')); return false }
    if (!silent) showToast('✅ 已儲存 ' + data.count + ' 張輪播圖')
    return true
  } catch(e) {
    showToast('❌ 連線失敗，請確認網站是否運行中')
    return false
  }
}

// ── 社群管理（房源一鍵發文）──────────────────────────────
var socialConfig = { instagram: { accountId: '', hasToken: false, tokenPreview: '' } }
var socialSelectedPlatforms = { instagram: true, facebook: false, threads: false }
var socialSelectedPropertyId = ''
var socialCaptionEdited = false  // 使用者是否手動改過文案

// 依房源資料組出預設發文文字（與後端 buildCaption 一致）
function buildSocialCaption(p) {
  if (!p) return ''
  var price = p.price != null ? Number(p.price).toLocaleString() : ''
  return [
    '🏠 ' + (p.title || ''),
    '📍 ' + (p.city || '') + (p.district || ''),
    '💰 NT$ ' + price + '/月・' + (p.size || '') + ' 坪',
  ].join('\n')
}

// 房源切換時，若使用者尚未手改文案，就自動帶入新房源的預設文字
function onSocialPropertyChange(id) {
  socialSelectedPropertyId = id
  var ta = document.getElementById('socialCaption')
  if (!ta) return
  if (!socialCaptionEdited || ta.value.trim() === '') {
    var p = (DATA.properties || []).filter(function(x){ return x.id === id })[0]
    ta.value = buildSocialCaption(p)
    socialCaptionEdited = false
  }
}

async function renderSocialTab() {
  var el = document.getElementById('content')
  el.innerHTML = '<div class="form-box"><p style="color:#888;font-size:14px;">載入中...</p></div>'
  try {
    var res = await fetch('/admin/api/social/config?key=' + encodeURIComponent(KEY))
    if (res.ok) socialConfig = await res.json()
  } catch (e) {}
  drawSocialTab()
}

function drawSocialTab() {
  var el = document.getElementById('content')
  var ig = socialConfig.instagram || {}
  var props = (DATA.properties || []).filter(function(p){ return p.status !== 'PENDING' })
  var propOptions = props.map(function(p) {
    return '<option value="' + p.id + '"' + (socialSelectedPropertyId === p.id ? ' selected' : '') + '>' + esc(p.title) + '</option>'
  }).join('')

  var platformRow = function(key, label, available) {
    var checked = socialSelectedPlatforms[key]

// 先以 header 取得一次性票券，OAuth 彈窗網址只帶 ticket，不帶後台金鑰
async function getOauthTicket() {
  try {
    var res = await fetch('/admin/api/social/oauth-ticket', { method: 'POST' })
    if (!res.ok) return ''
    var d = await res.json()
    return d.ticket || ''
  } catch (e) { return '' }
}

// 先同步開好空白彈窗（避免被擋），拿到票券後再導向授權頁
function openOauthPopup(path, name, platformLabel) {
  var w = window.open('about:blank', name, 'width=600,height=720')
  getOauthTicket().then(function(ticket) {
    if (!ticket) { if (w) w.close(); showToast('❌ 取得授權票券失敗，請重新登入後台'); return }
    if (w) w.location = path + '?ticket=' + encodeURIComponent(ticket)
  })
  var timer = setInterval(function() {
    if (w && w.closed) {
      clearInterval(timer)
      renderSocialTab()
      showToast('已更新 ' + platformLabel + ' 連結狀態')
    }
  }, 1000)
}

function connectInstagram() { openOauthPopup('/admin/api/social/ig/connect', 'ig_oauth', 'Instagram') }
function connectFacebook() { openOauthPopup('/admin/api/social/fb/connect', 'fb_oauth', 'Facebook') }
// 點已連結的帳號按鈕 → 詢問是否取消連結
async function disconnectSocial(platform, name) {
  var label = platform === 'instagram' ? 'Instagram' : 'Facebook 粉專'
  if (!confirm('要取消與「' + (name || label) + '」的連結嗎？\n取消後需重新連結才能再發文。')) return
  try {
    var res = await fetch('/admin/api/social/disconnect', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform: platform }),
    })
    if (!res.ok) { showToast('❌ 取消失敗'); return }
    showToast('已取消連結')
    renderSocialTab()
  } catch (e) { showToast('❌ 連線失敗：' + e.message) }
}

async function switchFbPage(pageId) {

      body: JSON.stringify({ pageId: pageId }),
    })
    if (socialConfig.facebook) { socialConfig.facebook.pageId = pageId }
    showToast('已切換發布粉專')

function copySocialCaption() {
  var ta = document.getElementById('socialCaption')
  var text = ta ? ta.value : ''
  if (!text.trim()) { showToast('❌ 沒有文案可複製'); return }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function(){ showToast('✅ 文案已複製，到社團貼上即可') },
      function(){ fallbackCopyText(ta) }
    )
  } else { fallbackCopyText(ta) }
}
function fallbackCopyText(ta) {
  try { ta.focus(); ta.select(); document.execCommand('copy'); showToast('✅ 文案已複製') }
  catch (e) { showToast('❌ 複製失敗，請手動長按選取') }
}

async function downloadSocialPhotos() {
  if (!socialSelectedPropertyId) { showToast('❌ 請先選擇房源'); return false }
  showToast('準備下載照片…')
  try {
    var res = await fetch('/admin/api/property/' + socialSelectedPropertyId + '?key=' + encodeURIComponent(KEY))
    var data = await res.json()
    var imgs = (data.images || []).map(function(x){ return x.url }).filter(Boolean)
    if (!imgs.length) { showToast('❌ 此房源沒有照片'); return false }
    var base = (data.title || 'photo').replace(/[\\/:*?"<>|]/g, '').slice(0, 20)
    for (var i = 0; i < imgs.length; i++) {
      await downloadOneImage(imgs[i], base + '_' + (i + 1))
      await new Promise(function(r){ setTimeout(r, 400) })
    }
    showToast('✅ 已下載 ' + imgs.length + ' 張照片（在瀏覽器下載資料夾）')
    return true
  } catch (e) { showToast('❌ 下載失敗：' + e.message); return false }
}
async function downloadOneImage(url, name) {
  try {
    var resp = await fetch(url, { mode: 'cors' })
    var blob = await resp.blob()
    var ext = (blob.type && blob.type.indexOf('/') > -1) ? blob.type.split('/')[1] : 'jpg'
    var objUrl = URL.createObjectURL(blob)
    var a = document.createElement('a')
    a.href = objUrl; a.download = name + '.' + ext
    document.body.appendChild(a); a.click(); document.body.removeChild(a)
    setTimeout(function(){ URL.revokeObjectURL(objUrl) }, 2000)
  } catch (e) {
    window.open(url, '_blank')  // CORS 擋下時退而用新分頁開啟，可手動另存
  }
}

function _igImportedKey() { return 'ig_imported_' + (DATA && DATA.landlordId ? DATA.landlordId : 'super') }
function getImportedData() {
  try {
    var raw = JSON.parse(localStorage.getItem(_igImportedKey()) || '{}')
    if (Array.isArray(raw)) { // 舊格式 migration
      var obj = {}; raw.forEach(function(id){ obj[id] = { propertyId:'', title:'', importedAt:0 } }); return obj
    }
    return raw
  } catch(_) { return {} }
}
function getImportedIds() { return new Set(Object.keys(getImportedData())) }
function markImportedId(mediaId, propertyId, title, permalink) {
  try {
    var k = _igImportedKey()
    var data = getImportedData()
    data[mediaId] = { propertyId: propertyId || '', title: title || '', permalink: permalink || '', importedAt: Date.now() }
    localStorage.setItem(k, JSON.stringify(data))
  } catch(_) {}
}

function findIgPostByPropertyId(propertyId) {
  var data = getImportedData()
  for (var mid in data) {
    if (data[mid].propertyId === propertyId) return Object.assign({ mediaId: mid }, data[mid])
  }
  return null
}

}
async function igBatchImport() {
  var ids = Array.from(_igBatchSelected)
  if (!ids.length) { showToast('請先勾選貼文'); return false }
  var ownerId = null
  if (DATA && DATA.role === 'super') {
    var opts = (DATA.landlords || []).map(function(l){ return l.id + ' – ' + (l.name || l.id) }).join('\n')
    var inp = prompt('批次匯入需選擇房東，輸入房東 ID：\n' + opts)
    if (!inp) return false
    ownerId = inp.trim()
  }
  var bar = document.getElementById('igBatchBar')
  var done = 0, skip = 0
  for (var i = 0; i < ids.length; i++) {
    var mediaId = ids[i]
    var d = _igImportCache[mediaId]
    if (!d) { skip++; continue }
    if (bar) { var cnt = document.getElementById('igBatchCount'); if (cnt) cnt.textContent = (i+1) + '/' + ids.length + '…' }
    try {
      var parsed = {}
      if (d.caption) {
        var pr = await fetch('/admin/api/social/ig/parse-caption?key=' + encodeURIComponent(KEY), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caption: d.caption })
        })
        if (pr.ok) parsed = (await pr.json()).parsed || {}
      }
      if (!parsed.price) { skip++; continue }  // 無租金無法自動建立
      var body = {
        title: parsed.title || (d.caption || '').split('\n')[0].slice(0, 30) || '待補標題',
        price: parseInt(parsed.price),
        type: parsed.type || 'ROOM',
        status: 'AVAILABLE',
        city: parsed.city || '台中市',
        district: parsed.district || '',
        address: parsed.address || '',
        size: parseFloat(parsed.size) || 0,
        description: d.caption || '',
        imageUrls: d.imgUrls || [],
        amenities: parsed.amenities || [],
        tags: parsed.tags || [],
      }
      if (ownerId) body.ownerId = ownerId
      var res = await fetch('/admin/api/social/ig/import-property?key=' + encodeURIComponent(KEY), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      })
      var rdata = await res.json()
      if (res.ok) { markImportedId(mediaId, rdata.propertyId, rdata.title, (d && d.permalink) || ''); done++ } else { skip++ }
    } catch(_) { skip++ }
  }
  igBatchClear()
  showToast('✅ 批次匯入完成：' + done + ' 筆成功' + (skip ? '，' + skip + ' 筆略過（無法解析租金）' : ''))
  var dataRes = await fetch('/admin/api/data?key=' + encodeURIComponent(KEY))
  if (dataRes.ok) { DATA = await dataRes.json(); enterAdmin() }
}

function igReimportClose() { var el = document.getElementById('igReimportDialog'); if (el) el.remove() }
async function igReimportDeleteAndRecreate(mediaId, propertyId) {
  igReimportClose()
  if (!confirm('確定要刪除舊房源嗎？此操作無法復原。')) return
  try {
    var res = await fetch('/admin/api/property/' + propertyId + '/delete?key=' + encodeURIComponent(KEY), { method: 'POST' })
    if (!res.ok) { showToast('❌ 刪除舊房源失敗'); return }
    var d = getImportedData(); delete d[mediaId]
    localStorage.setItem(_igImportedKey(), JSON.stringify(d))
    showToast('✅ 已刪除舊房源')
    drawIgPlanner()
    setTimeout(function(){ igImportProperty(mediaId) }, 200)
  } catch(e) { showToast('❌ 刪除失敗：' + e.message) }

function igPropThumb(p) {
  return (p && p.images && p.images[0] && p.images[0].url) || ''
}

// 用文案是否包含房源標題，比對已發布貼文對應到哪個房源（找出已出租的）
function igMatchProperty(caption) {
  if (!caption) return null
  var props = DATA.properties || []
  for (var i = 0; i < props.length; i++) {
    var t = props[i].title
    if (t && t.length > 1 && caption.indexOf(t) !== -1) return props[i]
  }
  return null
}

async function renderIgPlanner() {
  var box = document.getElementById('igPlanner')
  if (!box) return
  var ig = socialConfig.instagram || {}
  if (!ig.accountId) {
    box.innerHTML = '<p style="color:var(--gray-light);font-size:13px;">請先在上方「連結 Instagram」後，才能規劃並連動版面。</p>'
    return
  }
  box.innerHTML = '<p style="color:#888;font-size:13px;">載入 IG 貼文中…</p>'
  try {
    var r = await Promise.all([
      fetch('/admin/api/social/ig/plan?key=' + encodeURIComponent(KEY)).then(function(x){ return x.json() }),
      fetch('/admin/api/social/ig/feed?key=' + encodeURIComponent(KEY)).then(function(x){ return x.json() }),
    ])
    var planData = r[0], feedData = r[1]
    var props = DATA.properties || []
    igPlan = (planData.plan || []).filter(function(id){ return props.some(function(p){ return p.id === id }) })

    igFeed = feedData.media || []
    igFeedNextCursor = feedData.nextCursor || null
  } catch (e) {
    box.innerHTML = '<p style="color:#c0392b;font-size:13px;">載入失敗：' + esc(e.message) + '</p>'

async function loadMoreIgFeed() {
  if (!igFeedNextCursor) return
  try {
    var r = await fetch('/admin/api/social/ig/feed?key=' + encodeURIComponent(KEY) + '&cursor=' + encodeURIComponent(igFeedNextCursor))
    var data = await r.json()
    if (data.error) { showToast('❌ 載入失敗：' + data.error); return }
    igFeed = igFeed.concat(data.media || [])
    igFeedNextCursor = data.nextCursor || null
    drawIgPlanner()
  } catch(e) { showToast('❌ 載入失敗：' + e.message) }
}

// 用背景圖渲染縮圖（避免破圖撐高，並可疊播放鍵）
function igThumbHTML(url, noimgText) {
  return url
    ? '<div class="ig-thumb" style="background-image:url(&quot;' + esc(url) + '&quot;)"></div>'
    : '<div class="ig-noimg">' + (noimgText || '—') + '</div>'
}

// 取得貼文封面與是否為影片：影片用 thumbnail_url（mp4 不能當圖），輪播取第一張子項
function igFeedThumb(m) {
  if (m.media_type === 'VIDEO') return { thumb: m.thumbnail_url || m.media_url || '', video: true }
  if (m.media_type === 'CAROUSEL_ALBUM') {
    var c = m.children && m.children.data && m.children.data[0]
    return { thumb: (c && (c.thumbnail_url || c.media_url)) || m.media_url || '', video: false }
  }
  return { thumb: m.media_url || m.thumbnail_url || '', video: false }
}

function drawIgPlanner() {
  var box = document.getElementById('igPlanner')
  if (!box) return
  var props = DATA.properties || []
  var byId = {}; props.forEach(function(p){ byId[p.id] = p })

  var planCells = igPlan.map(function(id, i) {
    var p = byId[id]; if (!p) return ''
    return '<div class="ig-cell ig-plan" draggable="true" data-i="' + i + '"' +
      ' ondragstart="igDragStart(event,' + i + ')" ondragover="event.preventDefault()" ondrop="igDrop(event,' + i + ')">' +
      igThumbHTML(igPropThumb(p), '無封面圖') +
      '<span class="ig-badge">草稿</span>' +
      '<button class="ig-del" title="移除" onclick="igRemoveFromPlan(' + i + ')">✕</button>' +
      '<span class="ig-cap">' + esc(p.title || '') + '</span>' +
      '</div>'
  }).join('')

  var rentedCount = 0
  var feedItems = igFeed.map(function(m) {
    var p = igMatchProperty(m.caption)
    var rented = !!(p && p.status === 'RENTED')
    if (rented) rentedCount++
    return { m: m, rented: rented }
  })
  var shownFeed = igShowRentedOnly ? feedItems.filter(function(x){ return x.rented }) : feedItems
  _igImportCache = {}
  _igBatchSelected.clear()
  _igBatchMode = false
  var _importedIds = getImportedIds()
  var feedCells = shownFeed.map(function(x) {
    var m = x.m
    var t = igFeedThumb(m)
    var imgUrls = []
    if (m.media_type === 'CAROUSEL_ALBUM' && m.children && m.children.data) {
      imgUrls = m.children.data.map(function(c){ return c.media_url || c.thumbnail_url || '' }).filter(Boolean)
    } else if (m.media_url && m.media_type !== 'VIDEO') {
      imgUrls = [m.media_url]
    }
    _igImportCache[m.id] = { imgUrls: imgUrls, caption: m.caption || '', permalink: m.permalink || '' }
    var alreadyImported = _importedIds.has(m.id)
    return '<div class="ig-cell ig-pub' + (x.rented ? ' ig-rented' : '') + '">' +
      '<a class="ig-cell-link" href="' + esc(m.permalink || '#') + '" target="_blank" rel="noopener">' +
      igThumbHTML(t.thumb, '—') +
      (t.video ? '<span class="ig-play"></span>' : '') +
      '</a>' +
      (x.rented ? '<span class="ig-badge" style="background:#c0392b;">已出租 ⋯封存</span>' : '') +
      '<span class="ig-meta">❤ ' + (m.like_count || 0) + '　💬 ' + (m.comments_count || 0) + '</span>' +
      (imgUrls.length && !alreadyImported
        ? '<input type="checkbox" class="ig-batch-check" data-id="' + m.id + '" onchange="igBatchToggle(\'' + m.id + '\',this.checked)">' +
          '<button class="ig-import-btn" onclick="igImportProperty(\'' + m.id + '\')">📥 匯入</button>'
        : '') +
      (alreadyImported
        ? '<button class="ig-imported-btn" onclick="igReimportConfirm(\'' + m.id + '\')">' +
          '<span class="lbl-default">✅ 已匯入</span>' +
          '<span class="lbl-hover">↩ 再次匯入</span>' +
          '</button>'
        : '') +
      '</div>'
  }).join('')

  var addable = props.filter(function(p){ return p.status !== 'PENDING' && igPlan.indexOf(p.id) === -1 })
  var addOptions = addable.map(function(p){ return '<option value="' + p.id + '">' + esc(p.title) + '</option>' }).join('')

  box.innerHTML = [
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">',
      '<select id="igAddSelect" style="flex:1;min-width:160px;padding:9px 12px;border:1.5px solid var(--oat-mid);border-radius:10px;font-size:13px;"><option value="">＋ 加入房源到規劃…</option>' + addOptions + '</select>',
      '<button class="btn" style="width:auto;padding:9px 18px;" onclick="igAddToPlan()">加入</button>',
    '</div>',
    igPlan.length ? '<div style="font-size:12px;color:var(--gray-mid);margin-bottom:6px;">規劃中（拖曳排序・上方＝最新）</div>' : '<p style="color:var(--gray-light);font-size:13px;margin-bottom:14px;">尚未加入任何房源到規劃。</p>',
    igPlan.length ? '<div class="ig-grid">' + planCells + '</div>' : '',
    igPlan.length ? '<div style="margin:12px 0 20px;"><button class="btn" style="width:auto;padding:11px 26px;" onclick="btnLoad(this, igPublishPlan)">🚀 依序發布規劃（' + igPlan.length + '）</button><span id="igPlanResult" style="margin-left:12px;font-size:13px;"></span></div>' : '',
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 6px;">',
      '<span style="font-size:12px;color:var(--gray-mid);">IG 已發布（連動・唯讀）' + (rentedCount ? '　🔴 ' + rentedCount + ' 篇對應已出租房源' : '') + '</span>',
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">',
        (rentedCount ? '<label style="font-size:12px;color:var(--charcoal);display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" ' + (igShowRentedOnly ? 'checked' : '') + ' onchange="igShowRentedOnly=this.checked;drawIgPlanner()" style="accent-color:var(--sage);width:16px;height:16px;"> 只看已出租</label>' : ''),
        igFeed.length ? '<button id="igBatchModeBtn" onclick="igToggleBatchMode()" style="padding:4px 10px;border:1.5px solid var(--sage);border-radius:8px;background:white;color:var(--sage);font-size:12px;font-weight:700;cursor:pointer;">☑ 批次選取</button>' : '',
      '</div>',
    '</div>',
    igFeed.length ? '<div id="igBatchBar"><span>已選 <b id="igBatchCount">0</b> 篇</span><button onclick="btnLoad(this,igBatchImport)">⚡ 批次匯入</button><button onclick="igBatchSelectAll()">☑ 全選</button><button onclick="igBatchClear()">✕ 取消</button></div>' : '',
    igFeed.length ? '<div id="igFeedGrid" class="ig-grid">' + feedCells + '</div>' : '<p style="color:var(--gray-light);font-size:13px;">目前沒有抓到已發布貼文（帳號可能還沒發過文）。</p>',
    igFeedNextCursor ? '<div style="text-align:center;margin-top:10px;"><button id="igLoadMoreBtn" onclick="btnLoad(this,loadMoreIgFeed)" style="padding:8px 24px;border:1.5px solid var(--sage);background:white;color:var(--sage);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">⬇ 載入更多貼文</button></div>' : '',
    rentedCount ? '<p style="font-size:11px;color:var(--gray-light);margin-top:10px;line-height:1.7;">🔴 紅框「已出租」的貼文＝該房源已出租。點一下會打開那篇 IG 貼文，在 IG 右上「⋯ → 封存」即可把它從版面隱藏（封存後可隨時還原）。<b>IG 不開放由系統自動封存</b>，需在 IG 上點一下完成。</p>' : '',
  ].join('')

  // 若目前是批次模式，重繪後要還原 class 和按鈕狀態
  if (_igBatchMode) {
    var grid = document.getElementById('igFeedGrid')
    var btn  = document.getElementById('igBatchModeBtn')
    if (grid) grid.classList.add('ig-batch-mode')
    if (btn)  { btn.textContent = '✕ 退出批次'; btn.style.background = '#c0392b' }
  }
}

function igDragStart(e, i) { igDragFrom = i; try { e.dataTransfer.effectAllowed = 'move' } catch (_) {} }
function igDrop(e, i) {
  e.preventDefault()
  if (igDragFrom < 0 || igDragFrom === i) { igDragFrom = -1; return }
  var moved = igPlan.splice(igDragFrom, 1)[0]
  igPlan.splice(i, 0, moved)
  igDragFrom = -1
  saveIgPlan(); drawIgPlanner()
}
function igAddToPlan() {
  var s = document.getElementById('igAddSelect')
  var id = s && s.value
  if (!id) return
  if (igPlan.indexOf(id) === -1) { igPlan.push(id); saveIgPlan(); drawIgPlanner() }
}
function igRemoveFromPlan(i) { igPlan.splice(i, 1); saveIgPlan(); drawIgPlanner() }
async function saveIgPlan() {
  try {
    await fetch('/admin/api/social/ig/plan?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: igPlan }),
    })
  } catch (_) {}
}

// IG 匯入改用與「新增房源」完全相同的表單（propertyFormHtml），避免欄位落差
function ensureIgImportModal() {
  if (document.getElementById('igImportModal')) return

  el.className = 'modal-overlay'
  el.style.display = 'none'

    '<div class="modal-box" style="position:relative;">',
      // 解析 loading 遮罩
      '<div id="igImportLoading" style="display:none;position:absolute;inset:0;border-radius:16px;background:rgba(255,255,255,.92);z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:10px;">',

        '<div style="font-size:13px;color:#666;font-weight:600;">AI 解析文案中…</div>',

      '</div>',
      '<div class="modal-header">',
        '<div>',
          '<h3 style="margin:0 0 2px;">📥 匯入 IG 貼文為房源</h3>',

// 用一個房源物件把 propertyFormHtml 塞進 IG 匯入 modal
function igRenderImportForm(p) {
  var body = document.getElementById('igImportFormBody')
  if (body) body.innerHTML = propertyFormHtml(p, true)
}

// 把 IG 貼文 + AI 解析結果組成一個 property 物件（給 propertyFormHtml 用）
function igBuildPropertyObj(d, parsed) {
  parsed = parsed || {}
  return {
    title: parsed.title || '',
    type: parsed.type || 'SUITE',
    price: parsed.price || '',
    size: parsed.size || '',
    deposit: parsed.deposit || '兩個月',
    city: parsed.city || '台中市',
    district: parsed.district || '',
    address: parsed.address || '',
    description: (d && d.caption) || '',
    mgmtFee: 0,
    cleaningFee: 0,
    electricType: '',
    communityId: null,
    amenities: (parsed.amenities || []).map(function(n){ return { name: n } }),
    tags: (parsed.tags || []).map(function(n){ return { name: n } }),
    images: ((d && d.imgUrls) || []).map(function(u, i){ return { url: u, order: i, isCover: i === 0 } }),
  }
}

async function igImportProperty(mediaId) {
  var d = _igImportCache[mediaId]
  if (!d) { showToast('❌ 找不到貼文資料'); return }
  _igImportCurrentId = mediaId

  // 與新增房源相同：需要社區清單，且 owner picker 只在 editingPropertyId 為空時顯示
  if (!_communities || !_communities.length) {
    try { var rc = await fetch('/admin/api/community?key=' + encodeURIComponent(KEY)); if (rc.ok) _communities = await rc.json() } catch(e) {}
  }
  editingPropertyId = null

  ensureIgImportModal()

  // 先渲染一次（未解析前，只帶圖片與文案）
  igRenderImportForm(igBuildPropertyObj(d, null))
  setTimeout(renderImgPreview, 30)

  var badge = document.getElementById('igImportSourceBadge')
  if (badge) { badge.style.display = 'none'; badge.textContent = '' }

  var modal = document.getElementById('igImportModal')
  modal.style.display = 'flex'

  // 顯示 loading 遮罩並解析
  if (d.caption) {
    var loading = document.getElementById('igImportLoading')
    if (loading) loading.style.display = 'flex'
    try {
      var res = await fetch('/admin/api/social/ig/parse-caption?key=' + encodeURIComponent(KEY), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ caption: d.caption }),
      })
      if (res.ok) {
        var data = await res.json()
        // AI 解析後，用完整資料重繪同一份表單（含設備/標籤/押金…）
        igRenderImportForm(igBuildPropertyObj(d, data.parsed || {}))
        setTimeout(renderImgPreview, 30)
        if (badge && data.source) {
          badge.textContent = data.source === 'ai' ? '✨ AI 自動解析完成' : '🔍 關鍵字解析完成'
          badge.style.display = 'block'
          badge.style.color = data.source === 'ai' ? 'var(--sage)' : '#aaa'
        }
      }
    } catch (_) {}
    if (loading) loading.style.display = 'none'
  }

  setTimeout(function() {
    var t = document.getElementById('f_title')
    if (t && !t.value) t.focus()
  }, 50)
}

function igImportClose() {
  var m = document.getElementById('igImportModal')
  if (m) m.style.display = 'none'
  // 清空表單，避免其 f_* 欄位 ID 與「新增房源」表單重複造成 getElementById 抓錯

async function igPublishPlan() {
  var resEl = document.getElementById('igPlanResult')
  if (!igPlan.length) return false
  if (!confirm('確定要依序發布這 ' + igPlan.length + ' 篇到 Instagram 嗎？發布後無法復原。')) return false
  // 由下而上（舊→新）送出，讓最終版面與九宮格預覽一致
  var order = igPlan.slice().reverse()
  var done = 0
  for (var k = 0; k < order.length; k++) {
    var p = (DATA.properties || []).filter(function(x){ return x.id === order[k] })[0]
    if (resEl) resEl.textContent = '發布中… (' + (k + 1) + '/' + order.length + ')'
    try {
      var res = await fetch('/admin/api/social/post?key=' + encodeURIComponent(KEY), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ propertyId: order[k], platforms: ['instagram'], caption: buildSocialCaption(p) }),
      })
      var data = await res.json()
      var ok = res.ok && data.results && data.results.instagram && data.results.instagram.ok
      if (!ok) {
        var err = (data.results && data.results.instagram && data.results.instagram.error) || data.error || '發布失敗'
        if (resEl) resEl.innerHTML = '❌ 第 ' + (k + 1) + ' 篇失敗：' + esc(err) + '（已停止，後面未發）'
        break
      }
      done++
    } catch (e) {
      if (resEl) resEl.textContent = '❌ 連線失敗：' + e.message
      break
    }
  }
  // 成功的是原陣列尾端 done 篇，移出規劃清單
  if (done > 0) { igPlan = igPlan.slice(0, igPlan.length - done); saveIgPlan() }
  showToast('發布完成：成功 ' + done + ' 篇' + (done < order.length ? '，其餘未發' : ''))
  await renderIgPlanner()
  return true
}

async function submitSocialPost(postType) {
  var isStory = postType === 'story'
  var resultEl = document.getElementById('socialPostResult')
  var platforms = Object.keys(socialSelectedPlatforms).filter(function(k){ return socialSelectedPlatforms[k] })
  var caption = (document.getElementById('socialCaption') || {}).value || ''
  if (!socialSelectedPropertyId) { showToast('❌ 請先選擇房源'); return false }
  if (!platforms.length) { showToast('❌ 請選擇至少一個發布平台'); return false }
  if (!isStory && !caption.trim()) { showToast('❌ 發文內容不可空白'); return false }

  // 限時動態只支援 Instagram
  if (isStory) {
    var hasIg = platforms.indexOf('instagram') !== -1
    if (!hasIg) { showToast('❌ 限時動態目前只支援 Instagram，請勾選 Instagram'); return false }
    platforms = ['instagram']
  }

  resultEl.innerHTML = isStory ? '發布限時動態中...' : '發布中...'
  try {
    var res = await fetch('/admin/api/social/post?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        propertyId: socialSelectedPropertyId,
        platforms: platforms,
        caption: caption,
        postType: postType || 'feed',
      }),
    })
    var data = await res.json()
    if (!res.ok) { resultEl.innerHTML = '❌ ' + (data.error || '發布失敗'); return false }
    var labels = { instagram: 'Instagram', facebook: 'FB 粉專', threads: 'Threads' }

      var r = data.results[k]

      return r.ok

  } catch (e) {
    resultEl.innerHTML = '❌ 連線失敗：' + e.message

  }
}

async function uploadCommunityPhotos(files) {
  var status = document.getElementById('c_upload_status')

  var done = 0
  for (var f of arr) {

    fd.append('file', f)
    try {
      var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
      var data = await res.json()
      if (res.ok && data.url) { _communityPhotos.push(data.url); done++ }
    } catch(e) {}

  if (status) status.textContent = '✅ 已上傳 ' + done + ' 張'

// Ripple effect
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.btn, .action-btn')
  if (!btn || btn.classList.contains('loading')) return
  var r = btn.getBoundingClientRect()
  var d = Math.max(r.width, r.height)
  var rEl = document.createElement('span')
  rEl.className = 'btn-ripple'
  rEl.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d/2) + 'px;top:' + (e.clientY - r.top - d/2) + 'px'
  btn.appendChild(rEl)
  setTimeout(function(){ rEl.remove() }, 500)
})

// Helper: wrap async onclick with loading state
function btnLoad(btn, fn) {
  if (btn.classList.contains('loading')) return
  btn.classList.add('loading')
  var orig = btn.textContent
  Promise.resolve(fn()).finally(function() {
    btn.classList.remove('loading')
  })
}

function auditSkipKey(k) {
  return k === 'id' || /Id$/.test(k) || /^lineUserId$/i.test(k) || k === 'preview' || k === 'meterReading'
}
function auditVal(k, v) {
  var s = String(v)
  if (AUDIT_KEYVAL_MAP[k] && AUDIT_KEYVAL_MAP[k].hasOwnProperty(s)) return AUDIT_KEYVAL_MAP[k][s]
  return AUDIT_VAL_MAP.hasOwnProperty(s) ? AUDIT_VAL_MAP[s] : s
}
function translateAuditSummary(raw) {
  if (!raw) return ''
  var obj
  try { obj = JSON.parse(raw) } catch (e) { return escapeHtml(raw) }
  if (!obj || typeof obj !== 'object') return escapeHtml(raw)
  var parts = []
  // 期間起訖合併顯示（租金期別／租約期間）
  if (obj.periodStart || obj.periodEnd) {
    parts.push('期間：' + (obj.periodStart || '?') + '～' + (obj.periodEnd || '?'))
    delete obj.periodStart; delete obj.periodEnd
  }
  if (obj.leaseStart || obj.leaseEnd) {
    parts.push('租約期間：' + (obj.leaseStart || '?') + '～' + (obj.leaseEnd || '?'))
    delete obj.leaseStart; delete obj.leaseEnd
  }
  Object.keys(obj).forEach(function(k) {
    if (auditSkipKey(k)) return
    var v = obj[k]
    if (v == null || v === '') return
    if (v === '{…}') return  // 巢狀物件佔位，無實際內容
    if (k === 'receiptUrl') { parts.push('收據：有'); return }
    var label = AUDIT_KEY_MAP[k] || k
    parts.push(label + '：' + auditVal(k, v))
  })
  return escapeHtml(parts.join('・'))
}

// 讀取 NDJSON 串流，逐行解析進度，回傳最後的 done 物件
async function readSyncStream(res, onProgress) {
  if (!res.body || !res.body.getReader) { // 舊瀏覽器 fallback：一次讀完
    var txt = await res.text(); var last = null
    txt.split('\n').forEach(function(ln){ ln = ln.trim(); if (!ln) return; try { var m = JSON.parse(ln); if (m.type === 'done') last = m } catch(_){} })
    return last
  }
  var reader = res.body.getReader()
  var decoder = new TextDecoder()
  var buf = '', final = null
  while (true) {
    var r = await reader.read()
    if (r.done) break
    buf += decoder.decode(r.value, { stream: true })
    var parts = buf.split('\n'); buf = parts.pop()
    for (var i = 0; i < parts.length; i++) {
      var ln = parts[i].trim(); if (!ln) continue
      var msg; try { msg = JSON.parse(ln) } catch (_) { continue }
      if (msg.type === 'start') { if (onProgress) onProgress(0, msg.total) }
      else if (msg.type === 'progress') { if (onProgress) onProgress(msg.current, msg.total) }
      else if (msg.type === 'done') final = msg
    }
  }
  if (buf.trim()) { try { var m2 = JSON.parse(buf.trim()); if (m2.type === 'done') final = m2 } catch(_){} }
  return final
}

      '<button class="btn" style="flex:1;width:auto;white-space:nowrap;background:#8A8A8A;font-size:13px;padding:8px 4px;" onclick="openManagedForm(\'' + m.id + '\')">編輯</button>' +
    '</div>' +
  '</div>'
}

// ══════════════════════════════════════════════
// 智慧門鎖（TTLock）— 包租代管門鎖管理（移植自 rubyclean）
// 房間清單 + 每間可設 type / Lock ID / 房客 LINE User ID
// ══════════════════════════════════════════════
var LOCKMGR = { landlordId: null, buildings: [], rooms: {}, leases: [], hasCreds: false, username: '', curBldg: null }

function lmEmoji(type) { return type === 'ttlock' ? '🔐' : type === 'traditional' ? '🗝️' : '🔢' }

async function openLockManager() {
  var q = '?key=' + encodeURIComponent(KEY)
  try {
    var cfg = await fetch('/admin/api/smartlock/config' + q).then(function(r){ return r.json() })
    if (cfg.error) { alert(cfg.error); return }
    LOCKMGR.hasCreds = !!cfg.hasCreds
    LOCKMGR.username = cfg.username || ''
    LOCKMGR.landlordId = cfg.landlordId || null
    LOCKMGR.buildings = cfg.buildings || []
  } catch (e) { alert('讀取設定失敗：' + e.message); return }
  await lmLoadRooms()
  if (!LOCKMGR.curBldg && LOCKMGR.buildings.length) LOCKMGR.curBldg = LOCKMGR.buildings[0].id
  lmRender()
}

async function lmLoadRooms() {
  var q = '?key=' + encodeURIComponent(KEY)
  try {
    var d = await fetch('/admin/api/smartlock/rooms' + q).then(function(r){ return r.json() })
    LOCKMGR.rooms = (d && d.rooms && typeof d.rooms === 'object') ? d.rooms : {}
    if (d && d.buildings) LOCKMGR.buildings = d.buildings
    LOCKMGR.leases = (d && Array.isArray(d.leases)) ? d.leases : []
  } catch (e) { LOCKMGR.rooms = {} }
}

function lmClose() { var el = document.getElementById('lockMgrModal'); if (el) el.remove() }

function lmRender() {
  var existing = document.getElementById('lockMgrModal'); if (existing) existing.remove()
  var html = '<div id="lockMgrModal" class="modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:320;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;">' +
    '<div style="background:#fff;border-radius:16px;max-width:720px;width:100%;padding:24px;margin:auto;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
        '<h3 style="margin:0;font-size:18px;">🔐 門鎖管理</h3>' +
        '<button onclick="lmClose()" style="border:none;background:none;font-size:22px;cursor:pointer;">×</button>' +
      '</div>' +
      lmCredsSection() +
      lmToolbar() +
      lmBuildingTabs() +
      '<div id="lmRoomList"></div>' +
      '<div style="display:flex;gap:10px;margin-top:16px;">' +
        '<button class="btn" style="flex:1;" onclick="lmSave(this)">💾 儲存門鎖設定</button>' +
      '</div>' +
      '<div id="lmMsg" style="font-size:12px;color:#999;margin-top:8px;text-align:center;"></div>' +
    '</div></div>'
  document.body.insertAdjacentHTML('beforeend', html)
  lmRenderRooms()
}

function lmCredsSection() {
  var status = LOCKMGR.hasCreds
    ? '<span style="color:#3A8A5A;font-weight:700;">✅ 已設定' + (LOCKMGR.username ? '（' + esc(LOCKMGR.username) + '）' : '') + '</span>'
    : '<span style="color:#C55;font-weight:700;">⚠️ 尚未設定 TTLock 帳密（TTLock 電子鎖需要）</span>'
  return '<div style="border:1px solid #E5E0D5;border-radius:12px;padding:14px;margin-bottom:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-weight:700;font-size:14px;">TTLock 帳號　' + status + '</div>' +
      '<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick="lmToggleCreds()">設定帳密</button>' +
    '</div>' +
    '<div id="lmCredsForm" style="display:none;margin-top:12px;">' +
      lmInput('lmClientId', 'Client ID') +
      lmInput('lmClientSecret', 'Client Secret') +
      lmInput('lmUsername', 'TTLock 帳號（username）') +
      lmInput('lmPassword', 'TTLock 密碼', 'password') +
      '<button class="btn" style="width:100%;margin-top:8px;" onclick="lmSaveCreds(this)">儲存帳密</button>' +
      '<div id="lmCredsStatus" style="font-size:12px;color:#999;margin-top:6px;"></div>' +
    '</div>' +
  '</div>'
}

function lmInput(id, label, type) {
  return '<label style="display:block;font-size:12px;color:#888;margin:8px 0 4px;">' + label + '</label>' +
    '<input id="' + id + '" type="' + (type || 'text') + '" style="width:100%;padding:9px 11px;border:1px solid #DDD;border-radius:8px;font-size:14px;">'
}

function lmToggleCreds() {
  var el = document.getElementById('lmCredsForm')
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'
}

async function lmSaveCreds() {
  var body = {
    landlordId: LOCKMGR.landlordId || undefined,
    clientId: document.getElementById('lmClientId').value.trim(),
    clientSecret: document.getElementById('lmClientSecret').value.trim(),
    username: document.getElementById('lmUsername').value.trim(),
    password: document.getElementById('lmPassword').value.trim(),
  }
  var st = document.getElementById('lmCredsStatus'); st.textContent = '儲存中…'
  try {
    var res = await fetch('/admin/api/smartlock/config?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    })
    var d = await res.json()
    if (!res.ok) { st.textContent = '❌ ' + (d.error || '儲存失敗'); st.style.color = '#C55'; return }
    LOCKMGR.hasCreds = true; LOCKMGR.username = body.username
    lmRender()
  } catch (e) { st.textContent = '❌ ' + e.message; st.style.color = '#C55' }
}

var LM_WORKER_DEFAULT = 'https://workerruby-shorten.dreamndream0.workers.dev'

function lmToolbar() {
  return '<div style="border:1px solid #E5E0D5;border-radius:12px;padding:12px;margin-bottom:12px;">' +
    '<div style="font-weight:700;font-size:13px;margin-bottom:8px;">從 TTLock 匯入門鎖</div>' +
    '<button class="btn" style="width:auto;padding:9px 16px;font-size:13px;background:#6B5A9A;" onclick="lmImportTTLock(this)">🔄 從 TTLock 匯入門鎖</button>' +
    '<div style="font-size:11px;color:#999;margin-top:6px;">從你的 TTLock 帳號抓取目前的門鎖，覆蓋各房間的門鎖資料（已填的房客 UID／綁定合約會保留）。帳號中尚未對應到房間的新門鎖會列出來，供你手動綁定。</div>' +
    '<div id="lmLockList" style="font-size:12px;color:#666;margin-top:8px;"></div>' +
  '</div>'
}
async function lmImportTTLock(btn) {
  var box = document.getElementById('lmLockList'); if (box) box.textContent = '從 TTLock 匯入中…'
  try {
    var res = await fetch('/admin/api/smartlock/import-ttlock?key=' + encodeURIComponent(KEY) + (LOCKMGR.landlordId ? '&landlordId=' + encodeURIComponent(LOCKMGR.landlordId) : ''), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ landlordId: LOCKMGR.landlordId || undefined })
    })
    var d = await res.json()
    if (!res.ok) {
      var det = d.detail || {}
      var msg = det.errmsg || det.error_description || det.error || (det.errcode != null ? ('errcode ' + det.errcode) : '')
      if (box) box.innerHTML = '❌ ' + esc(d.error || '匯入失敗') + (msg ? '：' + esc(msg) : '')
      return
    }
    var html = '✅ 已匯入：帳號共 ' + d.totalLocks + ' 把門鎖，對應到房間 ' + d.matched + ' 把。'
    if (d.unmatched && d.unmatched.length) {
      html += '<br><span style="color:#B07A2E;">尚未對應到房間的新門鎖（請於下方房間手動填入 Lock ID）：</span><br>' +
        d.unmatched.map(function(l){ return '<code style="background:#f2f2f2;padding:1px 5px;border-radius:4px;margin:2px;display:inline-block;">' + esc(l.name) + '=' + l.lockId + '</code>' }).join(' ')
    }
    // 重新載入房間門鎖顯示（lmRender 會重繪，含上方工具列，故把結果另存後重貼）
    try { await lmLoadRooms(); lmRender() } catch (e) {}
    var box2 = document.getElementById('lmLockList'); if (box2) box2.innerHTML = html
  } catch (e) { if (box) box.textContent = '❌ ' + e.message }
}

async function lmShowUsage() {
  try {
    var res = await fetch('/admin/api/smartlock/usage?key=' + encodeURIComponent(KEY) + (LOCKMGR.landlordId ? '&landlordId=' + encodeURIComponent(LOCKMGR.landlordId) : ''))
    var d = await res.json()
    if (!res.ok) { showInfoModal('讀取失敗', esc(d.error || ('HTTP ' + res.status))); return }
    lmRenderUsage(d)
  } catch (e) { showInfoModal('讀取失敗', esc(e.message || String(e))) }
}

function lmRenderUsage(d) {
  var list = d.list || []
  var rows = list.length
    ? list.map(function(t){
        var oweBadge = t.owe > 0
          ? '<span style="background:#FBEDED;color:#C55;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;">待收 $' + t.owe + '</span>'
          : '<span style="color:#bbb;font-size:11px;">已結清</span>'
        return '<div style="border-bottom:1px solid #eee;padding:10px 0;">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
            '<div style="min-width:0;">' +
              '<div style="font-weight:700;font-size:14px;">' + esc(t.name || '(未命名)') + '</div>' +
              '<div style="font-size:11px;color:#999;font-family:monospace;word-break:break-all;">' + esc(t.userId) + '</div>' +
              '<div style="font-size:12px;color:#666;margin-top:3px;">今年索取 ' + t.issuedThisYear + ' 次（免費 ' + d.freeQuota + ' 次）　' + oweBadge + '</div>' +
            '</div>' +
            (t.owe > 0 ? '<button class="btn" style="width:auto;padding:5px 12px;font-size:11px;background:#3A8A5A;flex-shrink:0;" onclick="lmSettle(\'' + esc(t.userId).replace(/\\/g,'') + '\')">結清</button>' : '') +
          '</div>' + lmChargesDetail(t.charges) +
        '</div>'
      }).join('')
    : '<div style="color:#999;text-align:center;padding:16px;font-size:13px;">尚無取密碼記錄</div>'
  var old = document.getElementById('appInfoModal'); if (old) old.remove()
  var html = '<div id="appInfoModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10002;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;">' +
    '<div style="background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,0.22);">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<h3 style="margin:0;font-size:17px;">💰 門鎖用量／帳款</h3>' +
        '<button onclick="document.getElementById(\'appInfoModal\').remove()" style="border:none;background:none;font-size:22px;cursor:pointer;">×</button>' +
      '</div>' +
      '<div style="font-size:12px;color:#888;margin-bottom:10px;">每年免費 ' + d.freeQuota + ' 次，第 ' + (d.freeQuota + 1) + ' 次起每次 $' + d.chargeAmount + '</div>' +
      rows +
    '</div></div>'
  document.body.insertAdjacentHTML('beforeend', html)
}

function lmChargesDetail(charges) {
  if (!Array.isArray(charges) || !charges.length) return ''
  return '<div style="margin-top:6px;font-size:11px;color:#999;">' +
    charges.map(function(c){
      return (c.paid ? '✅' : '🔸') + ' ' + esc(c.date || '') + ' $' + (c.amount || 0) + (c.paid ? '（已收）' : '（待收）')
    }).join('　') + '</div>'
}

function lmSettle(userId) {
  showConfirm({
    icon: '💰', title: '確認結清帳款？',
    msg: '將此房客所有未收帳款標記為「已收款」。',
    okLabel: '確認結清',
    onOk: async function () {
      try {
        var res = await fetch('/admin/api/smartlock/usage/settle?key=' + encodeURIComponent(KEY), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ landlordId: LOCKMGR.landlordId || undefined, userId: userId }),
        })
        var d = await res.json()
        if (!res.ok) { showInfoModal('結清失敗', esc(d.error || '')); return }
        lmShowUsage()
      } catch (e) { showInfoModal('結清失敗', esc(e.message || String(e))) }
    }
  })
}

async function lmSyncFromLease() {
  lmSetMsg('從合約比對中…')
  try {
    var res = await fetch('/admin/api/smartlock/sync-from-lease?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ landlordId: LOCKMGR.landlordId || undefined }),
    })
    var d = await res.json()
    if (!res.ok) { showInfoModal('同步失敗', esc(d.error || '')); return }
    await lmLoadRooms(); lmRender()
    var n = d.updated ? d.updated.length : 0
    var msg = n > 0
      ? '已依綁定的合約更新 ' + n + ' 間房間的房客 UID（以合約為準）。'
      : '沒有需要更新的房間。（請先在各房間的「綁定合約」下拉選好合約，且合約已填 LINE UID）'
    showInfoModal('🔗 從合約同步完成', esc(msg), false)
  } catch (e) { showInfoModal('同步失敗', esc(e.message || String(e))) }
}

async function lmImportLive() {
  var base = (document.getElementById('lmWorkerUrl').value || '').trim().replace(/\/+$/, '')
  if (!base) { showInfoModal('提醒', '請先填入 rubyclean 的 Worker 網址'); return }
  lmSetMsg('從雲端讀取中…')
  try {
    var res = await fetch(base + '/db/get?key=lock_db')
    var raw = await res.text()
    var live = {}
    try { live = JSON.parse(raw) } catch (e) {}
    if (!live || typeof live !== 'object' || !Object.keys(live).length) {
      showInfoModal('匯入失敗', esc('雲端未回傳有效門鎖資料（HTTP ' + res.status + '）：\n' + raw.slice(0, 200)))
      return
    }
    var n = 0
    Object.keys(live).forEach(function (key) {
      var v = live[key] || {}
      var cur = LOCKMGR.rooms[key] || {}
      var type = (['keypad', 'ttlock', 'traditional'].indexOf(v.type) >= 0) ? v.type : 'keypad'
      var entry = { type: type }
      if (type === 'ttlock') entry.ids = Array.isArray(v.ids) ? v.ids.map(Number).filter(function (x) { return !isNaN(x) && x > 0 }) : []
      if (cur.userId) entry.userId = cur.userId  // 保留已填的房客 User ID
      if (cur.leaseId) entry.leaseId = cur.leaseId  // 保留已綁定的合約
      LOCKMGR.rooms[key] = entry; n++
    })
    var save = await fetch('/admin/api/smartlock/rooms?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ landlordId: LOCKMGR.landlordId || undefined, rooms: LOCKMGR.rooms }),
    })
    var d = await save.json()
    if (!save.ok) { showInfoModal('儲存失敗', esc(d.error || '')); return }
    lmRender()
    showInfoModal('✅ 已從 rubyclean 雲端匯入', '共匯入／更新 ' + n + ' 間房間，並已儲存（保留原本填的房客 User ID）。', false)
  } catch (e) {
    showInfoModal('匯入失敗', esc('無法連線 Worker：' + (e && e.message ? e.message : e) + '\n請確認網址正確，且目前網路可連到該網址。'))
  }
}

function lmBuildingTabs() {
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">' +
    LOCKMGR.buildings.map(function(b){
      var on = b.id === LOCKMGR.curBldg
      return '<button onclick="lmSelectBldg(\'' + b.id + '\')" style="width:auto;padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer;border:1.5px solid ' +
        (on ? '#6B5A9A' : '#DDD') + ';background:' + (on ? '#6B5A9A' : '#fff') + ';color:' + (on ? '#fff' : '#555') + ';font-weight:' + (on ? '700' : '400') + ';">' + esc(b.label) + '</button>'
    }).join('') +
  '</div>'
}

function lmSelectBldg(id) { LOCKMGR.curBldg = id; lmRender() }

function lmRenderRooms() {
  var box = document.getElementById('lmRoomList'); if (!box) return
  var b = LOCKMGR.buildings.find(function(x){ return x.id === LOCKMGR.curBldg })
  if (!b) { box.innerHTML = ''; return }
  // 只顯示「目前棟別」的合約（對不到棟別的合約仍保留，避免遺漏）
  var bldgLeases = (LOCKMGR.leases || []).filter(function(L){ return L.buildingId === b.id || !L.buildingId })
  box.innerHTML = b.rooms.map(function(r){
    var key = b.id + '_' + r
    var lock = LOCKMGR.rooms[key] || { type: 'keypad' }
    var idsVal = (lock.ids && lock.ids.length) ? lock.ids.join(',') : ''
    var userVal = lock.userId || ''
    var isLock = lock.type === 'ttlock'
    return '<div style="border:1px solid #eee;border-radius:10px;padding:10px 12px;margin-bottom:8px;">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<div id="lmRoomLbl-' + key + '" style="font-weight:700;font-size:14px;min-width:60px;">' + lmEmoji(lock.type) + ' ' + r + '</div>' +
        '<select id="lmType-' + key + '" onchange="lmOnType(\'' + key + '\', this.value)" style="padding:7px 9px;border:1px solid #DDD;border-radius:8px;font-size:13px;">' +
          '<option value="ttlock"' + (lock.type === 'ttlock' ? ' selected' : '') + '>🔐 TTLock</option>' +
          '<option value="keypad"' + (lock.type === 'keypad' ? ' selected' : '') + '>🔢 密碼鎖</option>' +
          '<option value="traditional"' + (lock.type === 'traditional' ? ' selected' : '') + '>🗝️ 喇叭鎖</option>' +
        '</select>' +
        '<input id="lmIds-' + key + '" value="' + idsVal + '" placeholder="Lock ID（逗號分隔）" oninput="lmOnIds(\'' + key + '\', this.value)" ' +
          (isLock ? '' : 'disabled') + ' style="flex:1;min-width:120px;padding:7px 9px;border:1px solid #DDD;border-radius:8px;font-size:13px;' + (isLock ? '' : 'opacity:.4;') + '">' +
      '</div>' +
      '<div style="margin-top:8px;">' +
        '<label style="display:block;font-size:11px;color:#888;margin-bottom:3px;">綁定合約（選了以合約 UID 為準）</label>' +
        '<select id="lmLease-' + key + '" onchange="lmOnLease(\'' + key + '\', this.value)" style="width:100%;padding:8px 10px;border:1px solid #DDD;border-radius:8px;font-size:13px;margin-bottom:6px;">' +
          '<option value="">—（不綁合約，手動填 UID）—</option>' +
          bldgLeases.map(function(L){
            return '<option value="' + esc(L.id) + '"' + (lock.leaseId === L.id ? ' selected' : '') + '>' + esc(L.label) + (L.lineUserId ? '' : '（未填UID）') + '</option>'
          }).join('') +
        '</select>' +
        '<input id="lmUser-' + key + '" value="' + esc(userVal) + '" placeholder="房客 LINE User ID（形如 U....）" oninput="lmOnUser(\'' + key + '\', this.value)" ' +
          'style="width:100%;padding:8px 10px;border:1px solid #DDD;border-radius:8px;font-size:13px;font-family:monospace;">' +
      '</div>' +
    '</div>'
  }).join('')
}

function lmOnLease(key, leaseId) {
  var e = lmEnsure(key)
  if (!leaseId) { delete e.leaseId; return }
  e.leaseId = leaseId
  var lease = (LOCKMGR.leases || []).find(function(x){ return x.id === leaseId })
  if (lease) {
    e.userId = (lease.lineUserId || '').trim()
    var input = document.getElementById('lmUser-' + key)
    if (input) input.value = e.userId
    if (!e.userId) showToast('此合約尚未填 LINE UID，請先到合約租約填入')
  }
}

function lmEnsure(key) { if (!LOCKMGR.rooms[key]) LOCKMGR.rooms[key] = { type: 'keypad' }; return LOCKMGR.rooms[key] }

function lmOnType(key, type) {
  var e = lmEnsure(key); e.type = type
  if (type !== 'ttlock') delete e.ids
  var lbl = document.getElementById('lmRoomLbl-' + key)
  var ids = document.getElementById('lmIds-' + key)
  var room = key.split('_').slice(1).join('_')
  if (lbl) lbl.textContent = lmEmoji(type) + ' ' + room
  if (ids) { ids.disabled = type !== 'ttlock'; ids.style.opacity = type !== 'ttlock' ? '.4' : '1' }
}

function lmOnIds(key, val) {
  var e = lmEnsure(key)
  e.ids = val.split(',').map(function(s){ return Number(s.trim()) }).filter(function(n){ return !isNaN(n) && n > 0 })
}

function lmOnUser(key, val) {
  var e = lmEnsure(key)
  var v = (val || '').trim()
  if (v) e.userId = v; else delete e.userId
}

async function lmShowLocks() {
  var box = document.getElementById('lmLockList'); if (box) box.textContent = '讀取中…'
  try {
    var res = await fetch('/admin/api/smartlock/locks?key=' + encodeURIComponent(KEY))
    var d = await res.json()
    if (!res.ok) {
      var det = d.detail || {}
      var msg = det.errmsg || det.error_description || det.error || (det.errcode != null ? ('errcode ' + det.errcode) : '')
      var hint = ''
      if (/client/i.test(msg) || det.errcode === 10003) hint = '（Client ID／Client Secret 可能有誤）'
      else if (/password|user/i.test(msg)) hint = '（TTLock 帳號或密碼可能有誤）'
      box.innerHTML = '❌ ' + esc(d.error || '讀取失敗') + (msg ? '：' + esc(msg) : '') + (hint ? '<br>' + hint : '')
      return
    }
    if (!d.list || !d.list.length) { box.textContent = '（此帳號下沒有門鎖）'; return }
    box.innerHTML = '共 ' + d.count + ' 把：' + d.list.map(function(l){
      return '<code style="background:#f2f2f2;padding:1px 5px;border-radius:4px;margin:2px;display:inline-block;">' + esc(l.name || '(未命名)') + '=' + l.lockId + '</code>'
    }).join(' ')
  } catch (e) { if (box) box.textContent = '❌ ' + e.message }
}

async function saveManaged(id) {
  var body = {
    title: val('m_title'), address: val('m_address'),
    ownerName: val('m_ownerName'), ownerPhone: val('m_ownerPhone'),
    ownerBankName: val('m_ownerBankName'), ownerBank: val('m_ownerBank'),
    roomCount: val('m_roomCount'), manageType: val('m_manageType'),
    feePercent: val('m_feePercent'), leaseCost: val('m_leaseCost'),
    subleaseFeeType: val('m_subleaseFeeType'), subleaseFeeOther: val('m_subleaseFeeOther'),
    contractStart: val('m_contractStart'), contractEnd: val('m_contractEnd'),
  }
  if (!body.title || !body.ownerName) { showToast('❌ 社區名稱與屋主姓名必填'); return }
  var llSel = document.getElementById('m_landlordId')
  if (llSel) {
    if (!llSel.value) { showToast('❌ 請先選擇所屬房東／管理者'); return }
    body.landlordId = llSel.value
  }

  var url = id ? '/admin/api/managed/' + id : '/admin/api/managed'
  var res = await fetch(url + '?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  if (!res.ok) {
    var d = await res.json().catch(function(){ return {} })
    showToast('❌ 儲存失敗：' + (d.error || ('HTTP ' + res.status)))
    return
  }
  showToast('✅ 已儲存')
  closeManagedModal()
  renderManagedTab()
}

async function openManagedDetail(id, forceRefresh) {
  // 有快取且非強制刷新時，先立即顯示舊資料，再背景更新
  if (!forceRefresh && MANAGED.cache[id]) {
    MANAGED.current = MANAGED.cache[id]
    renderManagedDetail()
    // 背景靜默更新，完成後重繪
    fetch('/admin/api/managed/' + id + '?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(d){
        if (!d) return
        MANAGED.cache[id] = d
        if (MANAGED.current && MANAGED.current.id === id) {
          MANAGED.current = d
          renderManagedDetail()
        }
      }).catch(function(){})
    return
  }
  var res = await fetch('/admin/api/managed/' + id + '?key=' + encodeURIComponent(KEY))
  if (!res.ok) { showToast('❌ 載入失敗'); return }
  MANAGED.current = await res.json()
  MANAGED.cache[id] = MANAGED.current
  renderManagedDetail()
}

async function syncRagic() {
  ragicProgressShow('連線 Ragic…')
  var res, data
  try {
    res = await fetch('/admin/api/ragic/sync?key=' + encodeURIComponent(KEY), { method: 'POST' })
    if (!res.ok) { ragicProgressHide(); var e = await res.json().catch(function(){ return {} }); showToast('❌ 合約同步失敗：' + (e.error || res.status)); return }
    data = await readSyncStream(res, ragicProgressSet)
  } catch (err) { ragicProgressHide(); showToast('❌ 連線失敗：' + err.message); return }
  ragicProgressHide()
  if (!data) { showToast('❌ 同步未完成，請重試'); return }
  if (data.ok === false) { showToast('❌ 合約同步失敗：' + (data.error || '')); return }
  showToast('✅ 合約同步完成！新增 ' + data.created + ' 筆 / 更新 ' + data.updated + ' 筆（共 ' + data.total + ' 筆）・LINE ID ' + (data.rawLine || 0) + ' 筆 / 已連結 ' + (data.linkedLine || 0) + ' 筆')
  // 都沒同步進去時，跳出診斷讓房東知道卡在哪
  if ((data.created + data.updated) === 0) {
    var lines = []
    if (data.total === 0) {
      lines.push('Ragic 抓到「承租中」0 筆。')
      lines.push('Ragic 回傳資料列數：' + (data.rawCount || 0) + ' 筆')
      if (data.httpStatus) lines.push('⚠️ Ragic API 回應狀態碼：' + data.httpStatus + '（非 200，多為金鑰或網址錯誤）')
      if (data.rawCount === 0 && data.rawText) {
        lines.push('\nRagic 原始回應（前段）：\n' + data.rawText)
      }
      if (data.topLevel && data.rawCount === 0) lines.push('\n回應最上層結構：' + (Array.isArray(data.topLevel) ? data.topLevel.join('、') : data.topLevel))
      if (data.statusValues && data.statusValues.length) {
        lines.push('\n實際「承租狀態」欄位的值有：\n' + data.statusValues.join('、'))
        lines.push('（程式在找「承租中」，若上面沒有這三個字，就是狀態值不同）')
      } else {
        lines.push('\n⚠️ 資料裡找不到「承租狀態」這個欄位。')
      }
      if (data.sampleFields && data.sampleFields.length) {
        lines.push('\nRagic 實際欄位名稱：\n' + data.sampleFields.join('、'))
      }
    } else {
      lines.push('Ragic 抓到「承租中」' + data.total + ' 筆，但 0 筆寫入。原因：')
      if (data.skipNoId) lines.push('• ' + data.skipNoId + ' 筆缺「合約編號」')
      if (data.skipNoBuilding) lines.push('• ' + data.skipNoBuilding + ' 筆的「社區名稱|房屋號」不在對照表')
      if (data.skipNoProperty) lines.push('• ' + data.skipNoProperty + ' 筆對照到標題但後台沒有該委託物業')
      if (data.unmatched && data.unmatched.length) lines.push('\n對不上的建物：\n' + data.unmatched.join('\n'))
    }
    if (data.availableTitles && data.availableTitles.length) lines.push('\n後台現有委託物業標題：\n' + data.availableTitles.join('、'))
    alert(lines.join('\n'))
  }
}

function showImportProgress(title, stages) {
  stages = stages || ['連線 Gmail…', '讀取台電帳單…', '解析金額與地址…', '對應物業中…']
  var html = '<div id="impProgModal" class="modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:410;display:flex;align-items:center;justify-content:center;padding:20px;">' +

      '<div style="font-size:15px;font-weight:700;color:#B07A2E;margin-bottom:14px;">' + (title || '⚡ 匯入台電') + '</div>' +
      '<div id="impProgText" style="font-size:13px;color:#666;margin-bottom:10px;">' + stages[0] + '</div>' +
      '<div style="height:10px;background:#EFEBE3;border-radius:6px;overflow:hidden;"><div id="impProgBar" style="height:100%;width:6%;background:linear-gradient(90deg,#C6982E,#B07A2E);border-radius:6px;transition:width .35s ease;"></div></div>' +
    '</div></div>'
  var ex = document.getElementById('impProgModal'); if (ex) ex.remove()
  document.body.insertAdjacentHTML('beforeend', html)
  var pct = 6, si = 0
  window._impProgTimer = setInterval(function(){
    pct = Math.min(92, pct + Math.random() * 9 + 3)
    var b = document.getElementById('impProgBar'); if (b) b.style.width = pct + '%'
    var tx = document.getElementById('impProgText')
    if (tx && si < stages.length - 1 && pct > (si + 1) * (90 / stages.length)) { si++; tx.textContent = stages[si] }
  }, 420)
}
function finishImportProgress() {
  clearInterval(window._impProgTimer)
  var b = document.getElementById('impProgBar'); if (b) b.style.width = '100%'
  var tx = document.getElementById('impProgText'); if (tx) tx.textContent = '完成 ✓'
  setTimeout(function(){ var m = document.getElementById('impProgModal'); if (m) m.remove() }, 300)
}

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<h3 style="margin:0;font-size:16px;">⚡ 匯入台電帳單</h3>' +
        '<button onclick="var m=document.getElementById(\'taipowerModal\');if(m)m.remove()" style="border:none;background:none;font-size:22px;cursor:pointer;">×</button>' +
      '</div>' +
      '<div style="font-size:12px;color:#888;margin-bottom:10px;">從 Gmail 讀到 ' + (data.emailCount||0) + ' 封台電信，解析並對應到物業如下。確認後才會建立支出（已匯入者自動略過）。</div>' +
      '<div style="overflow-x:auto;border:1px solid #EEE;border-radius:8px;"><table style="width:100%;border-collapse:collapse;min-width:420px;"><thead><tr style="background:#FBF6EC;"><th style="padding:6px 8px;text-align:left;font-size:11px;">物業</th><th style="padding:6px 8px;text-align:left;font-size:11px;">樓層/電號</th><th style="padding:6px 8px;text-align:left;font-size:11px;">期別</th><th style="padding:6px 8px;text-align:right;font-size:11px;">金額</th><th style="padding:6px 8px;text-align:left;font-size:11px;">狀態</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +

// 合約功能（委託合約條款 + 租約管理 + 文件上傳）
// ═══════════════════════════════════════════════════════════════

// 在明細對帳視窗加「合約管理」按鈕 → 開合約視窗
var _leaseFormOrigin = 'contract'  // 'contract'=從合約租約視窗開的；'list'=從代管清單鉛筆開的

async function openContractManager(id) {
  _leaseFormOrigin = 'contract'

  var results = await Promise.all([
    fetch('/admin/api/managed/' + id + '?light=1&key=' + encodeURIComponent(KEY)),
    fetch('/admin/api/managed/' + id + '/leases?key=' + encodeURIComponent(KEY)),
  ])
  if (!results[0].ok) { showToast('❌ 載入失敗'); return }
  MANAGED.current = await results[0].json()
  MANAGED.leases = results[1].ok ? await results[1].json() : []
  renderContractManager()
}

function contractRoomList() {
  var m = MANAGED.current
  try { var a = JSON.parse(m.roomLabels || '[]'); return Array.isArray(a) ? a : [] } catch (e) { return [] }
}
function renderContractManager() {
  var m = MANAGED.current
  function fmtDate(d) { return d ? new Date(d).toISOString().slice(0,10) : '' }
  var leases = MANAGED.leases || []
  // 生效中：狀態為 ACTIVE 且未過租期（leaseEnd 早於今天者視為已到期，不算生效中）
  function isActiveNow(l) {
    if (l.status !== 'ACTIVE') return false
    if (!l.leaseEnd) return true
    var end = new Date(l.leaseEnd); end.setHours(23, 59, 59, 999)
    return end.getTime() >= Date.now()
  }
  var activeLeases = leases.filter(isActiveNow)
  var inactiveLeases = leases.filter(function(l){ return !isActiveNow(l) })
  var rooms = contractRoomList()

  // 房號 → 生效中合約（同房號取第一筆）
  var byRoom = {}
  activeLeases.forEach(function(l){ var k = (l.roomLabel || '').trim(); if (k && !byRoom[k]) byRoom[k] = l })

  function endWarnOf(l) {
    if (!l.leaseEnd) return ''
    var days = Math.ceil((new Date(l.leaseEnd) - new Date()) / 86400000)
    if (days <= 30 && days >= 0) return ' <span style="color:#E5A33C;font-size:11px;">⚠️ ' + days + '天後到期</span>'
    if (days < 0) return ' <span style="color:#C0524A;font-size:11px;">已逾期</span>'
    return ''
  }
  // 跳色間隔背景
  function rowBg(i) { return (i % 2 === 0) ? '#FFFFFF' : '#F5F2EC' }
  // 條列式：生效中合約列（緊湊、日期不換行）；dupNote 用來標示同房號重複
  function occupiedRow(room, l, i, dupNote) {
    var roomCell = esc(room || l.roomLabel || '—') + (dupNote ? '<br><span style="font-size:10px;color:#C0524A;font-weight:400;white-space:nowrap;">' + dupNote + '</span>' : '')
    return '<tr style="background:' + (dupNote ? '#FBF0EE' : rowBg(i)) + ';">' +
      '<td style="padding:6px 8px;font-size:13px;font-weight:700;color:#26362D;white-space:nowrap;">' + roomCell + '</td>' +
      '<td style="padding:6px 8px;font-size:13px;white-space:nowrap;">' + esc(l.tenantName || '—') + '</td>' +
      '<td style="padding:6px 8px;font-size:13px;white-space:nowrap;text-align:right;">NT$ ' + Number(l.rent||0).toLocaleString() + '</td>' +
      '<td style="padding:6px 8px;font-size:12px;white-space:nowrap;">' + fmtDate(l.leaseStart) + ' ~ ' + fmtDate(l.leaseEnd) + endWarnOf(l) + '</td>' +
      '<td style="padding:6px 8px;white-space:nowrap;text-align:center;"><span style="font-size:11px;color:#4A8A4A;background:#E4F1E4;border-radius:99px;padding:2px 8px;">生效中</span></td>' +
      '<td style="padding:6px 8px;white-space:nowrap;text-align:center;">' +
        (l.contractFile ? '<a href="' + esc(l.contractFile) + '" target="_blank" style="font-size:12px;color:#4A6741;">📄</a> ' : '') +
        '<button onclick="openLeaseForm(\'' + l.id + '\')" style="border:none;background:none;cursor:pointer;font-size:13px;">✏️</button>' +
        '<button onclick="deleteLease(\'' + l.id + '\')" style="border:none;background:none;cursor:pointer;color:#C0524A;">✕</button>' +
      '</td>' +
    '</tr>'
  }
  // 條列式：空房位列（附「新增合約」）
  function vacantRow(room, i) {
    return '<tr style="background:' + rowBg(i) + ';">' +
      '<td style="padding:6px 8px;font-size:13px;font-weight:700;color:#8A8377;white-space:nowrap;">' + esc(room) + '</td>' +
      '<td style="padding:6px 8px;font-size:12px;color:#B0A891;white-space:nowrap;" colspan="3">目前無承租合約（空房）</td>' +
      '<td style="padding:6px 8px;white-space:nowrap;text-align:center;"><span style="font-size:11px;color:#9A927F;background:#EEE9DF;border-radius:99px;padding:2px 8px;">空房</span></td>' +
      '<td style="padding:6px 8px;white-space:nowrap;text-align:center;"><button class="btn" style="padding:4px 10px;font-size:12px;width:auto;white-space:nowrap;" onclick="openLeaseForm(null, ' + jsArg(room) + ')">＋ 新增合約</button></td>' +
    '</tr>'
  }

  // 依房號清單排；每個房號取一筆為代表，其餘生效合約（同房號重複／不在清單內）
  // 都各自列一行，確保不會被藏起來、且「生效中」數量與列數一致。
  var rowItems = []
  var usedLeaseIds = {}
  if (rooms.length) {
    rooms.forEach(function(room){
      var l = byRoom[(room || '').trim()] || null
      if (l) usedLeaseIds[l.id] = 1
      rowItems.push({ room: room, l: l })
    })
    activeLeases.forEach(function(l){
      if (usedLeaseIds[l.id]) return
      usedLeaseIds[l.id] = 1
      var k = (l.roomLabel || '').trim()
      var dup = k && byRoom[k] && byRoom[k].id !== l.id  // 該房號已有另一筆生效合約
      rowItems.push({ room: l.roomLabel, l: l, dupNote: dup ? '⚠️ 同房號重複' : '' })
    })
  } else {
    activeLeases.forEach(function(l){ rowItems.push({ room: l.roomLabel, l: l }) })
  }
  var _dupCount = rowItems.filter(function(it){ return it.dupNote }).length
  var bodyRows = rowItems.map(function(it, i){
    return it.l ? occupiedRow(it.room, it.l, i, it.dupNote) : vacantRow(it.room, i)
  }).join('')
  var roomGrid = bodyRows
    ? '<div style="overflow-x:auto;border:1px solid #EEE;border-radius:8px;">' +
        '<table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#F5F0EA;">' +
        '<th style="padding:6px 8px;text-align:left;font-size:12px;white-space:nowrap;">房號</th><th style="padding:6px 8px;text-align:left;font-size:12px;white-space:nowrap;">承租人</th><th style="padding:6px 8px;text-align:right;font-size:12px;white-space:nowrap;">租金</th><th style="padding:6px 8px;text-align:left;font-size:12px;white-space:nowrap;">租期</th><th style="padding:6px 8px;text-align:center;font-size:12px;white-space:nowrap;">狀態</th><th style="padding:6px 8px;text-align:center;font-size:12px;white-space:nowrap;">操作</th>' +
        '</tr></thead><tbody>' + bodyRows + '</tbody></table>' +
      '</div>'
    : '<div style="padding:16px;text-align:center;color:#aaa;">尚無生效中合約</div>'

  var roomNote = rooms.length
    ? ''
    : '<div style="font-size:12px;color:#B07A2E;background:#FBF4E4;border-radius:8px;padding:8px 10px;margin-bottom:10px;">尚未設定房號清單。設定後可看到每間房的空/租狀態，並在空房位直接新增合約。</div>'

  // 已過期／已終止（可收合）
  var inactiveRows = inactiveLeases.map(function(l){
    var statusLabel = { ENDED:'已終止', EXPIRED:'已到期' }[l.status] || (l.status === 'ACTIVE' ? '已到期' : l.status)
    var settled = l.settledAt ? '　·　已結算 ' + fmtDate(l.endedAt || l.settledAt) + (l.earlyTerminated ? '（提前終止）' : '') : ''
    return '<tr>' +
      '<td style="padding:8px;font-size:13px;color:#666;">' + esc(l.roomLabel || '—') + '</td>' +
      '<td style="padding:8px;font-size:13px;color:#666;">' + esc(l.tenantName || '—') + '</td>' +
      '<td style="padding:8px;font-size:12px;color:#888;">' + fmtDate(l.leaseStart) + ' ~ ' + fmtDate(l.leaseEnd) + '</td>' +
      '<td style="padding:8px;font-size:12px;color:#999;">' + statusLabel + settled + '</td>' +
      '<td style="padding:8px;">' +
        (l.contractFile ? '<a href="' + esc(l.contractFile) + '" target="_blank" style="font-size:12px;color:#4A6741;">📄</a> ' : '') +
        '<button onclick="openLeaseForm(\'' + l.id + '\')" style="border:none;background:none;cursor:pointer;font-size:13px;">✏️</button>' +
        '<button onclick="deleteLease(\'' + l.id + '\')" style="border:none;background:none;cursor:pointer;color:#C0524A;">✕</button>' +
      '</td>' +
    '</tr>'
  }).join('')
  var inactiveSection = inactiveLeases.length
    ? '<div style="margin-top:16px;border:1px solid #E5E0D5;border-radius:10px;overflow:hidden;">' +
        '<div onclick="var x=document.getElementById(\'inactiveLeaseBox\');var open=x.style.display!==\'none\';x.style.display=open?\'none\':\'\';this.querySelector(\'.arw\').textContent=open?\'▸\':\'▾\';" style="display:flex;justify-content:space-between;align-items:center;background:#EFEBE3;padding:10px 14px;cursor:pointer;font-weight:700;font-size:14px;color:#7A7367;">' +
          '<span>🗂️ 已過期／已終止（' + inactiveLeases.length + '）</span><span class="arw">▸</span>' +
        '</div>' +
        '<div id="inactiveLeaseBox" style="display:none;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#F5F0EA;">' +
          '<th style="padding:8px;text-align:left;font-size:12px;">房號</th><th style="padding:8px;text-align:left;font-size:12px;">承租人</th><th style="padding:8px;text-align:left;font-size:12px;">租期</th><th style="padding:8px;text-align:left;font-size:12px;">狀態</th><th style="padding:8px;text-align:left;font-size:12px;">操作</th>' +
        '</tr></thead><tbody>' + inactiveRows + '</tbody></table></div>' +
      '</div>'
    : ''

  var html = '<div id="contractModal" class="modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:320;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;">' +
    '<div style="background:#fff;border-radius:16px;padding:24px;max-width:720px;width:100%;margin:auto;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
      '<h3 style="margin:0;">合約管理 — ' + esc(m.title) + '</h3>' +
      '<button onclick="closeContractModal()" style="border:none;background:none;font-size:22px;cursor:pointer;">×</button>' +
    '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;">' +
      '<div style="font-weight:700;font-size:14px;">🏠 房客合約（生效中 ' + activeLeases.length + (rooms.length ? ' / 共 ' + rooms.length + ' 間' : '') + '）' +
        (_dupCount ? '<br><span style="font-size:11px;color:#C0524A;font-weight:400;">⚠️ 有 ' + _dupCount + ' 筆同房號重複的生效合約，請確認是否需終止舊約</span>' : '') + '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="btn" style="padding:6px 12px;font-size:13px;background:#8A8A8A;" onclick="openRoomLabelEditor()">設定房號</button>' +
        '<button class="btn" style="padding:6px 14px;font-size:13px;" onclick="openLeaseForm()">+ 新增租約</button>' +
      '</div>' +
    '</div>' +
    roomNote +
    roomGrid +
    inactiveSection +
    '</div></div>'

  var ex = document.getElementById('contractModal'); if (ex) ex.remove()
  document.body.insertAdjacentHTML('beforeend', html)
}

async function saveRoomLabels() {
  var el = document.getElementById('roomLabelInput')
  var val = el ? el.value : ''
  try {
    var res = await fetch('/admin/api/managed/' + MANAGED.current.id + '/rooms?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ rooms: val })
    })
    var d = await res.json()
    if (!res.ok) { showToast('❌ ' + (d.error || '儲存失敗')); return }
    MANAGED.current.roomLabels = d.roomLabels
    var x = document.getElementById('roomLabelModal'); if (x) x.remove()
    showToast('✅ 已儲存 ' + (d.rooms ? d.rooms.length : 0) + ' 個房號')
    renderContractManager()
  } catch (e) { showToast('❌ 連線失敗') }
}

function closeContractModal() { var m = document.getElementById('contractModal'); if (m) m.remove() }

var _uploadedContractFile = null
async function uploadContractFile(input, target) {
  if (!input.files || !input.files[0]) return
  var statusEl = document.getElementById('c_file_status')
  if (statusEl) statusEl.textContent = '上傳中...'
  var fd = new FormData(); fd.append('file', input.files[0])
  try {
    var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
    if (!res.ok) { if (statusEl) statusEl.textContent = '❌ 失敗'; return }
    var data = await res.json()
    _uploadedContractFile = data.url
    if (statusEl) statusEl.textContent = '✅ 已上傳（記得按儲存）'
  } catch (e) { if (statusEl) statusEl.textContent = '❌ 失敗' }
}

async function saveContract() {
  var body = {
    deposit: val('c_deposit'), payDay: val('c_payDay'), payMethod: val('c_payMethod'),
  }
  if (_uploadedContractFile) body.contractFile = _uploadedContractFile
  var res = await fetch('/admin/api/managed/' + MANAGED.current.id + '/contract?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  if (!res.ok) { showToast('❌ 儲存失敗'); return }
  showToast('✅ 委託合約已儲存')
  _uploadedContractFile = null
  openContractManager(MANAGED.current.id)
}

async function editLeaseFromList(leaseId) {
  var d = MANAGED.leaseList || {}
  var all = (d.active || []).concat(d.expiring || [], d.expired || [], d.ended || [])
  var l = all.filter(function(x){ return x.id === leaseId })[0]
  if (!l) { showToast('❌ 找不到租約'); return }
  // 兩支彼此無關，平行打可省掉一次來回的等待時間
  var results = await Promise.all([
    fetch('/admin/api/managed/' + l.managedId),
    fetch('/admin/api/managed/' + l.managedId + '/leases'),
  ])
  if (!results[0].ok) { showToast('❌ 載入租約失敗'); return }
  MANAGED.current = await results[0].json()
  MANAGED.leases = results[1].ok ? await results[1].json() : []
  _leaseFormOrigin = 'list'
  openLeaseForm(leaseId)
}

function toggleUtilMode() {
  var sel = document.getElementById('l_utilMode')
  if (!sel) return
  // 固定費率才需要在合約上設每度費率；台水台電依實際帳單，每期到電費明細表填即可

}

function toggleDiscountField() {
  var sel = document.getElementById('l_discountType')
  if (!sel) return
  var box = document.getElementById('discountValueBox')
  var label = document.getElementById('discountValueLabel')
  if (box) box.style.display = sel.value === 'NONE' ? 'none' : 'block'
  if (label) label.textContent = sel.value === 'PERCENT' ? '折扣百分比 %' : '折扣金額'
  updateDiscountPreview()
}
function updateDiscountPreview() {
  var el = document.getElementById('discountPreview')
  if (!el) return
  var type = document.getElementById('l_discountType') ? document.getElementById('l_discountType').value : 'NONE'
  var rent = parseFloat(val('l_rent')) || 0
  var v = parseFloat(val('l_discountValue')) || 0
  if (type === 'NONE' || !rent) { el.textContent = ''; return }
  var effective = type === 'FIXED' ? Math.max(0, rent - v) : Math.max(0, Math.round(rent * (1 - v / 100)))
  el.textContent = '折扣後實收 NT$ ' + effective.toLocaleString() + '/月'
}

function closeLeaseModal() { var m = document.getElementById('leaseModal'); if (m) m.remove() }

async function uploadLeaseFile(input) {
  if (!input.files || !input.files[0]) return
  var statusEl = document.getElementById('l_file_status')
  if (statusEl) statusEl.textContent = '上傳中...'
  var fd = new FormData(); fd.append('file', input.files[0])
  try {
    var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
    if (!res.ok) { if (statusEl) statusEl.textContent = '❌ 失敗'; return }
    var data = await res.json()
    _uploadedLeaseFile = data.url
    if (statusEl) statusEl.textContent = '✅ 已上傳'
  } catch (e) { if (statusEl) statusEl.textContent = '❌ 失敗' }
}

async function saveLease(leaseId) {
  // 從選的租客取得 lineUserId
  var tenantSel = document.getElementById('l_lineTenantId')
  var lineTenantId = tenantSel ? tenantSel.value : ''
  var lineUserId = val('l_lineUserId')
  // 以「手動輸入的 UID」為準（可覆蓋）；只有欄位留空時，才用下拉選的租客 UID 帶入
  if (!lineUserId && lineTenantId && MANAGED_OPTS.tenants) {
    var t = MANAGED_OPTS.tenants.find(function(x){ return x.id === lineTenantId })
    if (t) lineUserId = t.lineUserId || ''
  }

  var body = {
    tenantName: val('l_tenantName'), tenantPhone: val('l_tenantPhone'), tenantIdNo: val('l_tenantIdNo'),
    roomLabel: val('l_roomLabel'), rent: val('l_rent'),
    discountType: document.getElementById('l_discountType') ? document.getElementById('l_discountType').value : 'NONE',
    discountValue: val('l_discountValue'),
    deposit: val('l_deposit'),
    prepaidUtility: val('l_prepaidUtility'),
    leaseStart: val('l_leaseStart'), leaseEnd: val('l_leaseEnd'),
    status: document.getElementById('l_status').value,
    propertyId: document.getElementById('l_propertyId').value,
    lineTenantId: lineTenantId,
    lineUserId: lineUserId,
    rentPayDay: val('l_rentPayDay'),
    paymentCycle: document.getElementById('l_paymentCycle').value,
    paymentDueMode: document.getElementById('l_paymentDueMode').value,
    rentRemindOn: document.getElementById('l_rentRemindOn').checked,
    utilPayDay: val('l_utilPayDay'),
    utilRemindOn: document.getElementById('l_utilRemindOn').checked,
    utilMode: document.getElementById('l_utilMode') ? document.getElementById('l_utilMode').value : 'FIXED',
    meterRate: val('l_meterRate'),
    meterInitial: val('l_meterInitial'),
    meterReadDate: (document.getElementById('l_meterReadDate') && document.getElementById('l_meterReadDate').value) || null,
    parkingSpotId: document.getElementById('l_parkingSpotId').value.trim() || null,
    parkingSpace: document.getElementById('l_parkingSpace').value.trim() || null,
    parkingFee: val('l_parkingFee'),
    vehiclePlate: document.getElementById('l_vehiclePlate').value.trim() || null,
  }
  if (!body.tenantName) { showToast('❌ 承租人姓名必填'); return }
  if (leaseId) body.leaseId = leaseId
  if (_uploadedLeaseFile) body.contractFile = _uploadedLeaseFile

  var res = await fetch('/admin/api/managed/' + MANAGED.current.id + '/lease?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  if (!res.ok) { showToast('❌ 儲存失敗'); return }
  showToast('✅ 租約已儲存')
  closeLeaseModal()
  if (_leaseFormOrigin === 'list') showLeaseList()
  else openContractManager(MANAGED.current.id)
}

async function deleteLease(leaseId) {
  if (!confirm('確定刪除此租約？')) return
  var res = await fetch('/admin/api/managed/lease/' + leaseId + '?key=' + encodeURIComponent(KEY), { method: 'DELETE' })
  if (!res.ok) { showToast('❌ 刪除失敗'); return }
  showToast('✅ 已刪除')
  closeLeaseModal()
  if (_leaseFormOrigin === 'list') showLeaseList()
  else openContractManager(MANAGED.current.id)
}

// 代管清單分頁狀態
var LEASE_TAB = 'active'
var LEASE_SORT = 'room'   // 預設房號升冪：tenant / room / title / rent / end / nextRent
var LEASE_SORT_DIR = 'asc'
var LEASE_SEARCH = ''
var LEASE_DUE = ''          // '' / '7' / '14' / '30'：只看即將繳費 N 天內

function leaseSortCompare(a, b) {
  var dir = LEASE_SORT_DIR === 'desc' ? -1 : 1
  var diff = 0
  switch (LEASE_SORT) {
    case 'room':
      diff = String(a.roomLabel || '').localeCompare(String(b.roomLabel || ''), 'zh-Hant', { numeric: true })
      break
    case 'title':
      diff = String(a.managedTitle || '').localeCompare(String(b.managedTitle || ''), 'zh-Hant')
      break
    case 'rent':
      diff = (a.rent || 0) - (b.rent || 0)
      break
    case 'end':
      diff = new Date(a.leaseEnd || '2999-12-31') - new Date(b.leaseEnd || '2999-12-31')
      break
    case 'nextRent':
      diff = new Date(a.nextRentDate || '2999-12-31') - new Date(b.nextRentDate || '2999-12-31')
      break
    default:
      diff = String(a.tenantName || '').localeCompare(String(b.tenantName || ''), 'zh-Hant')
  }
  if (!diff) diff = String(a.roomLabel || '').localeCompare(String(b.roomLabel || ''), 'zh-Hant', { numeric: true })
  return diff * dir
}
function applyLeaseFilterSort(list) {
  var q = LEASE_SEARCH.trim().toLowerCase()
  var out = q
    ? list.filter(function(l) {
        return [l.tenantName, l.managedTitle, l.roomLabel, l.ownerName].some(function(v) {
          return String(v || '').toLowerCase().indexOf(q) !== -1
        })
      })
    : list.slice()
  // 即將繳費篩選：保留下期繳租在 N 天內（含已逾期）的租約
  if (LEASE_DUE) {
    var n = parseInt(LEASE_DUE)
    out = out.filter(function(l) { return l.daysToRent != null && l.daysToRent <= n })
  }
  out.sort(leaseSortCompare)
  return out
}
function setLeaseSort(key) {
  if (LEASE_SORT === key) {
    LEASE_SORT_DIR = LEASE_SORT_DIR === 'asc' ? 'desc' : 'asc'
  } else {
    LEASE_SORT = key
    LEASE_SORT_DIR = 'asc'
  }
  renderLeaseList()
}
async function showLeaseList() {

  var res = await fetch('/admin/api/managed-leases?key=' + encodeURIComponent(KEY))

    var ed = {}; try { ed = await res.json() } catch (e) {}

    showInfoModal('❌ 代管清單載入失敗', (ed.error || ('HTTP ' + res.status)))
    return
  }
  MANAGED.leaseList = await res.json()
  renderLeaseList()
}

function renderLeaseList() {
  var box = document.getElementById('managedReportBox')
  if (['overview','active','rentDueSoon','expiring','expired'].indexOf(LEASE_TAB) < 0) LEASE_TAB = 'active'
  var d = MANAGED.leaseList
  var counts = {
    overview: (d.overview || []).length,
    active: (d.active || []).length,
    rentDueSoon: (d.rentDueSoon || []).length,
    expiring: (d.expiring || []).length,
    expired: (d.expired || []).length
  }

  function tabBtn(key, label, count, color) {
    var active = LEASE_TAB === key
    return '<button class="spin-btn" onclick="btnLoad(this, function(){ LEASE_TAB=\'' + key + '\'; return renderLeaseList() })" style="flex:none;white-space:nowrap;padding:8px 16px;border:none;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;background:' + (active ? color : '#EEE') + ';color:' + (active ? '#fff' : '#888') + ';">' + label + ' ' + count + '</button>'
  }
  function fmt(dt) { return dt ? new Date(dt).toLocaleDateString('zh-TW') : '—' }
  function sortTh(key, label) {
    var active = LEASE_SORT === key
    var arrow = active ? (LEASE_SORT_DIR === 'asc' ? '↑' : '↓') : '↕'
    // 承租人為固定欄（橫向捲動時不動）
    var sticky = key === 'tenant' ? 'position:sticky;left:0;z-index:3;background:#FAF8F4;box-shadow:2px 0 4px rgba(0,0,0,0.06);' : ''
    return '<th style="padding:8px;text-align:left;font-size:12px;white-space:nowrap;' + sticky + '">' +
      '<button onclick="setLeaseSort(\'' + key + '\')" style="border:none;background:none;padding:0;color:' + (active ? '#4A6741' : '#222') + ';font-size:12px;font-weight:700;cursor:pointer;">' +
        label + ' <span style="font-size:11px;color:' + (active ? '#4A6741' : '#aaa') + ';">' + arrow + '</span>' +
      '</button></th>'
  }

  function leaseRow(l, _i) {
    var rowBg = (_i % 2 === 0) ? '#FFFFFF' : '#F5F2EC'
    var endInfo = fmt(l.leaseEnd)
    if (l.daysToEnd != null && l.status === 'EXPIRING') endInfo += ' <span style="color:#E5A33C;font-size:11px;">即將釋出·' + l.daysToEnd + '天</span>'
    if (l.status === 'EXPIRED') endInfo += ' <span style="color:#C0524A;font-size:11px;">已過期</span>'
    if (l.settledAt) {
      endInfo += '<br><span style="color:#888;font-size:11px;">已結算 ' + fmt(l.endedAt || l.settledAt) + '</span>'
      if (l.earlyTerminated) endInfo += ' <span style="color:#C0524A;font-size:10px;">·提前終止</span>'
    }
    // 租金狀態：
    //  有應繳日已到未繳 → 尚欠 X 期租金 $XXX（紅）
    //  合約內每期都繳清（含未到期）→ 已繳清（綠）
    //  只是還有未到期的期別未繳 → 顯示下期資訊（不算已繳清）
    var nextRent = l.nextRentDate ? new Date(l.nextRentDate).toLocaleDateString('zh-TW') : ''
    var nextNote = ''
    if (l.nextRentDate) {
      var when = l.daysToRent == null ? '' : (l.daysToRent === 0 ? '今天繳租' : l.daysToRent + '天後繳租')
      nextNote = '下期 ' + nextRent + (when ? '（' + when + '）' : '')
    }
    var rentStatus
    if ((l.arrearsCount || 0) > 0) {
      // 有逾期未繳→紅色強調；只是未到期尚未繳→琥珀色
      var owedColor = (l.overdueCount || 0) > 0 ? '#C0524A' : '#B07A2E'
      rentStatus = '<span style="color:' + owedColor + ';font-weight:700;">尚欠 ' + l.arrearsCount + ' 期租金 NT$ ' + Number(l.arrearsTotal || 0).toLocaleString() + '</span>' +
        (nextNote ? '<br><span style="color:#999;">' + nextNote + '</span>' : '')
    } else if (l.fullyPaid) {
      rentStatus = '<span style="color:#2E7D32;font-weight:700;">已繳清</span>'
    } else {
      rentStatus = '<span style="color:#999;">' + (nextNote || '—') + '</span>'
    }
    var propLink = l.propertyId
      ? '<a href="' + (DATA.siteUrl || '') + '/property/' + l.propertyId + '" target="_blank" style="color:#4A6741;font-size:12px;">🔗 房源頁</a>'
      : '<span style="font-size:12px;color:#bbb;">房源未連結</span>'
    // LINE 只分「已綁定 / 未綁」；不再區分匯入或綁定
    var hasLine = l.lineLinked || l.lineImported || l.lineBound || !!l.lineUserId
    var lineBadge = hasLine
      ? '<span onclick="copyText(' + jsArg(l.lineUserId || '') + ')" title="點擊複製 LINE userID" style="color:#06C755;font-size:12px;cursor:pointer;">● LINE 綁定</span>'
      : '<span style="color:#ccc;font-size:12px;">○ LINE 未綁</span>'
    return '<tr style="background:' + rowBg + ';">' +

function settleRecalc() {
  var deposit = Number((document.getElementById('settle_deposit') || {}).value || 0)
  var prepaid = Number((document.getElementById('settle_prepaid') || {}).value || 0)
  var charge = 0, refundBack = 0
  document.querySelectorAll('#settleDeductions .settle-ded-amt').forEach(function(el) {
    var v = Number(el.value || 0)
    if (v >= 0) charge += v; else refundBack += -v   // 正數＝應扣；負數＝退款項
  })
  var total = charge - refundBack
  var refund = deposit + prepaid - total
  var box = document.getElementById('settleResult')
  if (!box) return
  var n2 = function(x){ return Number(x || 0).toLocaleString() }
  var formula = '<div style="font-size:12px;color:#888;white-space:nowrap;">押金 ' + n2(deposit) + ' ＋ 預收 ' + n2(prepaid) + (refundBack ? ' ＋ 退款 ' + n2(refundBack) : '') + ' － 應扣 ' + n2(charge) + '</div>'
  if (refund >= 0) {
    box.innerHTML = formula +
      '<div style="font-size:19px;font-weight:800;color:#2E7D46;margin-top:4px;white-space:nowrap;">應退還房客 ' + leaseMoney(refund) + '</div>'
  } else {
    box.innerHTML = formula +
      '<div style="font-size:19px;font-weight:800;color:#C0524A;margin-top:4px;white-space:nowrap;">應補繳 ' + leaseMoney(-refund) + '</div>'
  }
}

function settleMeterCalc() {
  var ctx = window.__settleCtx || {}
  var start = Number(ctx.meterStart || 0)
  var end = (document.getElementById('settle_meterEnd') || {}).value
  var rate = Number((document.getElementById('settle_meterRate') || {}).value || 0)

  return amt

var SETTLE_RENT_REFUND_NAME = '退還租金'
// 按日退租金：月租 ÷ 當月實際天數，退租日隔天起至已繳到期日（含）逐日累加
function settleRentRefundCalc() {
  var ctx = window.__settleCtx || {}
  var rent = Number(ctx.monthlyRent || 0)
  var thru = (document.getElementById('settle_refundPaidThru') || {}).value
  var settleD = (document.getElementById('settle_settledAt') || {}).value
  var box = document.getElementById('settleRentRefundResult')
  var warn = function(msg) { if (box) box.innerHTML = '<span style="color:#C0524A;">' + msg + '</span>' }
  if (!rent) { warn('此合約月租為 0（或未設定），無法計算退租金'); return { amt: 0, days: 0 } }
  if (!settleD) { warn('請先填「結算日期」'); return { amt: 0, days: 0 } }
  if (!thru) { warn('請先填「已繳租金到期日」'); return { amt: 0, days: 0 } }
  var start = new Date(settleD), end = new Date(thru)
  var amt = 0, days = 0
  var d = new Date(start.getTime() + 86400000)  // 退租日隔天起算
  var guard = 0
  while (d <= end && guard < 1000) {
    var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()  // 當月實際天數
    amt += rent / dim
    days++; guard++
    d = new Date(d.getTime() + 86400000)
  }
  amt = Math.round(amt)
  if (box) {
    box.innerHTML = days > 0
      ? '未住 <b>' + days + '</b> 天，按當月天數退還 <b style="color:#2E7D46;">' + leaseMoney(amt) + '</b>'
      : '<span style="color:#C0524A;">退租日（' + settleD + '）已達或晚於已繳到期日（' + thru + '），無可退天數。請確認「已繳租金到期日」是否晚於退租日。</span>'
  }
  return { amt: amt, days: days }
}
function settleRentRefundSync(showTip) {
  var r = settleRentRefundCalc()
  var name = SETTLE_RENT_REFUND_NAME + '（未住' + r.days + '天）'
  // 找出既有的退租金列（名稱前綴相符）
  var found = null
  document.querySelectorAll('#settleDeductions .settle-ded-row').forEach(function(row) {
    var n = (row.querySelector('.settle-ded-name') || {}).value || ''
    if (n.indexOf(SETTLE_RENT_REFUND_NAME) === 0) found = row
  })
  if (r.amt <= 0 || r.days <= 0) {
    if (found) { found.remove(); settleRecalc() }
    if (showTip) showToast('無可退天數')
    return
  }
  // 退款以負數應扣表示（退款會加回退還金額）
  if (found) {
    found.querySelector('.settle-ded-name').value = name
    found.querySelector('.settle-ded-amt').value = -r.amt
  } else {
    document.getElementById('settleDeductions').insertAdjacentHTML('beforeend', settleDedRow(name, -r.amt))
  }
  settleRecalc()
  if (showTip) showToast('✅ 已帶入退租金 ' + leaseMoney(r.amt))
}

async function openSettleModal(leaseId) {
  var res = await fetch('/admin/api/managed/lease/' + leaseId + '/settle-preview?key=' + encodeURIComponent(KEY))
  if (!res.ok) { showToast('❌ 載入結算資料失敗'); return }
  var p = await res.json()
  var alreadySettled = !!p.settled
  var deposit = alreadySettled ? (p.settleDeposit != null ? p.settleDeposit : p.deposit) : p.deposit
  var prepaid = alreadySettled ? (p.settlePrepaid != null ? p.settlePrepaid : p.prepaidUtility) : p.prepaidUtility
  var deductions = alreadySettled && Array.isArray(p.settleDeductions) ? p.settleDeductions : (p.suggestedDeductions || [])
  var today = leaseDateInput(new Date())
  var leaseEndStr = leaseDateInput(p.leaseEnd)
  var settleDate = leaseDateInput(alreadySettled ? p.settledAt : new Date())
  var earlyChecked = alreadySettled ? !!p.earlyTerminated : false
  // 合約結束日：按原合約迄日為主；已結算沿用既有結束日；提前終止則用結算日
  var endDate = alreadySettled ? leaseDateInput(p.endedAt) : (earlyChecked ? settleDate : (leaseEndStr || today))
  var note = alreadySettled ? (p.settleNote || '') : ''
  // 續約預設：新約起日＝原合約迄日 + 1 天；新約迄日＝起日 + 原合約長度（無則 +1 年）
  var renewStart = p.leaseEnd ? leaseDateInput(new Date(new Date(p.leaseEnd).getTime() + 86400000)) : today
  var durMs = (p.leaseStart && p.leaseEnd) ? (new Date(p.leaseEnd) - new Date(p.leaseStart)) : (365 * 86400000)
  var renewEnd = leaseDateInput(new Date(new Date(renewStart).getTime() + durMs))
  var lastMeter = p.lastMeterDegree || 0
  var meterStart = p.lastMeterDegree || 0
  var meterStartDateStr = p.lastMeterDate ? leaseDate(p.lastMeterDate) : '—'
  var meterRateVal = p.meterRate || 0
  var refundPaidThru = leaseDateInput(p.paidThroughDate || p.leaseEnd)
  window.__settleCtx = { leaseEnd: leaseEndStr, today: today, mode: 'settle', meterStart: meterStart, meterStartDateInput: leaseDateInput(p.lastMeterDate), monthlyRent: Number(p.monthlyRent || 0) }

function saveRenew(leaseId) {
  return new Promise(function(resolve) {
    var newStart = (document.getElementById('settle_newStart') || {}).value
    var newEnd = (document.getElementById('settle_newEnd') || {}).value
    var note = (document.getElementById('settle_renewNote') || {}).value || ''
    if (!newStart) { showToast('❌ 請填新約起日'); resolve(); return }
    showConfirm({
      icon: '📄',
      title: '確定續約並開立新約？',
      msg: '將結束原合約（結束日以原迄日為主）並自動開立一份延續的新合約：\n電費度數延續上期、各項費用沿用，不計退款。',
      okLabel: '確定續約',
      onCancel: function() { resolve() },
      onOk: async function() {
        try {
          var res = await fetch('/admin/api/managed/lease/' + leaseId + '/renew?key=' + encodeURIComponent(KEY), {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ newStart: newStart, newEnd: newEnd, note: note })
          })
          if (!res.ok) { showToast('❌ 續約失敗'); resolve(); return }
          showToast('✅ 已續約並開立新合約')
          var m = document.getElementById('settleModal'); if (m) m.remove()
          await showLeaseList()
        } catch (e) { showToast('❌ 續約失敗') }
        resolve()
      }
    })
  })
}
function saveSettle(leaseId, alreadySettled) {
  return new Promise(function(resolve) {
    // 送出前先確保「最後一期電費」已帶入應扣（避免輸入度數卻漏按帶入）
    if (typeof settleMeterSync === 'function') settleMeterSync()
    var deductions = []
    document.querySelectorAll('#settleDeductions .settle-ded-row').forEach(function(row) {
      var name = (row.querySelector('.settle-ded-name') || {}).value || ''
      var amt = Number((row.querySelector('.settle-ded-amt') || {}).value || 0)
      if (name.trim() || amt) deductions.push({ name: name.trim(), amount: amt })
    })
    var body = {
      settledAt: (document.getElementById('settle_settledAt') || {}).value || null,
      endedAt: (document.getElementById('settle_endedAt') || {}).value || null,
      earlyTerminated: (document.getElementById('settle_early') || {}).checked || false,
      deposit: Number((document.getElementById('settle_deposit') || {}).value || 0),
      prepaid: Number((document.getElementById('settle_prepaid') || {}).value || 0),
      deductions: deductions,
      note: (document.getElementById('settle_note') || {}).value || '',
    }
    // 結算頁若有抄表 → 一併記錄電費明細
    var meterEnd = (document.getElementById('settle_meterEnd') || {}).value
    if (meterEnd !== '' && meterEnd != null) {
      var ctx = window.__settleCtx || {}
      body.meterReading = {
        startDegree: ctx.meterStart || 0,
        startDate: ctx.meterStartDateInput || null,
        endDegree: meterEnd,
        rate: (document.getElementById('settle_meterRate') || {}).value || 0,
        readDate: (document.getElementById('settle_meterDate') || {}).value || null,
      }
    }
    var total = deductions.reduce(function(s, d){ return s + (d.amount || 0) }, 0)
    var refund = body.deposit + body.prepaid - total
    var refundMsg = refund >= 0 ? ('應退還房客 ' + leaseMoney(refund)) : ('房客應補繳 ' + leaseMoney(-refund))
    showConfirm({
      icon: '🧾',
      title: alreadySettled ? '確定修改結算？' : '確定結算並結束合約？',
      msg: refundMsg + (alreadySettled ? '' : '\n結算後合約將結束，門鎖綁定自動解除。'),
      okLabel: alreadySettled ? '確定修改' : '確認結算',
      danger: alreadySettled,
      onCancel: function() { resolve() },
      onOk: async function() {
        try {
          var res = await fetch('/admin/api/managed/lease/' + leaseId + '/settle?key=' + encodeURIComponent(KEY), {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
          })
          if (!res.ok) { showToast('❌ 結算失敗'); resolve(); return }
          showToast('✅ 已結算')
          var m = document.getElementById('settleModal'); if (m) m.remove()
          await showLeaseList()
          // 結算完成後，直接開啟結算明細預覽（可預覽後再確認傳送給房客）
          settleNotify(leaseId)
        } catch (e) { showToast('❌ 結算失敗') }
        resolve()
      }
    })
  })
}
// 傳送結算明細給房客（LINE）：先預覽卡片再確認送出
async function settleNotify(leaseId) {
  // 先取得卡片預覽（不實際推播）
  var preview = null
  try {
    var pres = await fetch('/admin/api/managed/lease/' + leaseId + '/settle-notify?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ preview: true })
    })
    var pd = {}; try { pd = await pres.json() } catch (e) {}
    if (!pres.ok) { showInfoModal('❌ 無法產生預覽', pd.error || ('HTTP ' + pres.status)); return }
    preview = pd.preview
  } catch (e) { showToast('❌ 預覽失敗'); return }
  // 顯示預覽 → 確認後才實際傳送
  showLinePreview('結算明細', preview, async function() {
    try {
      var res = await fetch('/admin/api/managed/lease/' + leaseId + '/settle-notify?key=' + encodeURIComponent(KEY), {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({})
      })
      var d = {}; try { d = await res.json() } catch (e) {}
      if (!res.ok) { showInfoModal('❌ 傳送結算明細失敗', (d.error || ('HTTP ' + res.status)) + '\n\n若顯示 invalid（無效的 to），代表此房客尚未加入該 LINE Bot，或合約內的 LINE userID 有誤。'); return }
      showToast('✅ 已傳送結算明細給房客' + (d.via ? '（' + d.via + '）' : ''))
    } catch (e) { showToast('❌ 傳送結算明細失敗') }
  })
}

async function uploadPaymentReceipt(input, targetId) {
  if (!input.files || !input.files[0]) return
  var file = input.files[0]
  // 更新按鈕文字（保留 input 節點，避免破壞再次選檔）
  var label = input.closest ? input.closest('label') : null
  var txt = (label && label.childNodes.length) ? label.childNodes[0] : null
  var setLbl = function(s){ if (txt) txt.nodeValue = s }
  // 檔案大小上限 10MB（與後端一致）
  if (file.size > 10 * 1024 * 1024) {
    showInfoModal('❌ 檔案過大', '匯款圖為 ' + (file.size/1048576).toFixed(1) + ' MB，超過 10MB 上限。\n請改用截圖，或壓縮後再上傳。')
    input.value = ''
    return
  }
  setLbl('⏳ 上傳中… ')
  var fd = new FormData()
  fd.append('file', file)
  try {
    var res = await fetch('/admin/api/upload?key=' + encodeURIComponent(KEY), { method: 'POST', body: fd })
    var data = {}; try { data = await res.json() } catch(e) {}
    if (!res.ok || !data.url) {
      setLbl('📎 上傳 ')
      showInfoModal('❌ 匯款圖上傳失敗', (data.error || ('HTTP ' + res.status)) + '\n\n請確認網路連線；若持續失敗，可能是圖片格式不支援或伺服器圖床未設定。')
      input.value = ''
      return
    }
    var target = document.getElementById(targetId)
    if (target) target.value = data.url
    setLbl('✅ 已上傳 ')
    // 於欄位顯示檢視連結（可點開確認）
    var td = input.closest ? input.closest('td') : null
    if (td) {
      var prev = td.querySelector('.recv-thumb'); if (prev) prev.remove()
      td.insertAdjacentHTML('beforeend', ' <a href="' + data.url + '" target="_blank" class="recv-thumb" style="font-size:12px;color:#0D5CB8;white-space:nowrap;">🔗 檢視</a>')
    }
    showToast('✅ 匯款圖已上傳，請按儲存')
  } catch(e) {
    setLbl('📎 上傳 ')
    showInfoModal('❌ 匯款圖上傳失敗', '網路連線異常，請稍後再試。')
  }
  input.value = ''
}

async function saveRentPayment(leaseId, key, rentPaymentId) {
  var startEl = document.getElementById(key + '_start')
  var endEl   = document.getElementById(key + '_end')
  var amtEl   = document.getElementById(key + '_amount')
  var ddEl    = document.getElementById(key + '_duedate')
  var body = {
    kind: 'RENT',
    rentPaymentId: rentPaymentId || '',
    periodStart: startEl  ? startEl.value  : '',
    periodEnd:   endEl    ? endEl.value    : '',
    dueDate:     ddEl     ? ddEl.value     : '',
    amount:      amtEl    ? amtEl.value    : 0,
    paidAmount:  val(key + '_paid'),
    paidDate:    val(key + '_date'),
    payMethod:   document.getElementById(key + '_method').value,
    receiptUrl:  val(key + '_receipt')
  }
  if (!body.periodStart || !body.periodEnd || !body.dueDate) { showToast('❌ 請填寫期間起訖與應繳日期'); return }
  var hasPaidAmt = !!(body.paidAmount && Number(body.paidAmount) > 0)
  var hasPaidDate = !!body.paidDate
  // 允許「僅修改應繳金額/應繳日期」而未收款：兩個已繳欄位可都留空；
  // 但若只填其一則提醒補齊，避免半筆收款資料。
  if (hasPaidAmt !== hasPaidDate) { showToast('❌ 請同時填寫已繳金額與繳款日期；若只是修改應繳金額/日期，兩者請留空'); return }
  var res = await fetch('/admin/api/managed/lease/' + leaseId + '/payment?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  var data = {}; try { data = await res.json() } catch(e) {}
  if (!res.ok) { showToast('❌ 儲存失敗：' + (data.error || res.status)); return }
  // 未收款：僅儲存修改，不推播收款確認
  if (!hasPaidAmt) { showToast('✅ 已儲存修改（尚未收款）'); openLeaseLedger(leaseId); return }
  showToast('✅ 租金繳費已儲存')
  // 詢問是否推播「收款確認」給房客
  showConfirm({
    icon: '📩', title: '發送收款確認給房客？',
    msg: '將以 LINE 推播「租金收款確認」給房客（已收金額 NT$ ' + Number(body.paidAmount).toLocaleString() + '）。',
    okLabel: '發送', cancelLabel: '不用',
    onOk: async function() {
      try {
        var r = await fetch('/admin/api/managed/lease/' + leaseId + '/receipt?key=' + encodeURIComponent(KEY), {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ kind: 'RENT', paidAmount: body.paidAmount, paidDate: body.paidDate, payMethod: body.payMethod, periodStart: body.periodStart, periodEnd: body.periodEnd })
        })
        var rd = {}; try { rd = await r.json() } catch(e) {}
        if (!r.ok) showInfoModal('❌ 收款確認發送失敗', (rd.error || ('HTTP ' + r.status)) + '\n\n若顯示 invalid（無效的 to），代表此房客尚未加入該 LINE Bot，或合約內 LINE userID 有誤。')
        else showToast('✅ 已發送收款確認' + (rd.via ? '（' + rd.via + '）' : ''))
      } catch (e) { showToast('❌ 發送失敗') }
      openLeaseLedger(leaseId)
    },
    onCancel: function() { openLeaseLedger(leaseId) }
  })
}

// 將 LINE Flex 卡片近似渲染為 HTML（供傳送前預覽）
var _FLEX_SZ = { xxs:10, xs:11, sm:13, md:15, lg:18, xl:22, xxl:28 }
var _FLEX_SP = { none:0, xs:2, sm:4, md:8, lg:12, xl:16, xxl:20 }
function _flexNode(node, inRow) {
  if (!node || !node.type) return ''
  var mt = 'margin-top:' + (_FLEX_SP[node.margin] || 0) + 'px;'
  if (node.type === 'text') {
    var fs = _FLEX_SZ[node.size] || 15
    var fw = node.weight === 'bold' ? '700' : '400'
    var ta = node.align === 'end' ? 'right' : (node.align === 'center' ? 'center' : 'left')
    var ws = node.wrap ? 'white-space:normal;word-break:break-word;' : 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
    var fl = (inRow && node.flex != null) ? 'flex:' + node.flex + ';min-width:0;' : ''
    return '<div style="font-size:' + fs + 'px;color:' + (node.color || '#333') + ';font-weight:' + fw + ';text-align:' + ta + ';line-height:1.35;' + ws + fl + mt + '">' + esc(node.text || '') + '</div>'
  }
  if (node.type === 'separator') return '<div style="height:1px;background:' + (node.color || '#eee') + ';' + mt + '"></div>'
  if (node.type === 'filler') return ''
  if (node.type === 'box') {
    var isRow = (node.layout === 'horizontal' || node.layout === 'baseline')
    var ai = node.layout === 'baseline' ? 'baseline' : (isRow ? 'center' : 'stretch')
    var bg = node.backgroundColor ? 'background:' + node.backgroundColor + ';' : ''
    var br = node.cornerRadius ? 'border-radius:' + (parseInt(node.cornerRadius) || 0) + 'px;' : ''
    var pd = node.paddingAll ? 'padding:' + (parseInt(node.paddingAll) || 0) + 'px;' : ''
    var fl = (inRow && node.flex != null) ? 'flex:' + node.flex + ';min-width:0;' : ''
    var inner = (node.contents || []).map(function(c){ return _flexNode(c, isRow) }).join('')
    return '<div style="display:flex;flex-direction:' + (isRow ? 'row' : 'column') + ';align-items:' + ai + ';gap:' + (_FLEX_SP[node.spacing] || 0) + 'px;' + bg + br + pd + fl + mt + '">' + inner + '</div>'
  }
  return ''
}
function linePreviewHtml(msg) {
  var b = (msg && msg.contents) ? msg.contents : msg
  if (!b || b.type !== 'bubble') return '<div style="padding:20px;color:#888;text-align:center;">無法預覽此訊息</div>'
  return '<div style="width:300px;max-width:100%;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.15);margin:0 auto;">' +
    (b.header ? _flexNode(b.header, false) : '') +
    (b.body ? _flexNode(b.body, false) : '') +
    (b.footer ? '<div style="border-top:1px solid #eee;">' + _flexNode(b.footer, false) + '</div>' : '') +
  '</div>'
}
function showLinePreview(label, msg, onSend) {
  var html = '<div id="linePreviewModal" class="modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:400;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;">' +
    '<div style="background:#EDE9E3;border-radius:16px;padding:18px;max-width:360px;width:100%;margin:auto;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<h3 style="margin:0;font-size:16px;">📲 預覽 ' + label + ' 提醒</h3>' +
        '<button onclick="var m=document.getElementById(\'linePreviewModal\');if(m)m.remove()" style="border:none;background:none;font-size:22px;cursor:pointer;">×</button>' +
      '</div>' +
      '<div style="font-size:12px;color:#7A756B;margin-bottom:12px;">以下為房客將收到的卡片，確認後傳送：</div>' +
      linePreviewHtml(msg) +
      '<div style="display:flex;gap:8px;margin-top:16px;">' +
        '<button onclick="var m=document.getElementById(\'linePreviewModal\');if(m)m.remove()" style="flex:1;padding:12px;border:1px solid #D8D2C6;background:#fff;border-radius:10px;font-size:14px;cursor:pointer;">取消</button>' +
        '<button id="linePreviewSend" class="spin-btn" style="flex:2;padding:12px;border:none;background:#06C755;color:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">確認傳送</button>' +
      '</div>' +
    '</div></div>'
  var ex = document.getElementById('linePreviewModal'); if (ex) ex.remove()
  document.body.insertAdjacentHTML('beforeend', html)
  var btn = document.getElementById('linePreviewSend')
  btn.onclick = function() {
    btnLoad(btn, async function() {
      await onSend()
      var m = document.getElementById('linePreviewModal'); if (m) m.remove()
    })
  }
}
function sendLeasePaymentReminder(leaseId, kind, amount, dueDate, readingId, periodStart, periodEnd) {
  var label = kind === 'UTILITY' ? '水電' : '租金'
  var payload = { kind: kind, amount: amount, dueDate: dueDate, readingId: readingId || null, periodStart: periodStart || null, periodEnd: periodEnd || null }
  return (async function() {
    // 先取得卡片預覽（不實際推播）
    var preview = null
    try {
      var pres = await fetch('/admin/api/managed/lease/' + leaseId + '/remind?key=' + encodeURIComponent(KEY), {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({ preview: true }, payload))
      })
      var pd = {}; try { pd = await pres.json() } catch(e) {}
      if (!pres.ok) { showInfoModal('❌ 無法產生預覽', pd.error || ('HTTP ' + pres.status)); return }
      preview = pd.preview
    } catch (e) { showToast('❌ 預覽失敗'); return }
    // 顯示預覽 → 確認後才實際傳送
    showLinePreview(label, preview, async function() {
      try {
        var res = await fetch('/admin/api/managed/lease/' + leaseId + '/remind?key=' + encodeURIComponent(KEY), {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
        })
        if (!res.ok) {
          var data = {}; try { data = await res.json() } catch(e) {}
          showInfoModal('❌ LINE 提醒發送失敗', (data.error || ('HTTP ' + res.status)) + '\n\n若顯示 invalid（無效的 to），代表此房客尚未加入該 LINE Bot，或合約內的 LINE userID 有誤。')
        } else {
          var okd = {}; try { okd = await res.json() } catch(e) {}
          showToast('✅ 已發送 LINE 提醒' + (okd.via ? '（' + okd.via + '）' : ''))
        }
      } catch (e) { showToast('❌ 發送失敗') }
    })
  })()
}

async function addLeaseRecord(managedId, leaseId) {
  var amount = val('lease_rec_amount')
  if (!amount) { showToast('❌ 請輸入金額'); return }
  var body = {
    leaseId: leaseId,
    type: document.getElementById('lease_rec_type').value,
    category: document.getElementById('lease_rec_category').value,
    amount: amount,
    recordDate: document.getElementById('lease_rec_date').value,
    description: val('lease_rec_desc')
  }
  var res = await fetch('/admin/api/managed/' + managedId + '/record?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  if (!res.ok) { showToast('❌ 新增失敗'); return }
  showToast('✅ 已新增收支')
  openLeaseLedger(leaseId)
}

async function deleteLeaseRecord(recordId, leaseId) {
  if (!confirm('確定刪除此筆收支？')) return
  var res = await fetch('/admin/api/managed/record/' + recordId + '?key=' + encodeURIComponent(KEY), { method: 'DELETE' })
  if (!res.ok) { showToast('❌ 刪除失敗'); return }
  showToast('✅ 已刪除')
  openLeaseLedger(leaseId)
}
